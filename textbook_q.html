<!DOCTYPE html>
<html lang="ko">
<head>
<script>
/* 탭 전환 시 로그인 화면이 번쩍이는 것을 막는다.
   세션이 있으면 body 그려지기 전에 preauth 표시 → 로그인 박스 숨김 */
(function(){try{
  if(sessionStorage.getItem('stuId')&&sessionStorage.getItem('stuHash'))
    document.documentElement.className+=' preauth';
}catch(e){}})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교재 질문 — 성민T</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="config.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
/* G마켓 산스: 400~500 = Medium, 600~900 = Bold */
@font-face{font-family:'GmarketSans';font-weight:100 500;font-style:normal;font-display:swap;src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff') format('woff')}
@font-face{font-family:'GmarketSans';font-weight:600 900;font-style:normal;font-display:swap;src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff')}

/* ── Soft Studio · 화면 규칙 — student.html과 같은 토큰
   라벤더 = 내 질문(체크) / 민트 = 풀이 영상 / 로즈 = 삭제 */
:root{
  --ground:#FBFAFF;--surface:#FFFFFF;--panel:#F4F2FC;--panel-2:#EEEBFA;
  --border:#E9E5F6;--control:#D9D3F0;
  --ink:#3D3860;--muted:#5C5680;--faint:#6B6690;
  --accent:#6B5FB8;--accent-ink:#5B4FA8;
  --mint:#2E735E;--mint-ink:#2A6352;--mint-fill:#56A08A;--mint-tint:#EAF6F1;
  --rose:#B0497A;--rose-line:#F0C6D8;
  --r-card:20px;--r-inner:14px;
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'GmarketSans','Pretendard','Noto Sans KR',-apple-system,sans-serif;background:var(--ground);color:var(--ink);
  min-height:100vh;-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
button{font-family:inherit}
button:focus-visible,a:focus-visible,.inp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Login */
#loginPage{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px 16px;background:var(--panel)}
.lbox{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:36px 28px 28px;width:100%;max-width:340px;text-align:center}
.lbox .ico{width:52px;height:52px;border-radius:16px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;
  background:var(--accent-ink);color:#fff;font-size:24px;font-weight:700}
.lbox .lbox-t{font-size:22px;font-weight:700;color:var(--ink);letter-spacing:-.4px;margin-bottom:6px}
.lbox .sub{font-size:13px;color:var(--faint);margin-bottom:24px}
.inp{width:100%;height:48px;border:1px solid var(--control);border-radius:var(--r-inner);padding:0 16px;font-size:15px;font-family:inherit;color:var(--ink);
  outline:none;transition:border-color .2s;background:var(--surface)}
.inp::placeholder{color:var(--faint)}
.inp:focus{border-color:var(--accent)}
.lbox .inp{margin-bottom:10px}
.btn-pri{width:100%;height:48px;background:var(--accent-ink);color:#fff;border:none;border-radius:var(--r-inner);font-size:15px;font-weight:700;cursor:pointer;
  transition:background .2s,transform .25s var(--spring)}
.btn-pri:hover{background:#4E4396}
.btn-pri:active{transform:scale(.98)}
.errmsg{color:var(--rose);font-size:13px;margin-top:8px;min-height:18px}
.back-link{display:inline-block;margin-top:14px;font-size:13px;color:var(--faint);text-decoration:none}
.back-link:hover{color:var(--ink)}

/* App */
#app{display:none;max-width:560px;margin:0 auto;padding:0 16px 96px}
.app-bar{display:flex;align-items:center;gap:8px;height:56px}
.app-mark{width:28px;height:28px;border-radius:9px;background:var(--accent-ink);color:#fff;font-size:14px;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex:none}
.app-name{font-size:14px;font-weight:700;color:var(--ink);letter-spacing:-.2px}
.app-name span{color:var(--faint);font-weight:500;margin-left:4px}
.logout-btn{margin-left:auto;background:none;border:1px solid var(--control);color:var(--muted);font-size:12px;border-radius:99px;
  height:32px;padding:0 14px;cursor:pointer;transition:border-color .2s,color .2s}
.logout-btn:hover{border-color:var(--accent);color:var(--ink)}
.hdr{background:var(--panel);border-radius:var(--r-card);padding:20px;margin-bottom:16px}
.hdr-name{font-size:26px;font-weight:700;color:var(--ink);letter-spacing:-.6px;line-height:1.2}
.hdr-sub{font-size:14px;color:var(--muted);margin-top:4px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:20px;margin-bottom:16px}
.card-title{font-size:17px;font-weight:700;color:var(--ink);letter-spacing:-.3px;margin-bottom:12px}
.empty-msg{text-align:center;padding:20px 0;color:var(--faint);font-size:14px;line-height:1.7}

/* 교재 선택 */
.tb-item{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:56px;padding:12px 16px;margin-bottom:8px;
  border-radius:var(--r-inner);background:var(--surface);border:1px solid var(--border);cursor:pointer;transition:border-color .2s,transform .2s var(--spring)}
.tb-item:hover{border-color:var(--accent)}
.tb-item:active{transform:scale(.99)}
.tb-name{font-size:15px;font-weight:700;color:var(--ink);letter-spacing:-.2px}
.tb-cnt{flex:none;font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}

/* 문제 목록 머리 */
.prob-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.prob-head .card-title{margin-bottom:4px}
.tb-current{display:inline-flex;align-items:center;gap:8px;border:none;background:none;padding:0;cursor:pointer;
  font-size:14px;font-weight:500;color:var(--muted);text-align:left}
.tb-toggle{font-size:10px;color:var(--accent-ink);background:var(--panel-2);border-radius:99px;width:22px;height:22px;
  display:inline-flex;align-items:center;justify-content:center;flex:none}
.q-badge{flex:none;white-space:nowrap;font-size:12px;font-weight:700;color:var(--accent-ink);background:var(--panel-2);
  padding:5px 12px;border-radius:99px;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.legend-item{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--faint)}
.legend-dot{width:12px;height:12px;border-radius:4px;flex:none}
.legend-dot.q{background:var(--accent)}
.legend-dot.yt{background:var(--mint-fill)}

/* 내 질문 */
.myq-card{background:var(--panel);border-radius:var(--r-inner);padding:14px;margin-bottom:16px}
.myq-cap{font-size:13px;font-weight:700;color:var(--ink)}
.myq-cap.wait{margin-top:14px;color:var(--muted)}
.myq-row{display:flex;align-items:center;gap:12px;margin-top:8px;border-radius:12px;padding:10px 12px;min-height:52px;
  background:var(--surface);cursor:pointer;transition:transform .2s var(--spring)}
.myq-row:active{transform:scale(.99)}
.myq-row.new{background:var(--mint-tint)}
.myq-ico{flex:none;width:28px;height:28px;border-radius:99px;display:flex;align-items:center;justify-content:center;
  font-size:11px;background:var(--mint-fill);color:#fff}
.myq-ico.q{background:var(--panel-2);color:var(--accent-ink);font-size:13px;font-weight:700}
.myq-body{flex:1;min-width:0}
.myq-t{font-size:14px;color:var(--ink);font-weight:500}
.myq-row.new .myq-t{color:var(--mint-ink);font-weight:700}
.myq-sub{font-size:12px;color:var(--faint);margin-top:2px}
.myq-row.new .myq-sub{color:var(--mint)}
.myq-more{width:100%;height:40px;margin-top:8px;border:none;background:none;color:var(--accent-ink);font-size:13px;font-weight:700;cursor:pointer}
.myq-empty{font-size:13px;color:var(--faint);margin-top:8px;line-height:1.6}
.myq-add{width:100%;height:46px;margin-top:12px;border:1px dashed var(--control);background:var(--surface);color:var(--accent-ink);
  border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;transition:border-color .2s}
.myq-add:hover{border-color:var(--accent)}

/* 문제 칸 */
.prob-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
@media(max-width:360px){.prob-grid{grid-template-columns:repeat(6,1fr)}}
.sec-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-inner);padding:14px 16px;margin-bottom:8px}
.sec-box.open{border-color:var(--control)}
.sec-bar{display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:10px;min-height:36px}
.sec-t{font-size:14px;font-weight:700;color:var(--ink);letter-spacing:-.2px}
.sec-s{font-size:12px;color:var(--faint);margin-top:2px}
.sec-s b{color:var(--accent-ink);font-weight:700}
.sec-chev{font-size:12px;color:var(--faint);transition:transform .25s;flex:none}
.sec-box.open .sec-chev{transform:rotate(180deg);color:var(--accent-ink)}
.sec-body{display:none}
.sec-box.open .sec-body{display:block}
.prob-cell{position:relative;min-height:40px;border-radius:10px;background:var(--surface);border:1px solid var(--control);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 2px;min-width:0;
  cursor:pointer;transition:border-color .2s,transform .2s var(--spring)}
.prob-cell:hover{border-color:var(--accent)}
.prob-cell:active{transform:scale(.94)}
.prob-cell.checked{background:var(--accent);border-color:var(--accent)}
.prob-cell.has-yt{background:var(--mint-fill);border-color:var(--mint-fill)}
.prob-num{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1}
.prob-cell.checked .prob-num,.prob-cell.has-yt .prob-num{color:#fff}
.prob-yt-dot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.9);margin-top:4px;display:none}
.prob-cell.has-yt .prob-yt-dot{display:block}
.prob-x{position:absolute;top:0;right:0;width:18px;height:18px;cursor:pointer}
.prob-x:before,.prob-x:after,.yt-close:before,.yt-close:after{content:'';position:absolute;left:50%;top:50%;width:8px;height:1.5px;border-radius:1px;background:#fff;transform:translate(-50%,-50%) rotate(45deg)}
.prob-x:after,.yt-close:after{transform:translate(-50%,-50%) rotate(-45deg)}

/* 바텀시트 (떠 있는 창이라 그림자 허용) */
.yt-sheet{position:fixed;inset:0;z-index:900;display:none;align-items:flex-end;justify-content:center}
.yt-sheet.open{display:flex}
.yt-overlay{position:absolute;inset:0;background:rgba(45,38,80,.5)}
.yt-panel{position:relative;z-index:1;background:var(--surface);border-radius:24px 24px 0 0;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;
  padding:14px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px -12px rgba(45,38,80,.35);animation:slideUp .25s cubic-bezier(.34,1.2,.64,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.yt-sheet-handle{width:36px;height:4px;background:var(--control);border-radius:4px;margin:0 auto 16px}
.sheet-head{display:flex;align-items:center;gap:8px}
.sheet-title{flex:1;min-width:0;font-size:17px;font-weight:700;color:var(--ink);letter-spacing:-.3px;margin-bottom:4px}
.sheet-sub{font-size:13px;color:var(--muted);margin-bottom:12px}
.sheet-label{font-size:13px;font-weight:700;color:var(--mint);margin-bottom:6px}
.sheet-toggle{flex:none;height:32px;border:1px solid var(--control);background:var(--surface);color:var(--accent-ink);border-radius:99px;
  padding:0 14px;font-size:13px;font-weight:700;cursor:pointer}
.sheet-toggle.on{border-color:var(--rose-line);color:var(--rose)}
.yt-close{position:relative;flex:none;width:36px;height:36px;border:none;border-radius:12px;background:var(--panel);color:var(--accent-ink);
  font-size:14px;cursor:pointer;transition:transform .2s var(--spring)}
.yt-close:active{transform:scale(.9)}
.yt-close:before,.yt-close:after{width:12px;background:var(--accent-ink)}
.yt-embed{display:block;width:100%;aspect-ratio:16/9;border-radius:12px;border:none;margin-top:6px;margin-bottom:16px}
.fq-form{display:flex;flex-direction:column;gap:8px;margin:8px 0 14px}
.fq-row{display:flex;gap:8px}
.fq-row .inp{flex:1;min-width:0}
.fq-photo{flex:1;height:48px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--control);border-radius:var(--r-inner);
  font-size:14px;font-weight:700;color:var(--accent-ink);background:var(--panel);cursor:pointer}
.fq-thumb{display:block;width:100%;max-height:180px;object-fit:contain;border-radius:12px;background:var(--panel)}
.btn-ghost{height:48px;border:1px solid var(--control);background:var(--surface);color:var(--accent-ink);border-radius:var(--r-inner);
  padding:0 16px;font-size:14px;font-weight:700;cursor:pointer}
.btn-ghost.danger{border-color:var(--rose-line);color:var(--rose)}
.btn-ghost.wide{width:100%}

/* ── 하단 탭바 (student.html / textbook_q.html 동일 · 수정 시 양쪽 함께 교체) ── */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:800;display:flex;
  background:#FFFFFF;border-top:1px solid #E9E5F6;
  padding:6px 0 calc(8px + env(safe-area-inset-bottom))}
.tabbar a{flex:1;text-decoration:none;text-align:center;position:relative;min-height:48px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.tabbar a:active{transform:scale(.94)}
.tb-ico{display:flex;line-height:1;color:#6B6690;transition:color .25s}
.tb-ico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tb-lb{font-size:12px;font-weight:500;color:#6B6690;letter-spacing:-.2px;transition:color .25s}
.tabbar a.on .tb-ico{color:#5B4FA8}
.tabbar a.on .tb-lb{color:#5B4FA8;font-weight:700}
.tb-badge{position:absolute;top:2px;left:50%;margin-left:8px;background:#C85F8A;color:#fff;
  font-size:11px;font-weight:700;border-radius:99px;padding:1px 6px;min-width:18px;line-height:16px;display:none}

/* ── 자동 로그인 대기 화면 (student.html / textbook_q.html 동일) ── */
html.preauth #loginPage{display:none !important}
html.preauth #splash{display:flex}
#splash{display:none;position:fixed;inset:0;z-index:9500;
  align-items:center;justify-content:center;background:#FBFAFF}
#splash i{width:32px;height:32px;border-radius:50%;display:block;
  border:3px solid #EEEBFA;border-top-color:#5B4FA8;
  animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="splash"><i></i></div>

<!-- LOGIN -->
<div id="loginPage">
  <div class="lbox">
    <div class="ico">S</div>
    <div class="lbox-t" role="heading" aria-level="1">교재 질문</div>
    <p class="sub">학생 비밀번호를 입력하세요</p>
    <input class="inp" type="password" id="pwInp" placeholder="비밀번호 입력" autocomplete="off"
      onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn-pri" onclick="doLogin()">로그인</button>
    <div class="errmsg" id="errLogin"></div>
    <a href="./main.html" class="back-link">← 홈으로</a>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="app-bar">
    <span class="app-mark">S</span><span class="app-name">성민T<span>학생</span></span>
    <button class="logout-btn" onclick="doLogout()">로그아웃</button>
  </div>
  <div class="hdr">
    <h1 class="hdr-name" id="hdrName">-</h1>
    <div class="hdr-sub" id="hdrSub">교재 질문</div>
  </div>

  <!-- 교재 없을 때 -->
  <div id="noTbMsg" style="display:none">
    <div class="card"><p class="empty-msg">배정된 교재가 없어요.<br>선생님께 교재 배정을 요청하세요.</p></div>
  </div>

  <!-- 교재 선택 -->
  <div id="tbSelectWrap">
    <div class="card">
      <h2 class="card-title">교재 선택</h2>
      <div id="tbSelectList"></div>
    </div>
  </div>

  <!-- 문제 목록 -->
  <div id="probSection" style="display:none">
    <div class="card">
      <div class="prob-head">
        <div>
          <h2 class="card-title">문제 목록</h2>
          <button class="tb-current" onclick="toggleProbBody()"><span id="tbNameDisplay"></span><span id="probCollapseBtn" class="tb-toggle">▲</span></button>
        </div>
        <div id="qCntBadge" class="q-badge">대기 없음</div>
      </div>
      <div id="probBody">
        <div class="legend">
          <span class="legend-item"><i class="legend-dot q"></i>내 질문</span>
          <span class="legend-item"><i class="legend-dot yt"></i>풀이 영상 (눌러서 보기)</span>
        </div>
        <div class="myq-card" id="myQCard"></div>
        <div id="probGrid"></div>
      </div>
    </div>
  </div>
</div>

<!-- 교재에 없는 문제 질문 -->
<div class="yt-sheet" id="freeQSheet" onclick="closeFreeQSheet(event)">
  <div class="yt-overlay"></div>
  <div class="yt-panel">
    <div class="yt-sheet-handle"></div>
    <h2 class="sheet-title">교재에 없는 문제 질문하기</h2>
    <div class="fq-form">
      <input class="inp" id="fqBook" type="text" placeholder="책 이름 (선택)" maxlength="40">
      <div class="fq-row">
        <input class="inp" id="fqPage" type="number" placeholder="페이지" min="1">
        <input class="inp" id="fqProb" type="text" placeholder="문제 번호" maxlength="10">
      </div>
      <div class="fq-row">
        <label for="fqImg" class="fq-photo">사진 첨부</label>
        <input id="fqImg" type="file" accept="image/*" capture="environment" hidden onchange="onFqImgSelect(event)">
        <button id="fqImgClear" class="btn-ghost danger" onclick="clearFqImg()" style="display:none">사진 빼기</button>
      </div>
      <div id="fqImgPreview" style="display:none"><img id="fqImgThumb" class="fq-thumb" alt="첨부한 사진"></div>
    </div>
    <button class="btn-pri" onclick="submitFreeQ()">등록</button>
  </div>
</div>

<!-- 풀이 영상 -->
<div class="yt-sheet" id="ytSheet" onclick="closeYtSheet(event)">
  <div class="yt-overlay"></div>
  <div class="yt-panel">
    <div class="yt-sheet-handle"></div>
    <div class="sheet-head">
      <h2 id="ytSheetTitle" class="sheet-title"></h2>
      <button id="ytSheetToggleBtn" class="sheet-toggle" onclick="toggleProbFromSheet()"></button>
      <button class="yt-close" onclick="closeYtSheet()" aria-label="닫기"></button>
    </div>
    <p id="ytSheetSub" class="sheet-sub"></p>
    <iframe id="ytSheetFrame" class="yt-embed" allowfullscreen></iframe>
  </div>
</div>

<!-- 교재 외 질문 상세 -->
<div class="yt-sheet" id="freeQDetailSheet" onclick="closeFreeQDetailSheet(event)">
  <div class="yt-overlay"></div>
  <div class="yt-panel">
    <div class="yt-sheet-handle"></div>
    <h2 id="fqDetailTitle" class="sheet-title"></h2>
    <p id="fqDetailInfo" class="sheet-sub"></p>
    <div id="fqDetailYt" style="display:none">
      <div class="sheet-label">풀이 영상</div>
      <iframe id="fqDetailFrame" class="yt-embed" allowfullscreen></iframe>
    </div>
    <button class="btn-ghost danger wide" onclick="deleteFreeQFromSheet()">질문 삭제</button>
  </div>
</div>

<script>
var db=null;
var currentStuId=null;
var currentStuName=null;
var assignedTbIds=[];
var activeTbId=null;
var tbData={};
var myQuestions={};
var _freeQDetailId=null;
var _freeQDetailData={};

function getDB(){
  try{
    if(typeof firebase==='undefined') return null;
    if(firebase.apps&&firebase.apps.length>0) return firebase.database();
    if(typeof SM_CONFIG==='undefined'||!SM_CONFIG.apiKey||SM_CONFIG.apiKey.includes('여기에')) return null;
    firebase.initializeApp(SM_CONFIG);
    return firebase.database();
  }catch(e){return null;}
}

async function doLogin(){
  const pw=document.getElementById('pwInp').value;
  if(!pw){document.getElementById('errLogin').textContent='비밀번호를 입력하세요';return;}
  db=getDB();
  if(!db){document.getElementById('errLogin').textContent='서버 연결 실패';return;}
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pw));
  const hash=[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  db.ref('smStudents').once('value',function(s){
    const all=s.val()||{};
    const entry=Object.entries(all).find(([,v])=>v.studentPwHash===hash);
    if(!entry){
      document.getElementById('errLogin').textContent='비밀번호가 올바르지 않습니다';
      return;
    }
    currentStuId=entry[0];
    currentStuName=entry[1].name;
    document.getElementById('hdrSub').textContent=(entry[1].grade||'')+' · '+(entry[1].subj||'수학');
    try{
      sessionStorage.setItem('stuId',currentStuId);
      sessionStorage.setItem('stuHash',hash);
    }catch(e){}
    loadApp();
  });
}

function doLogout(){
  try{ sessionStorage.removeItem('stuId'); sessionStorage.removeItem('stuHash'); }catch(e){}
  currentStuId=null; currentStuName=null; activeTbId=null;
  assignedTbIds=[]; tbData={}; myQuestions={};
  document.getElementById('app').style.display='none';
  document.getElementById('loginPage').style.display='flex';
  document.getElementById('pwInp').value='';
  document.getElementById('errLogin').textContent='';
}

// preauth 해제: 자동 로그인 성공/실패가 확정되면 스플래시를 걷는다
function endPreauth(showLogin){
  document.documentElement.className=document.documentElement.className.replace(/\s*preauth/,'');
  var sp=document.getElementById('splash'); if(sp) sp.style.display='none';
  if(showLogin){
    try{ sessionStorage.removeItem('stuId'); sessionStorage.removeItem('stuHash'); }catch(e){}
    var lp=document.getElementById('loginPage'); if(lp) lp.style.display='flex';
  }
}

function tryAutoLogin(){
  var sid, hash;
  try{ sid=sessionStorage.getItem('stuId'); hash=sessionStorage.getItem('stuHash'); }catch(e){}
  if(!sid||!hash) return false;
  if(!db) db=getDB();          // 자동 로그인 시점에는 아직 db가 없다
  if(!db) return false;
  db.ref('smStudents/'+sid).once('value',function(sn){
    var v=sn.val();
    if(!v||v.studentPwHash!==hash){ endPreauth(true); return; }
    currentStuId=sid; currentStuName=v.name;
    document.getElementById('hdrSub').textContent=(v.grade||'')+' · '+(v.subj||'수학');
    loadApp();
  }).catch(function(){ endPreauth(true); });
  return true;
}

function loadApp(){
  endPreauth(false);
  var _tb=document.querySelector('.tabbar'); if(_tb) _tb.style.display='flex';
  document.getElementById('loginPage').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('hdrName').textContent=currentStuName;

  // 배정 교재 로드 (단일 문자열 또는 배열 모두 처리)
  db.ref('smTbAssign/'+currentStuId).once('value',function(s){
    const val=s.val();
    if(!val){showNoTb();return;}
    if(Array.isArray(val)) assignedTbIds=val.filter(Boolean);
    else if(typeof val==='string') assignedTbIds=[val];
    else assignedTbIds=Object.values(val).filter(Boolean);
    if(!assignedTbIds.length){showNoTb();return;}
    loadTextbooks();
  });
}

function showNoTb(){
  document.getElementById('noTbMsg').style.display='block';
  document.getElementById('probSection').style.display='none';
  loadFreeQList();
}

function loadTextbooks(){
  var loaded=0;
  tbData={};
  assignedTbIds.forEach(function(tbId){
    db.ref('smTextbooks/'+tbId).once('value',function(s){
      if(s.val()) tbData[tbId]=s.val();
      loaded++;
      if(loaded===assignedTbIds.length) onTbLoaded();
    });
  });
}

function onTbLoaded(){
  var ids=Object.keys(tbData);
  if(!ids.length){showNoTb();return;}
  loadFreeQList();
  var html='';
  ids.forEach(function(tbId){
    var tb=tbData[tbId];
    var cnt=Object.keys(tb.problems||{}).length;
    html+='<div class="tb-item" onclick="selectTb(\''+tbId+'\')">'+
      '<div><div class="tb-name">'+tb.title+'</div></div>'+
      '<div class="tb-cnt">'+cnt+'문제</div></div>';
  });
  document.getElementById('tbSelectList').innerHTML=html;
}

// 문제 목록(교재 단위) 접기/펼치기
function toggleProbBody(){
  var body=document.getElementById('probBody');
  var icon=document.getElementById('probCollapseBtn');
  if(!body) return;
  var hidden=body.style.display==='none';
  body.style.display=hidden?'':'none';
  if(icon) icon.textContent=hidden?'▲':'▼';
}

function selectTb(tbId){
  activeTbId=tbId;
  var _pb=document.getElementById('probBody');
  if(_pb) _pb.style.display='';
  var _pi=document.getElementById('probCollapseBtn');
  if(_pi) _pi.textContent='▲';
  document.getElementById('noTbMsg').style.display='none';
  document.getElementById('probSection').style.display='block';
  loadFreeQList();

  var tb=tbData[tbId];
  document.getElementById('tbNameDisplay').textContent=tb.title;
  Promise.all([
    db.ref('smTbQuestions/'+tbId+'/'+currentStuId).once('value'),
    db.ref('smTbSeen/'+currentStuId+'/'+tbId).once('value')
  ]).then(function(r){
    var mine=r[0].val()||{};
    mySeen=r[1].val()||{};
    myQuestions={};
    Object.keys(mine).forEach(function(probNum){ myQuestions[probNum]=true; });
    renderGrid(tb);
  });
}

function renderGrid(tb){
  var problems=tb.problems||{};
  var nums=Object.keys(problems);
  // 표시 순서: ord(JSON 작성 순서) 우선, 없으면 숫자/문자 정렬
  nums.sort(function(a,b){
    var oa=(problems[a]||{}).ord, ob=(problems[b]||{}).ord;
    if(oa!=null&&ob!=null) return oa-ob;
    var na=parseFloat(a), nb=parseFloat(b);
    if(!isNaN(na)&&!isNaN(nb)&&String(na)===a&&String(nb)===b) return na-nb;
    return a.localeCompare(b,'ko');
  });
  var html='';

  // 단원과 무관하게 50문항 단위로 끊어서 접이식 구성
  var CHUNK=50;
  var disp=function(n){ var p=problems[n]||{}; return p.num||n; };
  if(nums.length<=CHUNK){
    var inner='';
    nums.forEach(function(n){ inner+=buildCell(n,problems[n]||{},disp(n)); });
    html+='<div class="prob-grid">'+inner+'</div>';
  }else{
    for(var i=0;i<nums.length;i+=CHUNK){
      var part=nums.slice(i,i+CHUNK);
      var qn=part.filter(function(n){return !!myQuestions[n];}).length;
      var inner2='';
      part.forEach(function(n){ inner2+=buildCell(n,problems[n]||{},disp(n)); });
      var label=disp(part[0])+' ~ '+disp(part[part.length-1]);
      html+=secBox('c'+i,label,part.length+'문항'+(qn?' · <b>질문 '+qn+'</b>':''),inner2,qn>0);
    }
  }
  document.getElementById('probGrid').innerHTML=html||'<div class="empty-msg">문제가 없습니다</div>';
  renderMyQ(tb);
  updateQCnt();
}

var mySeen={}, _myqExpand=false, _freeQAll={};
function openFreeQSheet(){ document.getElementById('freeQSheet').classList.add('open'); }
function closeFreeQSheet(e){
  if(e && e.target && e.target.closest && e.target.closest('.yt-panel')) return;
  document.getElementById('freeQSheet').classList.remove('open');
}
// 상단 '내 질문' 카드: 새 영상은 전부, 답변 대기는 개수 + 최근 3개
function renderMyQ(tb){
  var problems=tb.problems||{};
  var host=document.getElementById('myQCard');
  if(!host) return;
  var fresh=[], waiting=[];
  Object.keys(myQuestions).forEach(function(n){
    var p=problems[n]||{};
    var lb=(p.section?p.section+' · ':'')+(p.num||n);
    var pg=p.page?p.page+'p':'';
    if(p.youtubeUrl && isNewVideo(p.ytAt, mySeen[n])) fresh.push({n:n,lb:lb,pg:pg});
    else if(!p.youtubeUrl) waiting.push({n:n,lb:lb,pg:pg});
  });
  // 기타 질문도 같은 목록으로
  Object.keys(_freeQAll).forEach(function(id){
    var q=_freeQAll[id]||{};
    var lb=q.bookName||'사진 질문';
    if(q.probNum) lb+=' · '+q.probNum+'번';
    var pg=q.page?q.page+'p':'';
    if(q.youtubeUrl && isNewVideo(q.ytAt, q.seenAt)) fresh.push({fq:id,lb:lb,pg:pg});
    else if(!q.youtubeUrl) waiting.push({fq:id,lb:lb,pg:pg,img:!!q.hasImage});
  });
  var addBtn='<button class="myq-add" onclick="openFreeQSheet()">＋ 교재에 없는 문제 질문하기</button>';
  if(!fresh.length && !waiting.length){
    host.innerHTML='<div class="myq-cap">내 질문</div><div class="myq-empty">아직 표시한 문제가 없어요. 아래에서 모르는 문제를 눌러 보세요.</div>'+addBtn;
    return;
  }
  var h='<div class="myq-cap">내 질문</div>';
  var shownF = _myqExpand ? fresh : fresh.slice(0,5);
  shownF.forEach(function(q){
    h+='<div class="myq-row new" onclick="'+(q.fq?'openFreeQDetail(\''+q.fq+'\')':'openYtSheet(\''+q.n+'\')')+'">'+
       '<span class="myq-ico">▶</span><div class="myq-body">'+
       '<div class="myq-t">'+q.lb+'</div>'+
       '<div class="myq-sub">'+(q.pg?q.pg+' · ':'')+'영상 도착</div></div></div>';
  });
  if(fresh.length>5 && !_myqExpand)
    h+='<button class="myq-more" onclick="_myqExpand=true;renderMyQ(tbData[activeTbId])">영상 '+(fresh.length-5)+'개 더 보기</button>';
  if(waiting.length){
    h+='<div class="myq-cap wait">답변 대기 '+waiting.length+'개</div>';
    waiting.slice(0,3).forEach(function(q){
      h+='<div class="myq-row" onclick="'+(q.fq?'openFreeQDetail(\''+q.fq+'\')':'toggleProb(\''+q.n+'\')')+'">'+
         '<span class="myq-ico q">'+(q.img?'▣':'?')+'</span><div class="myq-body">'+
         '<div class="myq-t">'+q.lb+'</div>'+
         '<div class="myq-sub">'+(q.pg?q.pg+' · ':'')+(q.fq?'답변 대기':'눌러서 질문 해제')+'</div></div></div>';
    });
    if(waiting.length>3)
      h+='<div class="myq-empty">나머지 '+(waiting.length-3)+'개는 아래 단원에서 보라색으로 표시돼요</div>';
  }
  host.innerHTML=h+addBtn;
}

// 접이식 섹션 상자
function secBox(id,title,sub,inner,open){
  return '<div class="sec-box'+(open?' open':'')+'" id="sec_'+id+'">'+
    '<div class="sec-bar" onclick="toggleSec(\''+id+'\')">'+
      '<div><div class="sec-t">'+title+'</div><div class="sec-s">'+sub+'</div></div>'+
      '<span class="sec-chev">▼</span>'+
    '</div>'+
    '<div class="sec-body"><div class="prob-grid">'+inner+'</div></div>'+
  '</div>';
}
function toggleSec(id){
  var el=document.getElementById('sec_'+id);
  if(el) el.classList.toggle('open');
}

function buildCell(num,p,displayNum){
  if(displayNum===undefined) displayNum=num;
  var hasYt=!!(p&&p.youtubeUrl);
  var isChecked=!!myQuestions[num];
  var cls='prob-cell'+(isChecked?' checked':'')+(hasYt?' has-yt':'');
  // 영상 있으면 클릭=영상, 없으면 클릭=체크토글
  var action=hasYt?'openYtSheet(\''+num+'\')':'toggleProb(\''+num+'\')';
  return '<div class="'+cls+'" onclick="'+action+'" data-num="'+num+'">'+
    '<div class="prob-num">'+displayNum+'</div>'+
    '<div class="prob-yt-dot"></div>'+
    (isChecked&&hasYt?'<div class="prob-x" onclick="event.stopPropagation();toggleProb(\''+num+'\')" title="체크 해제" aria-label="체크 해제"></div>':'')+
    '</div>';
}

function toggleProb(num){
  if(!activeTbId||!currentStuId) return;
  var isChecked=!!myQuestions[num];
  if(isChecked){
    myQuestions[num]=false;
    db.ref('smTbQuestions/'+activeTbId+'/'+currentStuId+'/'+num).remove();
  }else{
    myQuestions[num]=true;
    db.ref('smTbQuestions/'+activeTbId+'/'+currentStuId+'/'+num).set({
      checkedAt:Date.now()
    });
  }
  // 셀 재빌드
  var cell=document.querySelector('[data-num="'+num+'"]');
  if(cell&&activeTbId){
    var tb=tbData[activeTbId]||{};
    var _p=(tb.problems||{})[num]||{};
    var newCell=buildCell(num,_p,_p.num||num);
    var tmp=document.createElement('div');
    tmp.innerHTML=newCell;
    cell.parentNode.replaceChild(tmp.firstChild,cell);
  }
  updateQCnt();
}


var ytSheetNum=null;
// 영상을 연 시각을 기록. ytAt(등록 시각) > seenAt 이면 '새 영상'으로 본다.
function markVideoSeen(tbId, num){
  if(!tbId || !num || !currentStuId) return;
  db.ref('smTbQuestions/'+tbId+'/'+currentStuId+'/'+num).once('value').then(function(sn){
    if(sn.val()===null) return;   // 질문 체크가 없으면 기록하지 않음
    db.ref('smTbSeen/'+currentStuId+'/'+tbId+'/'+num).set(Date.now()).catch(function(){});
  }).catch(function(){});
}
function markFreeQSeen(id){
  if(!id || !currentStuId) return;
  db.ref('smFreeQuestions/'+currentStuId+'/'+id+'/seenAt').set(Date.now()).catch(function(){});
}
// 새 영상 여부 (등록 시각이 없으면 기존 영상 -> 새것 아님)
function isNewVideo(ytAt, seenAt){
  if(!ytAt) return false;
  return !seenAt || ytAt > seenAt;
}

function openYtSheet(num){
  var tb=tbData[activeTbId]||{};
  var p=(tb.problems||{})[num]||{};
  if(!p.youtubeUrl) return;
  ytSheetNum=num;
  markVideoSeen(activeTbId, num);
  var url=p.youtubeUrl;
  var embedUrl=url.replace('watch?v=','embed/').replace('youtu.be/','www.youtube.com/embed/');
  if(embedUrl.includes('?')) embedUrl=embedUrl.split('?')[0];
  var _dispNum=((tb.problems||{})[num]||{}).num||num;
  document.getElementById('ytSheetTitle').textContent=(tb.title||'')+' · '+_dispNum+'번 문제';
  document.getElementById('ytSheetSub').textContent=p.title||'풀이 영상';
  document.getElementById('ytSheetFrame').src=embedUrl;
  document.getElementById('ytSheet').classList.add('open');
  updateYtSheetBtn();
}
function updateYtSheetBtn(){
  var btn=document.getElementById('ytSheetToggleBtn');
  if(!btn||ytSheetNum===null) return;
  var isChecked=!!myQuestions[ytSheetNum];
  btn.textContent=isChecked?'질문 해제':'질문으로 표시';
  btn.className='sheet-toggle'+(isChecked?' on':'');
}
function toggleProbFromSheet(){
  if(ytSheetNum===null) return;
  toggleProb(ytSheetNum);
  updateYtSheetBtn();
}
function closeYtSheet(e){
  // 이 시트의 바깥 영역 또는 닫기 버튼(인자 없음)일 때만 닫는다
  if(e===undefined||(e&&e.target===document.querySelector('#ytSheet .yt-overlay'))){
    document.getElementById('ytSheet').classList.remove('open');
    document.getElementById('ytSheetFrame').src='';
    ytSheetNum=null;
  }
}


var _fqImgData=null;
function compressFqImage(file,cb){
  var reader=new FileReader();
  reader.onload=function(ev){
    var img=new Image();
    img.onload=function(){
      var MAX=1000,w=img.width,h=img.height;
      if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
      if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}
      var cv=document.createElement('canvas');
      cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      cb(cv.toDataURL('image/jpeg',0.7));
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}
function onFqImgSelect(e){
  var file=e.target.files[0];
  if(!file) return;
  compressFqImage(file,function(data){
    _fqImgData=data;
    document.getElementById('fqImgThumb').src=data;
    document.getElementById('fqImgPreview').style.display='';
    document.getElementById('fqImgClear').style.display='';
  });
}
function clearFqImg(){
  _fqImgData=null;
  document.getElementById('fqImg').value='';
  document.getElementById('fqImgPreview').style.display='none';
  document.getElementById('fqImgClear').style.display='none';
}
function submitFreeQ(){
  if(!currentStuId) return;
  var book=(document.getElementById('fqBook').value||'').trim();
  var page=(document.getElementById('fqPage').value||'').trim();
  var prob=(document.getElementById('fqProb').value||'').trim();
  if(!book&&!page&&!prob&&!_fqImgData){alert('내용을 입력하거나 사진을 첨부해 주세요');return;}
  var ref=db.ref('smFreeQuestions/'+currentStuId).push();
  var data={bookName:book,page:page,probNum:prob,stuName:currentStuName,createdAt:Date.now(),hasImage:!!_fqImgData};
  ref.set(data).then(function(){
    if(_fqImgData) db.ref('smFreeQImages/'+currentStuId+'/'+ref.key).set(_fqImgData);
    document.getElementById('fqBook').value='';
    document.getElementById('fqPage').value='';
    document.getElementById('fqProb').value='';
    clearFqImg();
    closeFreeQSheet();
    loadFreeQList();
  });
}
function loadFreeQList(){
  if(!currentStuId) return;
  db.ref('smFreeQuestions/'+currentStuId).orderByChild('createdAt').once('value',function(s){
    var items=s.val()||{};
    _freeQDetailData={}; _freeQAll={};
    Object.entries(items).sort(function(a,b){return b[1].createdAt-a[1].createdAt;})
      .forEach(function(e){ _freeQDetailData[e[0]]=e[1]; _freeQAll[e[0]]=e[1]; });
    if(activeTbId && tbData[activeTbId]){ renderMyQ(tbData[activeTbId]); updateQCnt(); }
  });
}
function openFreeQDetail(id){
  _freeQDetailId=id;
  var q=_freeQDetailData[id]||{};
  if(q.youtubeUrl) markFreeQSeen(id);
  document.getElementById('fqDetailTitle').textContent=q.bookName||'사진 질문';
  document.getElementById('fqDetailInfo').textContent=[q.page?q.page+'p':'',q.probNum?q.probNum+'번':''].filter(Boolean).join(' · ')||(q.youtubeUrl?'풀이 영상이 도착했어요':'답변 대기 중');
  var ytWrap=document.getElementById('fqDetailYt');
  var ytFrame=document.getElementById('fqDetailFrame');
  if(q.youtubeUrl){
    var url=q.youtubeUrl;
    var embed=url.replace('watch?v=','embed/').replace('youtu.be/','www.youtube.com/embed/');
    if(embed.includes('?')) embed=embed.split('?')[0];
    ytFrame.src=embed;
    ytWrap.style.display='block';
  }else{
    ytFrame.src='';
    ytWrap.style.display='none';
  }
  document.getElementById('freeQDetailSheet').classList.add('open');
}
function closeFreeQDetailSheet(e){
  if(!e||e.target===document.querySelector('#freeQDetailSheet .yt-overlay')){
    document.getElementById('freeQDetailSheet').classList.remove('open');
    document.getElementById('fqDetailFrame').src='';
  }
}
function deleteFreeQFromSheet(){
  if(!_freeQDetailId) return;
  db.ref('smFreeQuestions/'+currentStuId+'/'+_freeQDetailId).remove().then(function(){
    document.getElementById('freeQDetailSheet').classList.remove('open');
    loadFreeQList();
  });
}
function updateQCnt(){
  // 전체가 아니라 '아직 해결 안 된' 개수 (영상이 등록되지 않은 질문)
  var tb=tbData[activeTbId]||{};
  var problems=tb.problems||{};
  var cnt=0;
  Object.keys(myQuestions).forEach(function(n){
    if(!myQuestions[n]) return;
    if(!(problems[n]||{}).youtubeUrl) cnt++;
  });
  Object.keys(_freeQAll).forEach(function(id){
    if(!(_freeQAll[id]||{}).youtubeUrl) cnt++;
  });
  document.getElementById('qCntBadge').textContent = cnt ? (cnt+'개 대기') : '대기 없음';
}
</script>

<script>
(function(){
  var url=new URL(location.href);
  var urlVer=url.searchParams.get('_v');
  if(urlVer){localStorage.setItem('smv',urlVer);url.searchParams.delete('_v');history.replaceState(null,'',url.toString());}
  function getDB(){try{if(typeof firebase==='undefined')return null;if(firebase.apps&&firebase.apps.length>0)return firebase.database();if(typeof SM_CONFIG==='undefined'||!SM_CONFIG.apiKey||SM_CONFIG.apiKey.includes('여기에'))return null;firebase.initializeApp(SM_CONFIG);return firebase.database();}catch(e){return null;}}
  var _smvRef=null;
  function doCheck(){var db=getDB();if(!db||_smvRef)return;_smvRef=db.ref('smAppVersion');_smvRef.on('value',function(s){var sv=String(s.val()||'');if(!sv)return;var lv=localStorage.getItem('smv')||'';if(lv===sv)return;if(location.search.indexOf('_v='+sv)!==-1)return;location.replace(location.pathname+'?_v='+sv);});}
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',doCheck);}else{doCheck();}
  // DB 준비 후 자동 로그인 시도
  (function(){
    var tries=0;
    (function attempt(){
      var ok=false;
      try{ ok=tryAutoLogin(); }catch(e){}
      if(!ok && ++tries<20) setTimeout(attempt,150);   // 최대 3초간 재시도
      else if(!ok) endPreauth(true);                    // 끝내 실패 → 로그인
    })();
  })();
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')doCheck();});
})();
</script>
