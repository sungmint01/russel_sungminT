<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교재 질문 — 성민T</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="config.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
:root{
  --bg:#FBFAFF;--surface:#fff;--fg:#1E1B3A;--fg2:#6A6688;--fg3:#A8A4C0;
  --p1:#8B7FD9;--p2:#A89BEB;--p3:#C7BEF3;
  --warm:#E8795A;--cool:#56A08A;
  --shadow:rgba(120,105,205,.12);
  --border:rgba(120,100,200,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background-image:radial-gradient(circle at 12% 8%,rgba(240,166,196,.10) 0%,transparent 42%),radial-gradient(circle at 88% 92%,rgba(139,127,217,.10) 0%,transparent 45%);font-family:'Pretendard','Noto Sans KR',-apple-system,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(ellipse 60% 40% at 10% 0%,rgba(155,143,224,.12) 0%,transparent 60%),
  radial-gradient(ellipse 50% 40% at 90% 100%,rgba(86,160,138,.08) 0%,transparent 60%)}

/* LOGIN */
#loginPage{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:linear-gradient(150deg,#8B7FD9 0%,#A89BEB 45%,#D4A5C8 100%)}
.lbox{background:#fff;border-radius:26px;padding:42px 34px;width:320px;max-width:100%;box-shadow:0 1px 2px rgba(120,105,205,.06),0 16px 40px -12px rgba(120,105,205,.32);text-align:center}
.lbox .ico{color:#fff;font-weight:800;width:60px;height:60px;background:linear-gradient(135deg,#8B7FD9,#A89BEB);border-radius:19px;display:flex;align-items:center;justify-content:center;font-size:27px;margin:0 auto 18px;box-shadow:0 8px 20px rgba(139,127,217,.35)}
.lbox-badge{display:none;font-family:inherit;font-size:10px;font-weight:600;
  letter-spacing:2.5px;text-transform:uppercase;color:var(--p1);background:rgba(157,145,238,.1);
  padding:4px 12px;border-radius:20px;margin-bottom:18px}
.lbox h1{font-family:'MaruBuri','Pretendard',sans-serif;font-size:22px;margin-bottom:4px;background:linear-gradient(135deg,#8B7FD9,#A89BEB);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.lbox .sub{font-size:10px;color:#AAA5C8;letter-spacing:2px;margin-bottom:28px;text-transform:uppercase}
.inp{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;
  font-size:14px;font-family:inherit;color:var(--fg);background:#fff;outline:none;transition:.15s}
.inp:focus{border-color:var(--p1);box-shadow:0 0 0 3px rgba(157,145,238,.15)}
.btn-pri{width:100%;padding:13px;background:linear-gradient(135deg,#8B7FD9,#A89BEB);border:none;
  border-radius:12px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;
  margin-top:12px;letter-spacing:-.2px;transition:.15s}
.btn-pri:hover{opacity:.92}
.errmsg{font-size:12px;color:var(--warm);margin-top:8px;min-height:18px}
.back-link{display:block;text-align:center;font-size:13px;color:var(--fg3);margin-top:16px;
  text-decoration:none}
.back-link:hover{color:var(--fg2)}

/* APP */
#app{display:none;max-width:560px;margin:0 auto;padding:0 14px 88px}

/* HEADER */
.hdr{background:linear-gradient(168deg,#453D78 0%,#5B51A0 38%,#7A6DC9 72%,#9A8CE0 100%);
  padding:26px 22px 30px;margin:12px 0 0;position:relative;overflow:hidden;border-radius:26px;
  box-shadow:0 2px 6px rgba(70,60,130,.14),0 14px 34px -12px rgba(70,60,130,.40)}
.hdr::before{content:'';position:absolute;width:260px;height:260px;
  background:radial-gradient(circle,rgba(255,255,255,.16),transparent 68%);
  top:-110px;right:-70px;pointer-events:none}
.hdr::after{content:'';position:absolute;width:180px;height:180px;
  background:radial-gradient(circle,rgba(240,166,196,.20),transparent 70%);
  bottom:-90px;left:-50px;pointer-events:none}
.hdr-inner{position:relative;z-index:2}
.hdr-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);border-radius:99px;padding:5px 13px;
  font-size:9.5px;font-weight:700;color:rgba(255,255,255,.82);letter-spacing:1.6px;margin-bottom:15px}
.hdr-badge:before{content:'';width:5px;height:5px;border-radius:50%;background:#9DD9C4;
  box-shadow:0 0 0 3px rgba(157,217,196,.28)}
.hdr-name{font-family:'MaruBuri','Pretendard',sans-serif;font-size:27px;color:#fff;margin-bottom:5px;
  letter-spacing:-.5px;text-shadow:0 2px 12px rgba(40,30,90,.22)}
.hdr-sub{font-size:12.5px;color:rgba(255,255,255,.68);letter-spacing:-.1px}
.logout-btn{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.15);
  border:none;padding:6px 12px;border-radius:20px;color:#fff;font-size:12px;cursor:pointer;
  font-family:inherit;font-weight:500;z-index:10}

/* BODY */
.body{padding:16px 0 0}

.card{position:relative;background:var(--surface);border-radius:22px;padding:18px 19px;margin-bottom:13px;overflow:hidden;
  box-shadow:0 1px 2px rgba(120,105,205,.06),0 10px 28px -10px rgba(120,105,205,.22)}
.card:before{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,transparent 0 25px,rgba(107,95,184,.035) 25px 26px)}
.card>*{position:relative}
.card-title{font-size:10px;font-weight:700;letter-spacing:1.4px;color:#8B7FD9;margin-bottom:12px}

/* TB SELECTOR */
.tb-item{padding:13px 15px;border-radius:15px;background:#FBFAFE;cursor:pointer;
  margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;
  border:1px solid rgba(139,127,217,.10);transition:.22s cubic-bezier(.34,1.56,.64,1)}
.tb-item:hover{border-color:rgba(139,127,217,.35);transform:translateY(-2px);box-shadow:0 6px 16px rgba(120,105,205,.13)}
.tb-item.selected{border-color:transparent;background:linear-gradient(140deg,#F4F1FE,#E8E2FA);box-shadow:0 0 0 1.5px #A89BEB}
.tb-name{font-size:14px;font-weight:700;color:#3D3860;letter-spacing:-.2px}
.tb-cnt{font-size:11px;color:#AAA5C8;font-variant-numeric:tabular-nums}
.tb-toggle{font-size:10px;color:#8B7FD9;font-weight:700;line-height:1;
  background:rgba(139,127,217,.10);border-radius:99px;width:19px;height:19px;
  display:inline-flex;align-items:center;justify-content:center;transition:.2s}
.tb-toggle:hover{background:rgba(139,127,217,.2)}

/* PROBLEM GRID */
.prob-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:9px}
.sec-box{position:relative;background:#fff;border-radius:18px;padding:14px 16px;margin-bottom:8px;overflow:hidden;
  box-shadow:0 1px 2px rgba(120,105,205,.05),0 8px 20px -9px rgba(120,105,205,.20);
  transition:box-shadow .25s ease}
.sec-box:before{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,transparent 0 25px,rgba(107,95,184,.035) 25px 26px)}
.sec-box>*{position:relative}
.sec-box.open{box-shadow:0 1px 2px rgba(120,105,205,.06),0 12px 28px -10px rgba(120,105,205,.26)}
.sec-bar{display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:10px}
.sec-t{font-size:13px;font-weight:700;color:#3D3860;letter-spacing:-.2px}
.sec-s{font-size:10.5px;color:#AAA5C8;margin-top:3px}
.sec-s b{color:#8B7FD9;font-weight:700}
.sec-chev{font-size:13px;color:#C4C0DA;transition:transform .25s;flex-shrink:0}
.sec-box.open .sec-chev{transform:rotate(180deg);color:#8B7FD9}
.sec-body{display:none}
.sec-box.open .sec-body{display:block}
.myq-card{position:relative;background:#fff;border-radius:20px;padding:16px 17px;margin-bottom:14px;overflow:hidden;
  box-shadow:0 1px 2px rgba(120,105,205,.06),0 10px 26px -10px rgba(120,105,205,.24)}
.myq-card:before{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,transparent 0 25px,rgba(107,95,184,.04) 25px 26px)}
.myq-card:after{content:'';position:absolute;top:0;bottom:0;left:13px;width:1px;background:rgba(240,166,196,.26)}
.myq-card>*{position:relative}
.myq-cap{font-size:10px;letter-spacing:1.4px;font-weight:700;color:#8B7FD9}
.myq-row{display:flex;align-items:center;gap:10px;margin-top:8px;border-radius:13px;padding:10px 12px;
  background:#F7F5FE;cursor:pointer;transition:.2s}
.myq-row:hover{transform:translateY(-1px)}
.myq-row.new{background:linear-gradient(140deg,#EDF9F4,#DCF0E7)}
.myq-ico{font-size:15px;flex-shrink:0}
.myq-t{font-size:12.5px;color:#4A4370;font-weight:600}
.myq-row.new .myq-t{color:#2F6B57}
.myq-sub{font-size:10.5px;color:#AAA5C8;margin-top:2px}
.myq-row.new .myq-sub{color:#6BA894}
.myq-more{width:100%;margin-top:9px;border:none;background:none;color:#8B7FD9;font-size:11.5px;
  font-weight:700;font-family:inherit;cursor:pointer;padding:6px}
.myq-empty{font-size:11.5px;color:#C4C0DA;margin-top:9px}
.myq-add{width:100%;margin-top:11px;border:1px dashed rgba(139,127,217,.35);background:#fff;color:#8B7FD9;
  border-radius:13px;padding:11px;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;transition:.2s}
.myq-add:hover{background:#F7F5FE;border-color:#A89BEB}
@media(max-width:360px){.prob-grid{grid-template-columns:repeat(6,1fr)}}
/* prob-cell: 기본=회색, 체크=빨강, 영상=초록, 둘다=초록테두리+빨강배경 */
.prob-cell{position:relative;border-radius:10px;
  background:#fff;border:1px solid rgba(139,127,217,.16);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;transition:.2s cubic-bezier(.34,1.56,.64,1);padding:7px 4px;min-width:0}
.prob-cell:hover{border-color:rgba(139,127,217,.4);transform:translateY(-1px);box-shadow:0 4px 10px rgba(120,105,205,.13)}
.prob-cell.checked{background:#8B7FD9;border-color:#8B7FD9;box-shadow:0 2px 8px rgba(139,127,217,.28)}
.prob-cell.has-yt{background:#7FC7AC;border-color:#7FC7AC;box-shadow:0 2px 8px rgba(86,160,138,.26)}
.prob-cell.checked.has-yt{background:#7FC7AC;border-color:#7FC7AC}
.prob-num{font-family:inherit;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;
  color:var(--fg);line-height:1}
.prob-cell.checked .prob-num{color:#fff}
.prob-cell.has-yt .prob-num{color:#fff}
.prob-cell.checked.has-yt .prob-num{color:#fff}
.prob-yt-dot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.85);margin-top:3px;display:none}
.prob-cell.has-yt .prob-yt-dot{display:block}
/* 영상 있으면 클릭 가능 커서 강조 */
.prob-cell.has-yt{cursor:pointer}

/* YOUTUBE PANEL */
.yt-panel{background:var(--surface);border-radius:18px;padding:16px;
  box-shadow:0 4px 24px var(--shadow);margin-bottom:14px}
.yt-title{font-family:inherit;font-size:10px;font-weight:700;
  letter-spacing:1.5px;color:var(--fg3);text-transform:uppercase;margin-bottom:10px}
.yt-item{display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:rgba(232,121,90,.06);border:1.5px solid rgba(232,121,90,.2);
  border-radius:12px;margin-bottom:8px;text-decoration:none}
.yt-item:hover{background:rgba(232,121,90,.12)}
.yt-play{width:32px;height:32px;background:var(--warm);border-radius:50%;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.yt-play::after{content:'▶';color:#fff;font-size:10px;margin-left:2px}
.yt-info{flex:1}
.yt-prob{font-family:inherit;font-size:10px;color:#8B7FD9;font-variant-numeric:tabular-nums;
  font-weight:600;letter-spacing:.5px;margin-bottom:1px}
.yt-empty{font-size:13px;color:var(--fg3);font-style:italic;padding:8px 0;font-weight:300}

/* LEGEND */
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--fg2)}
.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}

/* EMPTY */
.empty-msg{text-align:center;padding:32px;color:var(--fg3);font-size:13px;font-weight:300}

/* 범위 선택 */
.range-bar{background:var(--surface);border-radius:14px;padding:12px 14px;
  box-shadow:0 2px 12px var(--shadow);margin-bottom:10px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.range-inp{width:64px;padding:7px 8px;border:1.5px solid var(--border);border-radius:8px;
  font-size:13px;font-family:inherit;color:var(--fg);text-align:center;outline:none}
.range-inp:focus{border-color:var(--p1)}
.range-btn{padding:7px 12px;border:none;border-radius:8px;font-size:12px;font-weight:700;
  cursor:pointer;font-family:inherit}
.range-btn.check{background:rgba(239,68,68,.12);color:#ef4444}
.range-btn.uncheck{background:rgba(120,100,200,.1);color:var(--p1)}
.range-btn.all-uncheck{background:var(--bg);color:var(--fg3)}
/* 섹션 그룹 */
.sec-header{font-size:10px;font-weight:700;
  letter-spacing:1.5px;color:var(--fg3);text-transform:uppercase;
  padding:6px 0 4px;margin-top:10px}
.sec-header:first-child{margin-top:0}
/* 영상 바텀시트 */
.yt-sheet{position:fixed;inset:0;z-index:200;display:none;align-items:flex-end;justify-content:center}
.yt-sheet.open{display:flex}
.yt-overlay{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.yt-panel{position:relative;z-index:1;background:#fff;border-radius:24px 24px 0 0;
  width:100%;max-width:480px;padding:20px 18px 36px;
  animation:slideUp .22s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.yt-sheet-handle{width:36px;height:4px;background:var(--border);border-radius:4px;
  margin:0 auto 16px}
.yt-embed{width:100%;aspect-ratio:16/9;border-radius:12px;border:none;margin-top:10px}

/* ── 하단 탭바 (student.html / textbook_q.html 동일 · 수정 시 양쪽 함께 교체) ── */
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:800;display:flex;
  background:rgba(255,255,255,.92);backdrop-filter:blur(14px);
  border-top:1px solid rgba(139,127,217,.13);
  box-shadow:0 -4px 20px -8px rgba(120,105,205,.18);
  padding:7px 0 calc(9px + env(safe-area-inset-bottom))}
.tabbar a{flex:1;text-decoration:none;text-align:center;position:relative;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.tabbar a:active{transform:scale(.94)}
.tb-ico{font-size:19px;line-height:1;opacity:.42;transition:opacity .25s}
.tb-lb{font-size:10px;font-weight:600;color:#C4C0DA;letter-spacing:-.2px;transition:color .25s}
.tabbar a.on .tb-ico{opacity:1}
.tabbar a.on .tb-lb{color:#8B7FD9;font-weight:800}
.tb-badge{position:absolute;top:-2px;left:50%;margin-left:6px;background:#F0A6C4;color:#fff;
  font-size:9px;font-weight:800;border-radius:99px;padding:1px 5px;min-width:16px;
  box-shadow:0 2px 6px rgba(200,100,150,.35);display:none}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginPage">
  <div class="lbox">
    <div class="ico">📖</div>
    <h1>교재 질문</h1>
    <div class="sub">학생 비밀번호를 입력하세요</div>
    <input class="inp" type="password" id="pwInp" placeholder="비밀번호 입력" autocomplete="off"
      onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn-pri" onclick="doLogin()">확인 →</button>
    <div class="errmsg" id="errLogin"></div>
    <a href="./main.html" class="back-link">← 홈으로</a>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="hdr">
    <button class="logout-btn" onclick="doLogout()">로그아웃</button>
    <div class="hdr-inner">
      <div class="hdr-badge">Student</div>
      <div class="hdr-name" id="hdrName">-</div>
      <div class="hdr-sub" id="hdrSub">교재 질문</div>
    </div>
  </div>

  <div class="body">
    <!-- 교재 없을 때 -->
    <div id="noTbMsg" style="display:none">
      <div class="card">
        <div class="empty-msg">배정된 교재가 없습니다<br><br>선생님께 교재 배정을 요청하세요</div>
      </div>
    </div>

    <!-- 교재 선택 (여러 권 배정된 경우) -->
    <div id="tbSelectWrap">
      <div class="card">
        <div class="card-title">교재 선택</div>
        <div id="tbSelectList" style="margin-top:8px"></div>
      </div>
    </div>

    <!-- 기타 질문 입력 바텀시트 -->
    <div class="yt-sheet" id="freeQSheet" onclick="closeFreeQSheet(event)">
      <div class="yt-overlay"></div>
      <div class="yt-panel">
        <div class="yt-sheet-handle"></div>
        <div class="card-title" style="margin-bottom:12px">교재에 없는 문제 질문하기</div>
        <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px">
          <input id="fqBook" type="text" placeholder="책 이름 (선택)" maxlength="40"
            style="padding:9px 12px;border:1.5px solid rgba(120,100,200,.2);border-radius:10px;font-size:13px;font-family:inherit;background:#F8F6FF;color:#3D3860;outline:none">
          <div style="display:flex;gap:8px;width:100%">
            <input id="fqPage" type="number" placeholder="페이지" min="1"
              style="width:0;flex:1;min-width:0;padding:9px 12px;border:1.5px solid rgba(120,100,200,.2);border-radius:10px;font-size:13px;font-family:inherit;background:#F8F6FF;color:#3D3860;outline:none">
            <input id="fqProb" type="text" placeholder="문제번호" maxlength="10"
              style="width:0;flex:1;min-width:0;padding:9px 12px;border:1.5px solid rgba(120,100,200,.2);border-radius:10px;font-size:13px;font-family:inherit;background:#F8F6FF;color:#3D3860;outline:none">
          </div>
          <!-- 이미지 업로드 -->
          <div style="display:flex;align-items:center;gap:8px">
            <label for="fqImg" style="display:flex;align-items:center;gap:6px;padding:9px 14px;border:1.5px dashed rgba(120,100,200,.3);border-radius:10px;font-size:13px;color:#8B7FD9;cursor:pointer;background:#F8F6FF;flex:1;justify-content:center"> 사진 첨부
            </label>
            <input id="fqImg" type="file" accept="image/*" capture="environment" style="display:none" onchange="onFqImgSelect(event)">
            <button id="fqImgClear" onclick="clearFqImg()" style="display:none;border:none;background:rgba(239,68,68,.1);color:#ef4444;border-radius:10px;padding:9px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">✕ 삭제</button>
          </div>
          <div id="fqImgPreview" style="display:none">
            <img id="fqImgThumb" style="width:100%;max-height:160px;object-fit:contain;border-radius:10px;background:#FBFAFF">
          </div>
        </div>
        <button onclick="submitFreeQ()" style="width:100%;padding:10px;background:linear-gradient(135deg,#A89BEB,#8B7FD9);border:none;border-radius:10px;color:#fff;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer">등록</button>
        <button onclick="submitFreeQ()" style="width:100%;padding:12px;background:linear-gradient(135deg,#A89BEB,#8B7FD9);border:none;border-radius:13px;color:#fff;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer">등록</button>
      </div>
    </div>
    <div id="fqMyList" style="display:none"></div>

    <!-- 영상 바텀시트 -->
    <div class="yt-sheet" id="ytSheet" onclick="closeYtSheet(event)">
      <div class="yt-overlay"></div>
      <div class="yt-panel">
        <div class="yt-sheet-handle"></div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
          <div id="ytSheetTitle" style="font-size:15px;font-weight:700;color:#1E1B3A"></div>
          <button id="ytSheetToggleBtn" onclick="toggleProbFromSheet()" style="border:none;border-radius:99px;padding:5px 13px;font-size:12px;font-weight:700;cursor:pointer;transition:.15s"></button>
        </div>
        <div id="ytSheetSub" style="font-size:12px;color:#6A6688;margin-bottom:8px"></div>
        <iframe id="ytSheetFrame" class="yt-embed" allowfullscreen></iframe>
      </div>
    </div>

    <!-- 기타질문 상세 바텀시트 -->
    <div class="yt-sheet" id="freeQDetailSheet" onclick="closeFreeQDetailSheet(event)">
      <div class="yt-overlay"></div>
      <div class="yt-panel">
        <div class="yt-sheet-handle"></div>
        <div id="fqDetailTitle" style="font-size:15px;font-weight:700;color:#1E1B3A;margin-bottom:4px"></div>
        <div id="fqDetailInfo" style="font-size:13px;color:#6A6688;margin-bottom:12px"></div>
        <div id="fqDetailImgWrap" style="display:none;margin-bottom:14px">
          <img id="fqDetailImg" style="width:100%;border-radius:12px;object-fit:contain;background:#FBFAFF">
        </div>
        <div id="fqDetailYt" style="display:none;margin-bottom:16px">
          <div style="font-size:12px;font-weight:600;color:#3D3860;margin-bottom:6px">▶ 풀이 영상</div>
          <iframe id="fqDetailFrame" class="yt-embed" allowfullscreen></iframe>
        </div>
        <button onclick="deleteFreeQFromSheet()" style="width:100%;padding:10px;border:none;border-radius:10px;background:rgba(239,68,68,.1);color:#ef4444;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer">삭제</button>
      </div>
    </div>

    <!-- 문제 목록 -->
    <div id="probSection" style="display:none">
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
          <div>
            <div class="card-title" style="margin-bottom:4px">문제 목록</div>
            <div style="display:inline-flex;align-items:center;gap:7px;cursor:pointer" onclick="toggleProbBody()">
              <div id="tbNameDisplay" style="font-size:15px;font-weight:800;color:#3D3860;letter-spacing:-.3px"></div>
              <span id="probCollapseBtn" class="tb-toggle">▲</span>
            </div>
          </div>
          <div id="qCntBadge" style="font-size:11px;font-weight:700;color:#8B7FD9;
            background:rgba(139,127,217,.10);padding:5px 12px;border-radius:99px;
            font-variant-numeric:tabular-nums;white-space:nowrap">대기 없음</div>
        </div>
        <div id="probBody">

        <div class="legend">
          <div class="legend-item">
            <div class="legend-dot" style="background:rgba(239,68,68,.15);border:1.5px solid #ef4444"></div> 내 질문
          </div>
          <div class="legend-item">
            <div class="legend-dot" style="background:rgba(86,160,138,.15);border:1.5px solid #56A08A"></div> 영상 있음 (클릭→시청)
          </div>
        </div>
        <div class="myq-card" id="myQCard"></div>
        <div id="probGrid"></div>
      </div>


      <!-- 유튜브 영상 -->
      <div class="yt-panel" id="ytPanel" style="display:none">
        <div class="yt-title">▶ 풀이 영상</div>
        <div id="ytList"></div>
      </div>
      </div><!-- /probBody -->
    </div>
  </div>
</div>

<script>
var db=null;
var currentStuId=null;
var currentStuName=null;
var assignedTbIds=[];
var activeTbId=null;
var tbData={};
var myQuestions={};
var _freeQDetailId=null;
var _freeQDetailData={};

function getDB(){
  try{
    if(typeof firebase==='undefined') return null;
    if(firebase.apps&&firebase.apps.length>0) return firebase.database();
    if(typeof SM_CONFIG==='undefined'||!SM_CONFIG.apiKey||SM_CONFIG.apiKey.includes('여기에')) return null;
    firebase.initializeApp(SM_CONFIG);
    return firebase.database();
  }catch(e){return null;}
}

async function doLogin(){
  const pw=document.getElementById('pwInp').value;
  if(!pw){document.getElementById('errLogin').textContent='비밀번호를 입력하세요';return;}
  db=getDB();
  if(!db){document.getElementById('errLogin').textContent='서버 연결 실패';return;}
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pw));
  const hash=[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  db.ref('smStudents').once('value',function(s){
    const all=s.val()||{};
    const entry=Object.entries(all).find(([,v])=>v.studentPwHash===hash);
    if(!entry){
      document.getElementById('errLogin').textContent='비밀번호가 올바르지 않습니다';
      return;
    }
    currentStuId=entry[0];
    currentStuName=entry[1].name;
    document.getElementById('hdrSub').textContent=(entry[1].grade||'')+' · '+(entry[1].subj||'수학');
    try{
      sessionStorage.setItem('stuId',currentStuId);
      sessionStorage.setItem('stuHash',hash);
    }catch(e){}
    loadApp();
  });
}

function doLogout(){
  try{ sessionStorage.removeItem('stuId'); sessionStorage.removeItem('stuHash'); }catch(e){}
  currentStuId=null; currentStuName=null; activeTbId=null;
  assignedTbIds=[]; tbData={}; myQuestions={};
  document.getElementById('app').style.display='none';
  document.getElementById('loginPage').style.display='flex';
  document.getElementById('pwInp').value='';
  document.getElementById('errLogin').textContent='';
}

// 플래너 탭에서 넘어온 경우 세션으로 자동 로그인
function tryAutoLogin(){
  var sid, hash;
  try{ sid=sessionStorage.getItem('stuId'); hash=sessionStorage.getItem('stuHash'); }catch(e){}
  if(!sid||!hash||!db) return false;
  db.ref('smStudents/'+sid).once('value',function(sn){
    var v=sn.val();
    if(!v||v.studentPwHash!==hash){
      try{ sessionStorage.removeItem('stuId'); sessionStorage.removeItem('stuHash'); }catch(e){}
      return;
    }
    currentStuId=sid; currentStuName=v.name;
    document.getElementById('hdrSub').textContent=(v.grade||'')+' · '+(v.subj||'수학');
    loadApp();
  }).catch(function(){});
  return true;
}

function loadApp(){
  var _tb=document.querySelector('.tabbar'); if(_tb) _tb.style.display='flex';
  document.getElementById('loginPage').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('hdrName').textContent=currentStuName;

  // 배정 교재 로드 (단일 문자열 또는 배열 모두 처리)
  db.ref('smTbAssign/'+currentStuId).once('value',function(s){
    const val=s.val();
    if(!val){showNoTb();return;}
    if(Array.isArray(val)) assignedTbIds=val.filter(Boolean);
    else if(typeof val==='string') assignedTbIds=[val];
    else assignedTbIds=Object.values(val).filter(Boolean);
    if(!assignedTbIds.length){showNoTb();return;}
    loadTextbooks();
  });
}

function showNoTb(){
  document.getElementById('noTbMsg').style.display='block';
  document.getElementById('probSection').style.display='none';
  loadFreeQList();
}

function loadTextbooks(){
  var loaded=0;
  tbData={};
  assignedTbIds.forEach(function(tbId){
    db.ref('smTextbooks/'+tbId).once('value',function(s){
      if(s.val()) tbData[tbId]=s.val();
      loaded++;
      if(loaded===assignedTbIds.length) onTbLoaded();
    });
  });
}

function onTbLoaded(){
  var ids=Object.keys(tbData);
  if(!ids.length){showNoTb();return;}
  loadFreeQList();
  var html='';
  ids.forEach(function(tbId){
    var tb=tbData[tbId];
    var cnt=Object.keys(tb.problems||{}).length;
    html+='<div class="tb-item" onclick="selectTb(\''+tbId+'\')">'+
      '<div><div class="tb-name">'+tb.title+'</div></div>'+
      '<div class="tb-cnt">'+cnt+'문제</div></div>';
  });
  document.getElementById('tbSelectList').innerHTML=html;
}



// 문제 목록(교재 단위) 접기/펼치기
function toggleProbBody(){
  var body=document.getElementById('probBody');
  var icon=document.getElementById('probCollapseBtn');
  if(!body) return;
  var hidden=body.style.display==='none';
  body.style.display=hidden?'':'none';
  if(icon) icon.textContent=hidden?'▲':'▼';
}

function selectTb(tbId){
  activeTbId=tbId;
  var _pb=document.getElementById('probBody');
  if(_pb) _pb.style.display='';
  var _pi=document.getElementById('probCollapseBtn');
  if(_pi) _pi.textContent='▲';
  document.getElementById('noTbMsg').style.display='none';
  document.getElementById('probSection').style.display='block';
  loadFreeQList();

  var tb=tbData[tbId];
  document.getElementById('tbNameDisplay').textContent=tb.title;
  Promise.all([
    db.ref('smTbQuestions/'+tbId+'/'+currentStuId).once('value'),
    db.ref('smTbSeen/'+currentStuId+'/'+tbId).once('value')
  ]).then(function(r){
    var mine=r[0].val()||{};
    mySeen=r[1].val()||{};
    myQuestions={};
    Object.keys(mine).forEach(function(probNum){ myQuestions[probNum]=true; });
    renderGrid(tb);
  });
}

function renderGrid(tb){
  var problems=tb.problems||{};
  var nums=Object.keys(problems);
  // 표시 순서: ord(JSON 작성 순서) 우선, 없으면 숫자/문자 정렬
  nums.sort(function(a,b){
    var oa=(problems[a]||{}).ord, ob=(problems[b]||{}).ord;
    if(oa!=null&&ob!=null) return oa-ob;
    var na=parseFloat(a), nb=parseFloat(b);
    if(!isNaN(na)&&!isNaN(nb)&&String(na)===a&&String(nb)===b) return na-nb;
    return a.localeCompare(b,'ko');
  });
  activeTbNums=nums;
  var html='';

  // 단원과 무관하게 50문항 단위로 끊어서 접이식 구성
  var CHUNK=50;
  var disp=function(n){ var p=problems[n]||{}; return p.num||n; };
  if(nums.length<=CHUNK){
    var inner='';
    nums.forEach(function(n){ inner+=buildCell(n,problems[n]||{},disp(n)); });
    html+='<div class="prob-grid">'+inner+'</div>';
  }else{
    for(var i=0;i<nums.length;i+=CHUNK){
      var part=nums.slice(i,i+CHUNK);
      var qn=part.filter(function(n){return !!myQuestions[n];}).length;
      var inner2='';
      part.forEach(function(n){ inner2+=buildCell(n,problems[n]||{},disp(n)); });
      var label=disp(part[0])+' ~ '+disp(part[part.length-1]);
      html+=secBox('c'+i,label,part.length+'문항'+(qn?' · <b>질문 '+qn+'</b>':''),inner2,qn>0);
    }
  }
  document.getElementById('probGrid').innerHTML=html||'<div class="empty-msg">문제가 없습니다</div>';
  renderMyQ(tb);
  updateQCnt();
}

var mySeen={}, _myqExpand=false, _freeQAll={};
function openFreeQSheet(){ document.getElementById('freeQSheet').classList.add('open'); }
function closeFreeQSheet(e){
  if(e && e.target && e.target.closest && e.target.closest('.yt-panel')) return;
  document.getElementById('freeQSheet').classList.remove('open');
}
// 상단 '내 질문' 카드: 새 영상은 전부, 답변 대기는 개수 + 최근 3개
function renderMyQ(tb){
  var problems=tb.problems||{};
  var host=document.getElementById('myQCard');
  if(!host) return;
  var fresh=[], waiting=[];
  Object.keys(myQuestions).forEach(function(n){
    var p=problems[n]||{};
    var lb=(p.section?p.section+' · ':'')+(p.num||n);
    var pg=p.page?p.page+'p':'';
    if(p.youtubeUrl && isNewVideo(p.ytAt, mySeen[n])) fresh.push({n:n,lb:lb,pg:pg});
    else if(!p.youtubeUrl) waiting.push({n:n,lb:lb,pg:pg});
  });
  // 기타 질문도 같은 목록으로
  Object.keys(_freeQAll).forEach(function(id){
    var q=_freeQAll[id]||{};
    var lb=q.bookName||'사진 질문';
    if(q.probNum) lb+=' · '+q.probNum+'번';
    var pg=q.page?q.page+'p':'';
    if(q.youtubeUrl && isNewVideo(q.ytAt, q.seenAt)) fresh.push({fq:id,lb:lb,pg:pg});
    else if(!q.youtubeUrl) waiting.push({fq:id,lb:lb,pg:pg,img:!!q.hasImage});
  });
  var addBtn='<button class="myq-add" onclick="openFreeQSheet()">＋ 교재에 없는 문제 질문하기</button>';
  if(!fresh.length && !waiting.length){
    host.innerHTML='<div class="myq-cap">내 질문</div><div class="myq-empty">아직 표시한 문제가 없어요. 아래에서 모르는 문제를 눌러 보세요.</div>'+addBtn;
    return;
  }
  var h='<div class="myq-cap">내 질문</div>';
  var shownF = _myqExpand ? fresh : fresh.slice(0,5);
  shownF.forEach(function(q){
    h+='<div class="myq-row new" onclick="'+(q.fq?'openFreeQDetail(\''+q.fq+'\')':'openYtSheet(\''+q.n+'\')')+'">'+
       '<span class="myq-ico">▶</span><div style="flex:1">'+
       '<div class="myq-t">'+q.lb+'</div>'+
       '<div class="myq-sub">'+(q.pg?q.pg+' · ':'')+'영상 도착</div></div></div>';
  });
  if(fresh.length>5 && !_myqExpand)
    h+='<button class="myq-more" onclick="_myqExpand=true;renderMyQ(tbData[activeTbId])">영상 '+(fresh.length-5)+'개 더 보기</button>';
  if(waiting.length){
    h+='<div class="myq-cap" style="margin-top:13px;color:#C4C0DA">답변 대기 '+waiting.length+'개</div>';
    waiting.slice(0,3).forEach(function(q){
      h+='<div class="myq-row" onclick="'+(q.fq?'openFreeQDetail(\''+q.fq+'\')':'toggleProb(\''+q.n+'\')')+'">'+
         '<span class="myq-ico" style="color:#8B7FD9">'+(q.img?'▣':'?')+'</span><div style="flex:1">'+
         '<div class="myq-t">'+q.lb+'</div>'+
         '<div class="myq-sub">'+(q.pg?q.pg+' · ':'')+(q.fq?'답변 대기':'눌러서 질문 해제')+'</div></div></div>';
    });
    if(waiting.length>3)
      h+='<div class="myq-empty" style="margin-top:8px">나머지 '+(waiting.length-3)+'개는 아래 단원에서 보라색으로 표시돼요</div>';
  }
  host.innerHTML=h+addBtn;
}

// 접이식 섹션 상자
function secBox(id,title,sub,inner,open){
  return '<div class="sec-box'+(open?' open':'')+'" id="sec_'+id+'">'+
    '<div class="sec-bar" onclick="toggleSec(\''+id+'\')">'+
      '<div><div class="sec-t">'+title+'</div><div class="sec-s">'+sub+'</div></div>'+
      '<span class="sec-chev">▼</span>'+
    '</div>'+
    '<div class="sec-body"><div class="prob-grid">'+inner+'</div></div>'+
  '</div>';
}
function toggleSec(id){
  var el=document.getElementById('sec_'+id);
  if(el) el.classList.toggle('open');
}

function buildCell(num,p,displayNum){
  if(displayNum===undefined) displayNum=num;
  var hasYt=!!(p&&p.youtubeUrl);
  var isChecked=!!myQuestions[num];
  var cls='prob-cell'+(isChecked?' checked':'')+(hasYt?' has-yt':'');
  // 영상 있으면 클릭=영상, 없으면 클릭=체크토글
  var action=hasYt?'openYtSheet(\''+num+'\')':'toggleProb(\''+num+'\')';
  return '<div class="'+cls+'" onclick="'+action+'" data-num="'+num+'">'+
    '<div class="prob-num">'+displayNum+'</div>'+
    '<div class="prob-yt-dot"></div>'+
    (isChecked&&hasYt?'<div style="position:absolute;top:3px;right:3px;font-size:8px;cursor:pointer" onclick="event.stopPropagation();toggleProb(\''+num+'\')" title="체크 해제">✕</div>':'')+
    '</div>';
}

function toggleProb(num){
  if(!activeTbId||!currentStuId) return;
  var isChecked=!!myQuestions[num];
  if(isChecked){
    myQuestions[num]=false;
    db.ref('smTbQuestions/'+activeTbId+'/'+currentStuId+'/'+num).remove();
  }else{
    myQuestions[num]=true;
    db.ref('smTbQuestions/'+activeTbId+'/'+currentStuId+'/'+num).set({
      checkedAt:Date.now()
    });
  }
  // 셀 재빌드
  var cell=document.querySelector('[data-num="'+num+'"]');
  if(cell&&activeTbId){
    var tb=tbData[activeTbId]||{};
    var _p=(tb.problems||{})[num]||{};
    var newCell=buildCell(num,_p,_p.num||num);
    var tmp=document.createElement('div');
    tmp.innerHTML=newCell;
    cell.parentNode.replaceChild(tmp.firstChild,cell);
  }
  updateQCnt();
}

var activeTbNums=[];

var ytSheetNum=null;
// 영상을 연 시각을 기록. ytAt(등록 시각) > seenAt 이면 '새 영상'으로 본다.
function markVideoSeen(tbId, num){
  if(!tbId || !num || !currentStuId) return;
  db.ref('smTbQuestions/'+tbId+'/'+currentStuId+'/'+num).once('value').then(function(sn){
    if(sn.val()===null) return;   // 질문 체크가 없으면 기록하지 않음
    db.ref('smTbSeen/'+currentStuId+'/'+tbId+'/'+num).set(Date.now()).catch(function(){});
  }).catch(function(){});
}
function markFreeQSeen(id){
  if(!id || !currentStuId) return;
  db.ref('smFreeQuestions/'+currentStuId+'/'+id+'/seenAt').set(Date.now()).catch(function(){});
}
// 새 영상 여부 (등록 시각이 없으면 기존 영상 -> 새것 아님)
function isNewVideo(ytAt, seenAt){
  if(!ytAt) return false;
  return !seenAt || ytAt > seenAt;
}

function openYtSheet(num){
  var tb=tbData[activeTbId]||{};
  var p=(tb.problems||{})[num]||{};
  if(!p.youtubeUrl) return;
  ytSheetNum=num;
  markVideoSeen(activeTbId, num);
  var url=p.youtubeUrl;
  var embedUrl=url.replace('watch?v=','embed/').replace('youtu.be/','www.youtube.com/embed/');
  if(embedUrl.includes('?')) embedUrl=embedUrl.split('?')[0];
  var _dispNum=((tb.problems||{})[num]||{}).num||num;
  document.getElementById('ytSheetTitle').textContent=(tb.title||'')+' · '+_dispNum+'번 문제';
  document.getElementById('ytSheetSub').textContent=p.title||'풀이 영상';
  document.getElementById('ytSheetFrame').src=embedUrl;
  document.getElementById('ytSheet').classList.add('open');
  updateYtSheetBtn();
}
function updateYtSheetBtn(){
  var btn=document.getElementById('ytSheetToggleBtn');
  if(!btn||ytSheetNum===null) return;
  var isChecked=!!myQuestions[ytSheetNum];
  btn.textContent=isChecked?'✕ 체크 해제':'✓ 체크하기';
  btn.style.background=isChecked?'rgba(239,68,68,.12)':'rgba(86,160,138,.15)';
  btn.style.color=isChecked?'#ef4444':'#56A08A';
}
function toggleProbFromSheet(){
  if(ytSheetNum===null) return;
  toggleProb(ytSheetNum);
  updateYtSheetBtn();
}
function closeYtSheet(e){
  if(e&&e.target===document.querySelector('.yt-overlay')||e===undefined){
    document.getElementById('ytSheet').classList.remove('open');
    document.getElementById('ytSheetFrame').src='';
    ytSheetNum=null;
  }
}


var _fqImgData=null;
function compressFqImage(file,cb){
  var reader=new FileReader();
  reader.onload=function(ev){
    var img=new Image();
    img.onload=function(){
      var MAX=1000,w=img.width,h=img.height;
      if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
      if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}
      var cv=document.createElement('canvas');
      cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      cb(cv.toDataURL('image/jpeg',0.7));
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}
function onFqImgSelect(e){
  var file=e.target.files[0];
  if(!file) return;
  compressFqImage(file,function(data){
    _fqImgData=data;
    document.getElementById('fqImgThumb').src=data;
    document.getElementById('fqImgPreview').style.display='';
    document.getElementById('fqImgClear').style.display='';
  });
}
function clearFqImg(){
  _fqImgData=null;
  document.getElementById('fqImg').value='';
  document.getElementById('fqImgPreview').style.display='none';
  document.getElementById('fqImgClear').style.display='none';
}
function submitFreeQ(){
  if(!currentStuId) return;
  var book=(document.getElementById('fqBook').value||'').trim();
  var page=(document.getElementById('fqPage').value||'').trim();
  var prob=(document.getElementById('fqProb').value||'').trim();
  if(!book&&!page&&!prob&&!_fqImgData){alert('내용을 입력하거나 사진을 첨부해 주세요');return;}
  var ref=db.ref('smFreeQuestions/'+currentStuId).push();
  var data={bookName:book,page:page,probNum:prob,stuName:currentStuName,createdAt:Date.now(),hasImage:!!_fqImgData};
  ref.set(data).then(function(){
    if(_fqImgData) db.ref('smFreeQImages/'+currentStuId+'/'+ref.key).set(_fqImgData);
    document.getElementById('fqBook').value='';
    document.getElementById('fqPage').value='';
    document.getElementById('fqProb').value='';
    clearFqImg();
    closeFreeQSheet();
    loadFreeQList();
  });
}
function loadFreeQList(){
  if(!currentStuId) return;
  db.ref('smFreeQuestions/'+currentStuId).orderByChild('createdAt').once('value',function(s){
    _freeQDetailData={};
    var items=s.val()||{};
    var arr=Object.entries(items).sort(function(a,b){return b[1].createdAt-a[1].createdAt;});
    arr.forEach(function(e){_freeQDetailData[e[0]]=e[1];});
    _freeQAll={};
    arr.forEach(function(e){ _freeQAll[e[0]]=e[1]; });
    if(activeTbId && tbData[activeTbId]){ renderMyQ(tbData[activeTbId]); updateQCnt(); }
    var el=document.getElementById('fqMyList');
    if(!el) return;
    if(!arr.length){el.innerHTML='<div style="font-size:12px;color:#A8A4C0;text-align:center;padding:8px">등록된 질문이 없습니다</div>';return;}
    el.innerHTML=arr.map(function(entry){
      var id=entry[0],q=entry[1];
      var d=new Date(q.createdAt);
      var ds=(d.getMonth()+1)+'/'+(d.getDate())+' '+(d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes();
      var hasImg=!!q.hasImage;
      return '<div onclick="openFreeQDetail(\''+id+'\')" style="cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:#F8F6FF;border-radius:10px;margin-bottom:6px">'+
        '<div><div style="font-size:13px;font-weight:600;color:#3D3860">'+(q.bookName||'(사진 질문)')+(hasImg?' ':'')+' </div>'+
        '<div style="font-size:11px;color:#6A6688">'+(q.page?q.page+'p · ':'')+(q.probNum?q.probNum+'번 ':'')+' <span style="color:#B0AACF;margin-left:4px">'+ds+'</span></div></div>'+
        '<span style="color:#C4B9F0;font-size:13px;padding:4px">›</span>'+
      '</div>';
    }).join('');
  });
}
function openFreeQDetail(id){
  _freeQDetailId=id;
  var q=_freeQDetailData[id]||{};
  if(q.youtubeUrl) markFreeQSeen(id);
  document.getElementById('fqDetailTitle').textContent=q.bookName||'';
  document.getElementById('fqDetailInfo').textContent=(q.page||'')+'p · '+(q.probNum||'')+'번';
  var ytWrap=document.getElementById('fqDetailYt');
  var ytFrame=document.getElementById('fqDetailFrame');
  if(q.youtubeUrl){
    var url=q.youtubeUrl;
    var embed=url.replace('watch?v=','embed/').replace('youtu.be/','www.youtube.com/embed/');
    if(embed.includes('?')) embed=embed.split('?')[0];
    ytFrame.src=embed;
    ytWrap.style.display='block';
  }else{
    ytFrame.src='';
    ytWrap.style.display='none';
  }
  document.getElementById('freeQDetailSheet').classList.add('open');
}
function closeFreeQDetailSheet(e){
  if(!e||e.target===document.querySelector('#freeQDetailSheet .yt-overlay')){
    document.getElementById('freeQDetailSheet').classList.remove('open');
    document.getElementById('fqDetailFrame').src='';
  }
}
function deleteFreeQFromSheet(){
  if(!_freeQDetailId) return;
  db.ref('smFreeQuestions/'+currentStuId+'/'+_freeQDetailId).remove().then(function(){
    document.getElementById('freeQDetailSheet').classList.remove('open');
    loadFreeQList();
  });
}
function updateQCnt(){
  // 전체가 아니라 '아직 해결 안 된' 개수 (영상이 등록되지 않은 질문)
  var tb=tbData[activeTbId]||{};
  var problems=tb.problems||{};
  var cnt=0;
  Object.keys(myQuestions).forEach(function(n){
    if(!myQuestions[n]) return;
    if(!(problems[n]||{}).youtubeUrl) cnt++;
  });
  Object.keys(_freeQAll).forEach(function(id){
    if(!(_freeQAll[id]||{}).youtubeUrl) cnt++;
  });
  document.getElementById('qCntBadge').textContent = cnt ? (cnt+'개 대기') : '대기 없음';
}

function renderYtPanel(tb){
  var problems=tb.problems||{};
  var ytItems=Object.entries(problems)
    .filter(function([,p]){return !!(p&&p.youtubeUrl)})
    .sort(function([a],[b]){
      var na=parseFloat(a), nb=parseFloat(b);
      if(!isNaN(na)&&!isNaN(nb)) return na-nb;
      return a.localeCompare(b);
    });

  if(!ytItems.length){
    document.getElementById('ytPanel').style.display='none';
    return;
  }
  document.getElementById('ytPanel').style.display='block';
  var html='';
  ytItems.forEach(function([num,p]){
    html+='<a class="yt-item" href="'+p.youtubeUrl+'" target="_blank" rel="noopener">'+
      '<div class="yt-play"></div>'+
      '<div class="yt-info">'+
        '<div class="yt-prob">'+num+'번 문제 풀이</div>'+
        '<div style="font-size:12px;color:var(--fg2);font-weight:300">'+(p.title||'풀이 영상')+'</div>'+
      '</div>'+
      '</a>';
  });
  document.getElementById('ytList').innerHTML=html;
}
</script>

<script>

  var _smvRef=null;
  function doCheck(){var db=getDB();if(!db||_smvRef)return;_smvRef=db.ref('smAppVersion');_smvRef.on('value',function(s){var sv=String(s.val()||'');if(!sv)return;var lv=localStorage.getItem('smv')||'';if(lv===sv)return;if(location.search.indexOf('_v='+sv)!==-1)return;location.replace(location.pathname+'?_v='+sv);});}
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',doCheck);}else{doCheck();}
  // DB 준비 후 자동 로그인 시도
  setTimeout(function(){ try{ tryAutoLogin(); }catch(e){} }, 300);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')doCheck();});
})();
</script>
