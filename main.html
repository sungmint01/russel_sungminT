<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>sungmint</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
  :root{
    --lav:#8B7FD9;--lav2:#A89BEB;--lav-deep:#6B5FB8;
    --rose:#F0A6C4;--peach:#FBC4B0;--mint:#9DD9C4;
    --ink:#3D3860;--ink2:#7B76A8;--ink3:#AAA5C8;
    --cream:#FBFAFF;--surface:#FFFFFF;
    --lav-tint:#F2EFFC;--rose-tint:#FDF0F6;
    --sh-sm:0 2px 8px rgba(120,105,205,.08);
    --sh-md:0 8px 24px rgba(120,105,205,.12),0 2px 6px rgba(120,105,205,.06);
    --sh-lg:0 16px 40px rgba(120,105,205,.16),0 4px 10px rgba(120,105,205,.08);
    --spring:cubic-bezier(.34,1.56,.64,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--cream);color:var(--ink);min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:40px 22px;-webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(circle at 12% 8%,rgba(240,166,196,.14) 0%,transparent 42%),
      radial-gradient(circle at 88% 92%,rgba(139,127,217,.14) 0%,transparent 45%),
      radial-gradient(circle at 78% 12%,rgba(157,217,196,.08) 0%,transparent 38%);
  }
  .wrap{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:30px;animation:rise .7s var(--spring) both}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

  .hero{text-align:center}
  .logo-badge{
    display:inline-flex;align-items:center;gap:7px;
    background:rgba(255,255,255,.7);backdrop-filter:blur(10px);
    border:1px solid rgba(139,127,217,.14);
    border-radius:99px;padding:7px 17px;
    font-size:10px;font-weight:700;letter-spacing:2.5px;color:var(--lav);
    box-shadow:var(--sh-sm);margin-bottom:22px;text-transform:uppercase;
  }
  .logo-badge-dot{width:6px;height:6px;border-radius:50%;background:var(--lav);
    box-shadow:0 0 0 3px rgba(139,127,217,.16);animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  .logo-text{font-size:56px;font-weight:800;color:var(--ink);line-height:1.02;letter-spacing:-2px}
  .logo-text-em{background:linear-gradient(135deg,var(--rose),var(--lav));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .logo-divider{width:40px;height:3px;background:linear-gradient(90deg,var(--rose),var(--lav));border-radius:2px;margin:16px auto 14px}
  .logo-sub{font-size:14px;font-weight:400;color:var(--ink2);letter-spacing:-.2px}

  .wide-wrap{display:grid;grid-template-columns:1fr 1fr;gap:11px;width:100%;max-width:372px;margin:0 auto}
  .card-wide{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:11px;text-decoration:none;aspect-ratio:1;
    background:var(--surface);border-radius:24px;padding:18px 13px;
    box-shadow:var(--sh-md);border:1px solid rgba(255,255,255,.8);
    transition:transform .35s var(--spring),box-shadow .35s ease;
    position:relative;overflow:hidden;text-align:center;
  }
  .card-wide::before{content:'';position:absolute;inset:0;opacity:0;transition:opacity .35s;
    background:linear-gradient(150deg,transparent 45%,rgba(240,166,196,.10))}
  .card-wide::after{content:'';position:absolute;width:118px;height:118px;border-radius:50%;
    top:-52px;right:-40px;transition:transform .45s var(--spring)}
  .card-wide:nth-child(1)::after{background:radial-gradient(circle,rgba(139,127,217,.13),transparent 70%)}
  .card-wide:nth-child(2)::after{background:radial-gradient(circle,rgba(240,166,196,.15),transparent 70%)}
  .card-wide:hover{transform:translateY(-6px);box-shadow:var(--sh-lg)}
  .card-wide:hover::before{opacity:1}
  .card-wide:hover::after{transform:scale(1.2)}
  .card-wide:active{transform:translateY(-2px) scale(.98)}
  .wide-icon{
    position:relative;width:56px;height:56px;border-radius:19px;
    display:flex;align-items:center;justify-content:center;
    font-size:26px;flex-shrink:0;transition:transform .35s var(--spring);
    box-shadow:0 4px 14px rgba(120,105,205,.14),inset 0 1px 0 rgba(255,255,255,.7);
  }
  .card-wide:nth-child(1) .wide-icon{background:linear-gradient(140deg,#F2EEFD,#DFD6F8)}
  .card-wide:nth-child(2) .wide-icon{background:linear-gradient(140deg,#FDE7F1,#FACFE0)}
  .card-wide:hover .wide-icon{transform:scale(1.09) rotate(-4deg)}
  .wide-title{position:relative;font-weight:800;font-size:16px;color:var(--ink);letter-spacing:-.4px;margin-bottom:5px}
  .wide-desc{position:relative;font-size:10.5px;font-weight:500;color:var(--ink3);letter-spacing:-.2px;line-height:1.5}
  .wide-pill{
    position:relative;background:var(--lav-tint);border-radius:99px;
    width:24px;height:24px;display:flex;align-items:center;justify-content:center;
    color:var(--lav);font-size:13px;flex-shrink:0;font-weight:700;
    transition:transform .35s var(--spring),background .3s;
  }
  .card-wide:hover .wide-pill{background:var(--lav);color:#fff;transform:translateY(2px)}
  @media(max-width:340px){
    .wide-icon{width:44px;height:44px;font-size:20px;border-radius:15px}
    .wide-title{font-size:13.5px}
    .wide-desc{font-size:9.5px}
  }

  .footer{font-size:10px;color:var(--ink3);letter-spacing:2.5px;font-weight:600}
  .brand{display:flex;justify-content:center;align-items:center;padding-top:4px;
    opacity:.55;transition:opacity .3s ease}
  .brand:hover{opacity:.8}
  .brand-logo{width:132px;height:auto;display:block}
  @media(max-width:400px){.brand-logo{width:116px}}

  .admin-link,.clinic-link{
    position:fixed;top:16px;background:rgba(255,255,255,.7);backdrop-filter:blur(10px);
    border:1px solid rgba(139,127,217,.12);border-radius:12px;padding:7px 13px;
    font-size:11px;color:var(--lav);text-decoration:none;font-weight:600;
    box-shadow:var(--sh-sm);letter-spacing:.3px;transition:all .25s var(--spring);
  }
  .admin-link{right:16px}
  .clinic-link{right:104px}
  .admin-link:hover,.clinic-link:hover{transform:translateY(-2px);box-shadow:var(--sh-md);color:var(--lav-deep)}

  @media(max-width:400px){.logo-text{font-size:46px}}
  </style>
</head>
