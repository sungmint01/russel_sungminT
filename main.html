<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>sungmint</title>
  <link rel="icon" type="image/png" href="./app-icon.png">
  <link rel="apple-touch-icon" href="./app-icon.png">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
/* G마켓 산스: 400~500 = Medium, 600~900 = Bold */
@font-face{font-family:'GmarketSans';font-weight:100 500;font-style:normal;font-display:swap;src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff') format('woff')}
@font-face{font-family:'GmarketSans';font-weight:600 900;font-style:normal;font-display:swap;src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff')}

  /* student.html · view.html과 같은 토큰 */
  :root{
    --ground:#FBFAFF;--surface:#FFFFFF;--panel:#F4F2FC;--panel-2:#EEEBFA;--rose-tint:#FCEEF4;--rose-2:#F8E3EC;
    --ink:#3D3860;--muted:#5C5680;--faint:#6B6690;
    --accent-ink:#5B4FA8;--rose:#B0497A;
    --spring:cubic-bezier(.34,1.56,.64,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  a{color:inherit}
  body{
    font-family:'GmarketSans','Pretendard','Noto Sans KR',-apple-system,sans-serif;
    background:var(--ground);color:var(--ink);min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
    padding:0 16px calc(24px + env(safe-area-inset-bottom));
  }
  a:focus-visible{outline:2px solid var(--accent-ink);outline-offset:3px}

  /* 맨 위 한 줄: 마크 + 직원 링크 (한 줄 안에 있어 좁은 화면에서도 잘리지 않는다) */
  .top{width:100%;max-width:440px;margin:0 auto;display:flex;align-items:center;gap:8px;
    height:56px;padding-top:env(safe-area-inset-top)}
  .mark{width:28px;height:28px;border-radius:9px;background:var(--accent-ink);color:#fff;font-size:14px;font-weight:700;
    display:flex;align-items:center;justify-content:center;flex:none}
  .mark-name{font-size:14px;font-weight:700;letter-spacing:-.2px}
  .staff{margin-left:auto;display:flex;gap:4px}
  .admin-link,.clinic-link{display:inline-flex;align-items:center;height:36px;padding:0 12px;border-radius:99px;
    font-size:13px;font-weight:500;color:var(--muted);text-decoration:none;white-space:nowrap;transition:background .2s,color .2s}
  .admin-link:hover,.clinic-link:hover{background:var(--panel);color:var(--ink)}

  .wrap{flex:1;width:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;padding:32px 0 24px}
  .hero{margin-bottom:28px}
  .logo-text{font-size:40px;font-weight:700;color:var(--ink);line-height:1;letter-spacing:-1.6px}
  .logo-sub{margin-top:12px;font-size:15px;color:var(--muted);line-height:1.5}

  /* 진입 카드: 종이색 패널, 둥근 모서리 */
  .wide-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .card-wide{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:184px;
    padding:22px 20px 20px;border-radius:24px;background:var(--panel);text-decoration:none;color:var(--ink);
    -webkit-tap-highlight-color:transparent;transition:background .25s,transform .3s var(--spring)}
  .card-wide.parent{background:var(--rose-tint)}
  .card-wide:hover{background:var(--panel-2)}
  .card-wide.parent:hover{background:var(--rose-2)}
  .card-wide:active{transform:scale(.97)}
  .wide-title{font-size:22px;font-weight:700;letter-spacing:-.5px}
  .wide-desc{margin-top:8px;font-size:14px;color:var(--muted);line-height:1.6}
  .wide-go{display:flex;align-items:center;justify-content:space-between;margin-top:20px;font-size:13px;font-weight:700;color:var(--accent-ink)}
  .card-wide.parent .wide-go{color:var(--rose)}
  .wide-pill{width:36px;height:36px;border-radius:99px;display:flex;align-items:center;justify-content:center;
    background:var(--accent-ink);color:#fff;font-size:17px;transition:transform .3s var(--spring)}
  .card-wide.parent .wide-pill{background:var(--rose)}
  .card-wide:hover .wide-pill{transform:translateX(3px)}
  @media(max-width:350px){
    .card-wide{padding:18px 16px 16px;min-height:170px}
    .wide-title{font-size:19px}
    .wide-desc{font-size:13px}
  }

  /* 러셀 로고: 아래쪽, 흐리게 */
  .brand{display:flex;justify-content:center;padding-top:8px;opacity:.5;transition:opacity .3s ease}
  .brand:hover{opacity:.8}
  .brand-logo{width:158px;max-width:46vw;height:auto;display:block}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <header class="top">
    <span class="mark">T</span><span class="mark-name">성민T</span>
    <nav class="staff" aria-label="선생님용">
      <a class="clinic-link" href="./clinic_grade.html">조교</a>
      <a class="admin-link" href="./admin.html">관리자</a>
    </nav>
  </header>
  <main class="wrap">
    <div class="hero">
      <h1 class="logo-text">sungminT</h1>
      <p class="logo-sub">박성민수학 플래너와 수업 기록을<br>한곳에서 확인해요</p>
    </div>
    <div class="wide-wrap">
      <a class="card-wide" href="./student.html">
        <div>
          <div class="wide-title">학생</div>
          <div class="wide-desc">플래너 제출<br>숙제 · 교재 질문</div>
        </div>
        <div class="wide-go">들어가기<span class="wide-pill" aria-hidden="true">›</span></div>
      </a>
      <a class="card-wide parent" href="./view.html">
        <div>
          <div class="wide-title">학부모</div>
          <div class="wide-desc">수업 기록<br>학습 달력 · 상담</div>
        </div>
        <div class="wide-go">들어가기<span class="wide-pill" aria-hidden="true">›</span></div>
      </a>
    </div>
  </main>
