  <style>
/* G마켓 산스: 400~500 = Medium, 600~900 = Bold */
@font-face{font-family:'GmarketSans';font-weight:100 500;font-style:normal;font-display:swap;src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff') format('woff')}
@font-face{font-family:'GmarketSans';font-weight:600 900;font-style:normal;font-display:swap;src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff')}

  :root{
    --lav:#8B7FD9;--lav2:#A89BEB;--lav-deep:#6B5FB8;--lav-ink:#5B4FA8;
    --rose:#F0A6C4;--rose2:#DE8FAC;--rose-deep:#B4527C;--mint:#9DD9C4;
    --ink:#3D3860;--ink2:#5C5680;--ink3:#7B76A8;--ink4:#AAA5C8;--ink5:#C4C0DA;
    --cream:#FBFAFF;--surface:#FFFFFF;
    --lav-tint:#F2EFFC;--rose-tint:#FDEDF4;
    --sh-card:0 1px 2px rgba(120,105,205,.06),0 10px 26px -10px rgba(120,105,205,.24);
    --sh-lift:0 2px 4px rgba(120,105,205,.08),0 18px 36px -12px rgba(120,105,205,.32);
    --spring:cubic-bezier(.34,1.56,.64,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'GmarketSans','Pretendard','Noto Sans KR',-apple-system,sans-serif;
    background:var(--cream);color:var(--ink);min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:36px 16px 28px;-webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(circle at 10% 6%,rgba(240,166,196,.16) 0%,transparent 40%),
      radial-gradient(circle at 92% 94%,rgba(139,127,217,.16) 0%,transparent 44%),
      radial-gradient(circle at 84% 10%,rgba(157,217,196,.10) 0%,transparent 34%);
  }
  .wrap{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:26px;animation:rise .7s var(--spring) both}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

  /* 러셀 로고: 흰 여백 위에만 */
  .brand{width:100%;display:flex;justify-content:center;padding:18px 22px;background:#fff;border-radius:22px;
    box-shadow:0 1px 2px rgba(120,105,205,.05),0 8px 22px -12px rgba(120,105,205,.20)}
  .brand-logo{width:100%;max-width:240px;height:auto;display:block}

  .hero{text-align:center}
  .logo-text{font-size:50px;font-weight:800;color:var(--ink);line-height:1;letter-spacing:-2px}
  .logo-text-em{background:linear-gradient(135deg,var(--rose),var(--lav));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .logo-sub{margin-top:12px;font-size:13.5px;font-weight:500;color:var(--ink3);letter-spacing:-.2px}

  /* 진입 카드: 종이 괘선 */
  .wide-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
  .card-wide{
    position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;
    text-decoration:none;background:var(--surface);border-radius:24px;padding:20px 18px 18px 26px;min-height:176px;
    box-shadow:var(--sh-card);transition:transform .35s var(--spring),box-shadow .35s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .card-wide:before{content:'';position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(180deg,transparent 0 25px,rgba(107,95,184,.045) 25px 26px)}
  .card-wide:after{content:'';position:absolute;top:0;bottom:0;left:13px;width:1px;background:rgba(240,166,196,.32)}
  .card-wide>*{position:relative}
  .card-wide:hover{transform:translateY(-4px);box-shadow:var(--sh-lift)}
  .card-wide:active{transform:translateY(-1px) scale(.98)}
  .wide-cap{font-size:9.5px;font-weight:700;letter-spacing:1.6px;color:var(--lav)}
  .card-wide.parent .wide-cap{color:var(--rose-deep)}
  .wide-icon{
    width:46px;height:46px;border-radius:15px;margin:12px 0 14px;
    display:flex;align-items:center;justify-content:center;font-size:22px;
    background:linear-gradient(140deg,#F2EEFD,#DFD6F8);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 4px 12px -4px rgba(120,105,205,.28);
    transition:transform .35s var(--spring);
  }
  .card-wide.parent .wide-icon{background:linear-gradient(140deg,#FDEDF4,#FAD3E3);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 4px 12px -4px rgba(200,100,150,.28)}
  .card-wide:hover .wide-icon{transform:scale(1.06) rotate(-4deg)}
  .wide-title{font-weight:800;font-size:17px;color:var(--ink);letter-spacing:-.4px}
  .wide-desc{margin-top:4px;font-size:11.5px;font-weight:500;color:var(--ink4);letter-spacing:-.2px;line-height:1.55}
  .wide-pill{
    position:absolute;right:14px;bottom:16px;width:28px;height:28px;border-radius:99px;
    display:flex;align-items:center;justify-content:center;
    background:var(--lav-tint);color:var(--lav);font-size:15px;font-weight:700;
    transition:transform .35s var(--spring),background .3s,color .3s;
  }
  .card-wide.parent .wide-pill{background:var(--rose-tint);color:var(--rose-deep)}
  .card-wide:hover .wide-pill{background:var(--lav);color:#fff;transform:translateX(2px)}
  .card-wide.parent:hover .wide-pill{background:var(--rose2)}
  @media(max-width:350px){
    .card-wide{padding:18px 14px 16px 22px;min-height:164px}
    .wide-title{font-size:15px}
    .wide-desc{font-size:10.5px}
  }

  /* 직원 링크 */
  .staff{display:flex;gap:8px;justify-content:center}
  .admin-link,.clinic-link{
    display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:7px 14px;
    background:rgba(255,255,255,.75);border:1px solid rgba(139,127,217,.16);
    font-size:11.5px;font-weight:600;color:var(--ink3);text-decoration:none;
    transition:transform .25s var(--spring),color .2s,border-color .2s;
  }
  .admin-link:hover,.clinic-link:hover{transform:translateY(-1px);color:var(--lav-deep);border-color:rgba(139,127,217,.36)}
  .footer{font-size:9.5px;color:var(--ink5);letter-spacing:2.5px;font-weight:600}
  </style>
</head>
