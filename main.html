<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>sungmint</title>
  <link rel="icon" type="image/png" href="./app-icon.png">
  <link rel="apple-touch-icon" href="./app-icon.png">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
/* G마켓 산스: 400~500 = Medium, 600~900 = Bold */
@font-face{font-family:'GmarketSans';font-weight:100 500;font-style:normal;font-display:swap;src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff') format('woff')}
@font-face{font-family:'GmarketSans';font-weight:600 900;font-style:normal;font-display:swap;src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff')}

  :root{
    --lav:#8B7FD9;--lav2:#A89BEB;--lav-deep:#6B5FB8;--lav-ink:#5B4FA8;
    --rose:#F0A6C4;--rose2:#DE8FAC;--rose-deep:#B4527C;--mint:#9DD9C4;
    --ink:#3D3860;--ink2:#5C5680;--ink3:#7B76A8;--ink4:#AAA5C8;--ink5:#C4C0DA;
    --cream:#FBFAFF;--surface:#FFFFFF;
    --lav-tint:#F2EFFC;--rose-tint:#FDEDF4;
    --sh-card:0 1px 2px rgba(120,105,205,.06),0 10px 26px -10px rgba(120,105,205,.24);
    --sh-lift:0 2px 4px rgba(120,105,205,.08),0 18px 36px -12px rgba(120,105,205,.32);
    --spring:cubic-bezier(.34,1.56,.64,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'GmarketSans','Pretendard','Noto Sans KR',-apple-system,sans-serif;
    background:var(--cream);color:var(--ink);min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    position:relative;padding:68px 16px 28px;-webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(circle at 10% 6%,rgba(240,166,196,.16) 0%,transparent 40%),
      radial-gradient(circle at 92% 94%,rgba(139,127,217,.16) 0%,transparent 44%),
      radial-gradient(circle at 84% 10%,rgba(157,217,196,.10) 0%,transparent 34%);
  }
  .wrap{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:26px;animation:rise .7s var(--spring) both}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}


  .hero{text-align:center}
  .logo-text{font-size:50px;font-weight:800;color:var(--ink);line-height:1;letter-spacing:-2px}
  .logo-text-em{background:linear-gradient(135deg,var(--rose),var(--lav));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .logo-sub{margin-top:12px;font-size:13.5px;font-weight:500;color:var(--ink3);letter-spacing:-.2px}

  /* 진입 카드: 무늬 없는 흰 카드 */
  .wide-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
  .card-wide{
    position:relative;display:flex;flex-direction:column;align-items:flex-start;
    text-decoration:none;background:var(--surface);border-radius:24px;padding:22px 18px 20px;min-height:168px;
    border:1px solid rgba(139,127,217,.12);
    box-shadow:0 6px 20px -12px rgba(120,105,205,.28);
    transition:transform .35s var(--spring),box-shadow .35s ease,border-color .3s;
    -webkit-tap-highlight-color:transparent;
  }
  .card-wide:hover{transform:translateY(-3px);border-color:rgba(139,127,217,.28);box-shadow:0 14px 30px -14px rgba(120,105,205,.38)}
  .card-wide.parent:hover{border-color:rgba(222,143,172,.4)}
  .card-wide:active{transform:scale(.98)}
  .wide-icon{
    width:44px;height:44px;border-radius:14px;margin-bottom:16px;
    display:flex;align-items:center;justify-content:center;font-size:21px;
    background:var(--lav-tint);transition:transform .35s var(--spring);
  }
  .card-wide.parent .wide-icon{background:var(--rose-tint)}
  .card-wide:hover .wide-icon{transform:scale(1.06)}
  .wide-title{font-weight:800;font-size:17px;color:var(--ink);letter-spacing:-.4px}
  .wide-desc{margin-top:4px;font-size:11.5px;font-weight:500;color:var(--ink4);letter-spacing:-.2px;line-height:1.55}
  .wide-pill{
    position:absolute;right:14px;bottom:16px;width:28px;height:28px;border-radius:99px;
    display:flex;align-items:center;justify-content:center;
    background:var(--lav-tint);color:var(--lav);font-size:15px;font-weight:700;
    transition:transform .35s var(--spring),background .3s,color .3s;
  }
  .card-wide.parent .wide-pill{background:var(--rose-tint);color:var(--rose-deep)}
  .card-wide:hover .wide-pill{background:var(--lav);color:#fff;transform:translateX(2px)}
  .card-wide.parent:hover .wide-pill{background:var(--rose2)}
  @media(max-width:350px){
    .card-wide{padding:18px 14px 16px;min-height:156px}
    .wide-title{font-size:15px}
    .wide-desc{font-size:10.5px}
  }

  /* 러셀 로고: 아래쪽, 흐리게 */
  .brand{display:flex;justify-content:center;padding-top:2px;opacity:.5;transition:opacity .3s ease}
  .brand:hover{opacity:.8}
  .brand-logo{width:158px;max-width:46vw;height:auto;display:block}
  /* 직원 링크 */
  /* 우측 상단. 페이지와 함께 스크롤되어 카드와 겹치지 않는다 */
  .staff{position:absolute;top:calc(14px + env(safe-area-inset-top));right:calc(16px + env(safe-area-inset-right));
    display:flex;gap:6px;max-width:calc(100% - 32px)}
  .admin-link,.clinic-link{
    display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:6px 12px;white-space:nowrap;
    background:rgba(255,255,255,.75);border:1px solid rgba(139,127,217,.16);
    font-size:11.5px;font-weight:600;color:var(--ink3);text-decoration:none;
    transition:transform .25s var(--spring),color .2s,border-color .2s;
  }
  .admin-link:hover,.clinic-link:hover{transform:translateY(-1px);color:var(--lav-deep);border-color:rgba(139,127,217,.36)}
  .footer{font-size:9.5px;color:var(--ink5);letter-spacing:2.5px;font-weight:600}
  </style>
</head>
<body>
  <div class="staff">
    <a class="clinic-link" href="./clinic_grade.html">✏️ 조교</a>
    <a class="admin-link" href="./admin.html">🔒 관리자</a>
  </div>
  <div class="wrap">
    <div class="hero">
      <div class="logo-text">sungmin<span class="logo-text-em">T</span></div>
      <div class="logo-sub">학습 현황을 언제 어디서나 확인하세요</div>
    </div>
    <div class="wide-wrap">
      <a class="card-wide" href="./student.html">
        <div class="wide-icon">✏️</div>
        <div class="wide-title">학생</div>
        <div class="wide-desc">플래너 · 숙제<br>교재 질문</div>
        <div class="wide-pill">›</div>
      </a>
      <a class="card-wide parent" href="./view.html">
        <div class="wide-icon">📋</div>
        <div class="wide-title">학부모</div>
        <div class="wide-desc">수업 현황<br>제출 달력</div>
        <div class="wide-pill">›</div>
      </a>
    </div>
    <div class="footer">SUNGMINT · MATH TOOLS</div>
    <div class="brand"><img class="brand-logo" src="./russel-logo.webp" alt="러셀 대치학원"></div>
  </div>
</body>
</html>
