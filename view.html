<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수업 현황 — 성민T</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Gothic+A1:wght@300;400;700;900&family=Noto+Sans+KR:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="config.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Noto Sans KR',-apple-system,sans-serif;background:#FBFAFF;background-image:radial-gradient(circle at 12% 8%,rgba(240,166,196,.10) 0%,transparent 42%),radial-gradient(circle at 88% 92%,rgba(139,127,217,.10) 0%,transparent 45%);color:#3D3860;min-height:100vh;-webkit-font-smoothing:antialiased}
:root{--bl:#A89BEB;--bld:#A89BEB}
#load{min-height:100vh;display:flex;align-items:center;justify-content:center}
.sp{width:38px;height:38px;border:3px solid #e2e8f0;border-top-color:var(--bl);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.ld-txt{color:#7B76A8;font-size:14px;text-align:center}
/* Login */
#loginPage{min-height:100vh;display:none;align-items:center;justify-content:center;background:#e4e8f4;background-image:radial-gradient(circle at 20% 20%,rgba(55,100,191,.12) 0%,transparent 50%),radial-gradient(circle at 80% 80%,rgba(90,138,224,.1) 0%,transparent 50%)}
#loginPage::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(200,210,230,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(200,210,230,0.04) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
.lbox{background:#e4e8f4;border-radius:24px;padding:44px 36px 36px;width:320px;box-shadow:8px 8px 20px rgba(145,165,210,.6),-6px -6px 16px rgba(255,255,255,.9);text-align:center;position:relative}
.lbox::before{display:none}
.lico{width:58px;height:58px;background:linear-gradient(135deg,#8B7FD9,#A89BEB);color:#fff;font-weight:800;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 18px;box-shadow:3px 3px 10px rgba(55,100,191,.4),-2px -2px 6px rgba(255,255,255,.6)}
.lbox h1{font-family:'Pretendard','Noto Sans KR',-apple-system,sans-serif;font-size:24px;font-weight:800;color:#3D3860;margin-bottom:4px}
.lbox .lsub{font-family:'Pretendard','Noto Sans KR',-apple-system,sans-serif;font-size:10px;color:#AAA5C8;letter-spacing:2px;margin-bottom:28px;text-transform:uppercase}
.linp{width:100%;border:1.5px solid #e2e8f0;border-radius:10px;padding:12px 14px;font-size:15px;font-family:inherit;outline:none;transition:.2s;background:#FBFAFF;letter-spacing:4px;margin-bottom:12px}
.linp:focus{box-shadow:inset 4px 4px 9px rgba(145,165,210,.6),inset -3px -3px 8px rgba(255,255,255,.9)}
.lbtn{width:100%;background:linear-gradient(135deg,#8B7FD9,#A89BEB);color:#fff;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Pretendard','Noto Sans KR',-apple-system,sans-serif;transition:.2s;box-shadow:3px 3px 10px rgba(55,100,191,.35)}
.lbtn:hover{opacity:.9}.lbtn:disabled{background:#cbd5e1;cursor:not-allowed}
.lerr{color:#ef4444;font-size:12px;margin-top:8px;min-height:16px;font-family:'Pretendard','Noto Sans KR',-apple-system,sans-serif}
.lback{display:block;margin-top:18px;font-size:12px;color:#AAA5C8;text-decoration:none;font-family:'Pretendard','Noto Sans KR',-apple-system,sans-serif;letter-spacing:1px}
.lback:hover{color:#7B76A8}
.err{text-align:center;padding:40px 20px}
.err .ei{font-size:52px;margin-bottom:16px}
.err h2{font-size:19px;font-weight:700;margin-bottom:8px}
.err p{font-size:13px;color:#7B76A8;line-height:1.7}
#wrap{display:none;max-width:560px;margin:0 auto;padding:0 14px 60px}
/* ── 헤더 (student.html과 같은 그라데이션) ── */
.hdr{position:relative;overflow:hidden;margin:0 -14px 18px;padding:28px 22px 20px;border-radius:0 0 28px 28px;color:#fff;
  background:linear-gradient(168deg,#453D78 0%,#5B51A0 38%,#7A6DC9 72%,#9A8CE0 100%);box-shadow:0 14px 34px -14px rgba(69,61,120,.55)}
.hdr:before{content:'';position:absolute;width:240px;height:240px;right:-70px;top:-90px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%);pointer-events:none}
.hdr>*{position:relative}
.hdr-badge{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;font-weight:700;letter-spacing:1.6px;color:rgba(255,255,255,.72)}
.hdr-badge:before{content:'';width:6px;height:6px;border-radius:50%;background:#9DD9C4;box-shadow:0 0 0 3px rgba(157,217,196,.22)}
.hdr-name{font-size:25px;font-weight:800;letter-spacing:-.6px;margin-top:6px}
.hdr-tags{display:flex;gap:6px;margin-top:4px}
.htag{font-size:12.5px;color:rgba(255,255,255,.78);font-weight:500}
.htag:empty{display:none}
.htag+.htag:before{content:'·';margin-right:6px;opacity:.6}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.16)}
.sc{display:flex;flex-direction:column-reverse;padding:0 4px}
.sc+.sc{border-left:1px solid rgba(255,255,255,.12);padding-left:12px}
.sn{font-size:20px;font-weight:800;letter-spacing:-.4px;line-height:1.15;font-variant-numeric:tabular-nums}
.sl{font-size:10.5px;font-weight:600;color:rgba(255,255,255,.62);margin-bottom:3px}
/* ── 카드 + 종이 괘선 ── */
.card{position:relative;overflow:hidden;background:#fff;border-radius:22px;margin-bottom:16px;
  box-shadow:0 1px 2px rgba(120,105,205,.06),0 10px 26px -10px rgba(120,105,205,.24)}
.card:before{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,transparent 0 25px,rgba(107,95,184,.04) 25px 26px)}
.card:after{content:'';position:absolute;top:0;bottom:0;left:13px;width:1px;background:rgba(240,166,196,.26);pointer-events:none}
.card>*{position:relative}
.card-head{padding:17px 20px 0;font-size:14.5px;font-weight:800;color:#3D3860;letter-spacing:-.3px}
/* ── 수업 달력 ── */
.cal-wrap{padding:10px 14px 14px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-month{font-size:14px;font-weight:800;color:#3D3860;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.cal-nav-btn{background:rgba(139,127,217,.08);border:none;border-radius:11px;width:31px;height:31px;cursor:pointer;font-size:15px;
  display:flex;align-items:center;justify-content:center;color:#8B7FD9;transition:.25s cubic-bezier(.34,1.56,.64,1)}
.cal-nav-btn:hover{background:rgba(139,127,217,.17);transform:translateY(-1px)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-dow{text-align:center;font-size:9.5px;font-weight:700;color:#C4C0DA;padding:2px 0 6px;letter-spacing:.6px}
.cal-dow:first-child{color:#DE8FAC}.cal-dow:nth-child(7){color:#9B93D8}
.cal-day{position:relative;min-height:68px;border-radius:13px;padding:5px 3px 6px;display:flex;flex-direction:column;align-items:center;
  transition:.25s cubic-bezier(.34,1.56,.64,1)}
.cal-day-num{align-self:flex-start;padding-left:3px;font-size:11px;font-weight:700;line-height:1;color:#7B76A8;font-variant-numeric:tabular-nums}
.sun .cal-day-num{color:#DE8FAC}.sat .cal-day-num{color:#9B93D8}
.cal-day.other-month .cal-day-num{color:#E4E1F0}
.cal-day.rec{background:#F5F2FE;box-shadow:inset 0 0 0 1px rgba(139,127,217,.14);cursor:pointer}
.cal-day.rec:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1px rgba(139,127,217,.35),0 6px 16px -6px rgba(107,95,184,.3)}
.cal-day.abs{background:rgba(240,166,196,.17);box-shadow:inset 0 0 0 1px rgba(222,143,172,.32)}
.cal-day.today{box-shadow:inset 0 0 0 1.5px #A89BEB}
.cal-day.today .cal-day-num{color:#5B4FA8}
.cal-g{font-size:17px;font-weight:800;line-height:1;margin-top:4px;letter-spacing:-.3px}
.cal-st{font-size:7.5px;line-height:1;margin-top:3px;letter-spacing:-.4px;white-space:nowrap}
.cal-abs{font-size:10.5px;font-weight:800;color:#B4527C;margin-top:9px}
.cal-memo{margin-top:auto;padding-top:3px;font-size:9px;font-weight:700;color:#C85F8A;line-height:1}
.late-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#F2B36D}
.cal-day .late-dot{position:absolute;top:5px;right:5px;box-shadow:0 0 0 2px #F5F2FE}
.st-off{color:#E4E0F5}
.g5{color:#5B4FA8}.g4{color:#6B5FB8}.g3{color:#8B7FD9}.g2{color:#A89BEB}.g1{color:#AAA5C8}.g0{color:#C85F8A}
.cal-legend{display:flex;justify-content:flex-end;gap:12px;padding:10px 2px 0;font-size:10.5px;font-weight:600;color:#AAA5C8}
.cal-legend span{display:inline-flex;align-items:center;gap:5px}
.lg-abs{width:9px;height:9px;border-radius:3px;background:rgba(240,166,196,.35);box-shadow:inset 0 0 0 1px rgba(222,143,172,.45)}
.lg-memo{font-size:9px;font-weight:700;color:#C85F8A}
/* ── 바텀시트 (수업 상세 · 플래너 상세 공통) ── */
.detail-ov,.vplan-detail-ov{position:fixed;inset:0;z-index:100;display:none;align-items:flex-end;justify-content:center;
  background:rgba(45,38,80,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.detail-ov.open,.vplan-detail-ov.open{display:flex}
.detail-modal,.vpdm{width:100%;max-width:520px;max-height:88vh;overflow-y:auto;background:#fff;border-radius:26px 26px 0 0;
  padding:10px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px -12px rgba(45,38,80,.35);
  animation:sheetUp .32s cubic-bezier(.34,1.3,.64,1)}
.detail-modal:before,.vpdm:before{content:'';display:block;width:38px;height:4px;border-radius:2px;background:#E4E0F5;margin:0 auto 14px}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
@media(min-width:600px){.detail-ov,.vplan-detail-ov{align-items:center;padding:20px}.detail-modal,.vpdm{border-radius:26px}}
.dm-head,.vpdm-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.dm-date,.vpdm-date{font-size:17px;font-weight:800;color:#3D3860;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.dm-num{font-size:12px;font-weight:600;color:#AAA5C8;margin-left:7px;letter-spacing:0}
.dm-close,.vpdm-close{flex-shrink:0;width:30px;height:30px;border:none;border-radius:50%;background:#F2EFFC;color:#7B76A8;font-size:13px;cursor:pointer}
.dm-box{border-radius:16px;padding:12px 14px;margin-bottom:10px;font-size:13.5px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}
.dm-box-lb{font-size:10.5px;font-weight:800;letter-spacing:.3px;margin-bottom:4px}
.dm-note{background:linear-gradient(160deg,#FFF6FA,#FDEDF4);box-shadow:inset 0 0 0 1px rgba(240,166,196,.45);color:#8E3E62}
.dm-note .dm-box-lb{color:#C85F8A}
.dm-cmt{background:linear-gradient(160deg,#EDF9F4,#DFF2EA);color:#2F6B58}
.dm-cmt .dm-box-lb{color:#3F8A72}
.dm-sp{background:#F7F5FE;color:#5C5680}
.dm-sp .dm-box-lb{color:#8B7FD9}
.dm-absent{background:rgba(240,166,196,.17);color:#B4527C;font-weight:700}
.dm-grade{display:flex;align-items:center;gap:14px;background:#F7F5FE;border-radius:16px;padding:12px 16px;margin-bottom:10px}
.dm-g{font-size:30px;font-weight:800;line-height:1;letter-spacing:-.5px;min-width:24px;text-align:center}
.dm-g-lb{font-size:10.5px;font-weight:700;color:#AAA5C8}
.dm-g-st{font-size:15px;letter-spacing:1px;margin-top:3px;line-height:1}
.dm-late{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:#B9772F;
  background:rgba(242,179,109,.18);padding:4px 10px;border-radius:99px;white-space:nowrap}
.dm-rows{margin:0 0 10px}
.dm-row{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:9px 2px;border-bottom:1px solid #F2EFFC;font-size:13.5px}
.dm-row:last-child{border-bottom:none}
.dm-k{color:#AAA5C8;font-weight:600;font-size:12px;padding-top:2px}
.dm-v{color:#3D3860;line-height:1.6;overflow-wrap:anywhere}
.vpdm-item{border-radius:18px;overflow:hidden;margin-bottom:12px;background:#FBFAFF;box-shadow:inset 0 0 0 1px rgba(139,127,217,.12)}
.vpdm-head2{padding:10px 14px 8px}
.plan-type-badge{display:inline-flex;font-size:11px;font-weight:800;border-radius:99px;padding:3px 10px}
.badge-plan{background:#F2EFFC;color:#6B5FB8}
.badge-done{background:#E6F6EF;color:#357A63}
.vpdm-img{display:block;width:100%;max-height:300px;object-fit:cover}
.vpdm-img-ph{height:110px;background:#F2EFFC;display:flex;align-items:center;justify-content:center;font-size:12px;color:#AAA5C8}
.vpdm-comment{margin:10px;border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.6;color:#2F6B58;
  background:linear-gradient(160deg,#EDF9F4,#DFF2EA);white-space:pre-wrap;overflow-wrap:anywhere}
.vpdm-comment-head{font-size:10.5px;font-weight:800;color:#3F8A72;margin-bottom:3px}
.vpdm-no-comment{padding:8px 14px 12px;font-size:12px;color:#AAA5C8}
.vpdm-empty{text-align:center;color:#AAA5C8;padding:20px;font-size:13px}
/* ── 상담 요청 ── */
.csec{position:relative;overflow:hidden;background:#fff;border-radius:22px;padding:20px;margin-bottom:16px;
  box-shadow:0 1px 2px rgba(120,105,205,.06),0 10px 26px -10px rgba(120,105,205,.24)}
.csec h2{font-size:14.5px;font-weight:800;color:#3D3860;letter-spacing:-.3px;margin-bottom:4px}
.csec p{font-size:12.5px;color:#7B76A8;line-height:1.7;margin-bottom:14px}
.inp{width:100%;border:1.5px solid rgba(139,127,217,.2);border-radius:14px;padding:11px 13px;font-size:14px;font-family:inherit;
  outline:none;background:#FBFAFF;color:#3D3860;transition:.2s}
.inp::placeholder{color:#C4C0DA}
.inp:focus{border-color:#A89BEB;background:#fff;box-shadow:0 0 0 3px rgba(139,127,217,.12)}
textarea.inp{resize:vertical;min-height:96px}
.sbtn{width:100%;margin-top:10px;border:none;border-radius:15px;padding:13px;font-size:14px;font-weight:700;font-family:inherit;color:#fff;
  cursor:pointer;background:linear-gradient(135deg,#8B7FD9,#A89BEB);box-shadow:0 6px 18px rgba(139,127,217,.28);
  transition:.25s cubic-bezier(.34,1.56,.64,1)}
.sbtn:hover{transform:translateY(-1px)}
.sbtn:disabled{background:#EFECF9;color:#B9B4D2;box-shadow:none;cursor:not-allowed;transform:none}
.succ{display:none;margin-top:8px;border-radius:12px;padding:11px;text-align:center;font-size:13px;font-weight:600;color:#357A63;background:#E6F6EF}
.cerr{color:#C85F8A;font-size:12px;margin-top:6px;min-height:16px}
.sent-hd{font-size:11px;font-weight:700;color:#AAA5C8;letter-spacing:.3px;margin:16px 0 8px}
.sent-i{background:#FBFAFF;border-radius:16px;padding:12px 14px;margin-bottom:10px;font-size:13px;color:#5C5680;line-height:1.6;
  box-shadow:inset 0 0 0 1px rgba(139,127,217,.12)}
.sent-t{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:#AAA5C8;margin-bottom:5px}
.sent-body{white-space:pre-wrap;margin-bottom:6px}
.sent-reply{margin-top:8px;border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.6;color:#2F6B58;white-space:pre-wrap;
  background:linear-gradient(160deg,#EDF9F4,#DFF2EA)}
.sent-reply-head{font-size:10.5px;font-weight:800;color:#3F8A72;margin-bottom:3px}
.sent-no-reply{font-size:11.5px;color:#AAA5C8;margin-top:4px}
.btn-del-sent{background:none;border:none;color:#DE8FAC;font-size:11px;cursor:pointer;font-family:inherit;padding:0}
.btn-del-sent:hover{color:#C85F8A}
footer{text-align:center;padding:20px 0 8px;color:#C4C0DA;font-size:11.5px}
/* ── 플래너 제출 달력 ── */
.plan-cal-wrap{padding:10px 14px 16px}
.plan-cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.plan-cal-month{font-size:14px;font-weight:800;color:#3D3860;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.plan-cal-btn{background:rgba(139,127,217,.08);border:none;border-radius:11px;width:31px;height:31px;cursor:pointer;font-size:15px;
  display:flex;align-items:center;justify-content:center;color:#8B7FD9;transition:.25s cubic-bezier(.34,1.56,.64,1)}
.plan-cal-btn:hover{background:rgba(139,127,217,.17);transform:translateY(-1px)}
.plan-cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.plan-cal-dow{text-align:center;font-size:9.5px;font-weight:700;color:#C4C0DA;padding:2px 0 6px;letter-spacing:.6px}
.plan-cal-dow:first-child{color:#DE8FAC}.plan-cal-dow:nth-child(7){color:#9B93D8}
.plan-cal-day{min-height:44px;border-radius:12px;padding:5px 3px;display:flex;flex-direction:column;align-items:center;cursor:default;
  transition:.25s cubic-bezier(.34,1.56,.64,1)}
.plan-cal-day-num{align-self:flex-start;padding-left:3px;font-size:11px;font-weight:700;line-height:1;color:#7B76A8;font-variant-numeric:tabular-nums}
.plan-cal-day.sun .plan-cal-day-num{color:#DE8FAC}.plan-cal-day.sat .plan-cal-day-num{color:#9B93D8}
.plan-cal-day.has-plan{cursor:pointer;background:#F7F5FE;box-shadow:inset 0 0 0 1px rgba(139,127,217,.12)}
.plan-cal-day.has-plan:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1px rgba(139,127,217,.35),0 6px 16px -6px rgba(107,95,184,.3)}
.plan-cal-day.today{box-shadow:inset 0 0 0 1.5px #A89BEB}
.plan-cal-day.today .plan-cal-day-num{color:#5B4FA8}
.plan-cal-day.other-month .plan-cal-day-num{color:#E4E1F0}
.plan-dot-row{display:flex;gap:3px;margin-top:6px;justify-content:center}
.plan-dot{width:7px;height:7px;border-radius:50%}
.plan-dot-blue{background:linear-gradient(135deg,#A89BEB,#8B7FD9)}
.plan-dot-green{background:linear-gradient(135deg,#9DD9C4,#7FC7AC)}
.lightbox-v{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.lightbox-v.open{display:flex}
.lightbox-v img{max-width:100%;max-height:90vh;border-radius:10px;object-fit:contain}
.lbv-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:22px;width:40px;height:40px;border-radius:50%;cursor:pointer}
</style>
  <style>
    @font-face {
      font-family: 'MaruBuri';
      src: url('./MaruBuri-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
  </style>
</head>
<body>
<div id="loginPage">
  <div class="lbox">
    <div class="lico">📋</div>
    <h1>학부모 페이지</h1>
    <p class="lsub">For Parents</p>
    <input class="linp" type="password" id="pwIn" placeholder="비밀번호 입력" autocomplete="off" onkeydown="if(event.key==='Enter')doParentLogin()">
    <button class="lbtn" id="loginBtn" onclick="doParentLogin()">확인 →</button>
    <div class="lerr" id="lerr"></div>
    <a class="lback" href="./main.html">← 홈으로</a>
  </div>
</div>

<script>
const PIC={
  _db:null,
  async db(){
    if(this._db) return this._db;
    return new Promise(res=>{
      const r=indexedDB.open('smtPlanner',1);
      r.onupgradeneeded=e=>e.target.result.createObjectStore('imgs',{keyPath:'pid'});
      r.onsuccess=e=>{this._db=e.target.result;res(this._db);};
      r.onerror=()=>res(null);
    });
  },
  async get(pid){
    try{
      const db=await this.db();if(!db)return null;
      return new Promise(res=>{
        const r=db.transaction('imgs').objectStore('imgs').get(pid);
        r.onsuccess=()=>{const v=r.result;res(v&&(Date.now()-v.ts)<60*86400000?v.src:null);};
        r.onerror=()=>res(null);
      });
    }catch{return null;}
  },
  async set(pid,src){
    try{
      const db=await this.db();if(!db)return;
      db.transaction('imgs','readwrite').objectStore('imgs').put({pid,src,ts:Date.now()});
    }catch{}
  },
  async del(pid){
    try{
      const db=await this.db();if(!db)return;
      db.transaction('imgs','readwrite').objectStore('imgs').delete(pid);
    }catch{}
  }
};
async function loadPlannerImg(pid){
  if(!pid)return null;
  try{
    const cached=await PIC.get(pid);
    if(cached)return cached;
    const snap=await db.ref('smPlannerImages/'+pid).get();
    const src=snap.val();
    if(src)PIC.set(pid,src);
    return src||null;
  }catch(e){
    console.error('이미지 로드 실패:',pid,e);
    return null;
  }
}


let db,sid_=null,recData={},sent=[],consultData={},calYear,calMonth,openDetailDate=null;
function today(){
  const d=new Date();
  if(d.getHours()<3) d.setDate(d.getDate()-1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}


window.addEventListener('DOMContentLoaded',()=>{
  const now=new Date();calYear=now.getFullYear();calMonth=now.getMonth();
  if(typeof SM_CONFIG==='undefined'||!SM_CONFIG.apiKey||SM_CONFIG.apiKey.includes('여기에')){
    document.getElementById('load').innerHTML='<div class="err"><div class="ei"></div><h2>설정 오류</h2><p>config.js 파일에 Firebase 설정이 필요합니다</p></div>';return;
  }
  try{if(!firebase.apps.length)firebase.initializeApp(SM_CONFIG);db=firebase.database();}
  catch(e){showErr('Firebase 오류',''+e.message);return;}
  loadPage();
});

async function doParentLogin(){
  const pw=document.getElementById('pwIn').value;
  const err=document.getElementById('lerr');
  const btn=document.getElementById('loginBtn');
  if(!pw){err.textContent='비밀번호를 입력하세요';return;}
  err.textContent='';btn.disabled=true;btn.textContent='확인 중...';
  try{
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pw));
    const hash=[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
    const snap=await db.ref('smStudents').get();
    const all=snap.val()||{};
    const match=Object.values(all).find(s=>s.parentPwHash===hash);
    if(match){
      // Hide login, show loading, load data
      document.getElementById('loginPage').style.display='none';
      document.getElementById('load').style.display='flex';
      const matchEntry=Object.entries(snap.val()||{}).find(([,s])=>s.parentPwHash===hash);loadStudentData(matchEntry[0],matchEntry[1]);
    }else{
      err.textContent='비밀번호가 올바르지 않습니다';
      document.getElementById('pwIn').value='';
      document.getElementById('pwIn').focus();
    }
  }catch(e){err.textContent='오류: '+e.message;}
  btn.disabled=false;btn.textContent='확인 →';
}

async function loadPage(){
  const token=new URLSearchParams(location.search).get('token');
  if(!token){
    // No token → show login page
    document.getElementById('load').style.display='none';
    document.getElementById('loginPage').style.display='flex';
    return;
  }
  try{
    // ✅ client-side 필터링 (인덱스 불필요)
    const snap=await db.ref('smStudents').get();
    const all=snap.val()||{};
    const entry=Object.entries(all).find(([,s])=>s.token===token);
    if(!entry){showErr('학생을 찾을 수 없습니다','링크가 만료되었거나 잘못된 링크입니다.');return;}
    loadStudentData(entry[0], entry[1]);
  }catch(e){showErr('오류 발생',''+e.message);}
}

function loadStudentData(stuId, stu){
  sid_=stuId;
  document.title=stu.name+' — 수업 현황';
  document.getElementById('hName').textContent=stu.name||'';
  document.getElementById('hGrade').textContent=stu.grade||'';
  document.getElementById('hSubj').textContent=stu.subj||'';
  document.getElementById('load').style.display='none';
  document.getElementById('wrap').style.display='block';
  db.ref('smSessions/'+sid_).on('value',function(s){
    try{
      recData=s.val()||{};
      renderStats();
      renderCal();
      // 팝업이 열려있으면 내용도 갱신
      if(openDetailDate){
        var updRec=buildRecMap()[openDetailDate];
        if(updRec) showDetail(openDetailDate,updRec); else closeDetail();
      }
    }catch(e){console.error('session render error:',e);}
  });
  db.ref('smPlanners/'+sid_).on('value',function(s){try{renderViewPlanners(s.val()||{});}catch(e){console.error('planner render error:',e);}});
  const stored=localStorage.getItem('smSent_'+sid_);
  if(stored)try{sent=JSON.parse(stored);}catch(e){}
  db.ref('smConsultations/'+sid_).on('value',function(s){try{consultData=s.val()||{};renderSent();}catch(e){console.error('consult render error:',e);}});
}
function showErr(title,msg){document.getElementById('load').innerHTML=`<div class="err"><div class="ei"></div><h2>${title}</h2><p>${msg}</p></div>`;}

function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function escBr(t){return esc(t).replace(/\n/g,'<br>');}
var GRADE_L={5:'A',4:'B',3:'C',2:'D',1:'E',0:'F'};
// 별 5칸: 채운 별은 등급색, 빈 별은 옅게
function starRow(n){return '★'.repeat(n)+'<span class="st-off">'+'★'.repeat(5-n)+'</span>';}
function hasRecData(r){return r.eval!=null||r.prog||r.hwC||r.cli||r.comment||r.special||r.absent||r.late||r.prevHw||r.note;}
// 날짜별 대표 세션: 기록 있는 것 → cli 있는 것 우선 → 최근 수정
function buildRecMap(){
  const recMap={};
  Object.values(recData).forEach(r=>{
    if(!r||!r.date||!hasRecData(r)) return;
    const prev=recMap[r.date];
    if(!prev) recMap[r.date]=r;
    else if(!!(r.cli&&r.cli.trim())&&!(prev.cli&&prev.cli.trim())) recMap[r.date]=r;
    else if(!(r.cli&&r.cli.trim())&&(prev.cli&&prev.cli.trim())) {/* keep prev */}
    else if((r.upd||0)>(prev.upd||0)) recMap[r.date]=r;
  });
  return recMap;
}
function starsLabel(n,absent){
  if(absent) return'결석';
  if(n==null||n<0) return'-';
  const l={5:'A',4:'B',3:'C',2:'D',1:'E',0:'F(안함)'};
  return l[n]!==undefined?l[n]:'-';
}

function renderStats(){
  const monthStr=calYear+'-'+String(calMonth+1).padStart(2,'0');
  // 의미 있는 데이터가 있는 세션만 카운트 (recMap과 동일 기준)
  const monthRecs=Object.values(recData).filter(r=>{
    if(!r.date||!r.date.startsWith(monthStr)) return false;
    return r.eval!=null||r.prog||r.hwC||r.cli||r.comment||r.special||r.absent||r.late||r.prevHw||r.note;
  });
  // 총 수업 횟수: 해당 월 기록 중 가장 큰 회차
  const maxNum=monthRecs.length?Math.max(...monthRecs.map(r=>r.num||0)):0;
  document.getElementById('sTot').textContent=maxNum||'-';
  // 평균/최근 등급: 해당 월 중 eval 있는 것
  const arr=monthRecs.filter(r=>r.eval!=null&&r.eval>=0);
  if(arr.length){
    const valid=arr.filter(r=>r.eval>0);
    const avg=valid.length?Math.round(valid.reduce((a,r)=>a+(r.eval||0),0)/valid.length*10)/10:'-';
    document.getElementById('sAvg').textContent=(avg==='-')?'-':avg+'★';
    const sorted=arr.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    const ev=sorted[0].eval!=null&&sorted[0].eval>=0?sorted[0].eval:null;
    document.getElementById('sLast').textContent=starsLabel(ev);
  }else{
    document.getElementById('sAvg').textContent='-';
    document.getElementById('sLast').textContent='-';
  }
}

function changeMonth(dir){
  calMonth+=dir;
  if(calMonth>11){calMonth=0;calYear++;}
  if(calMonth<0){calMonth=11;calYear--;}
  closeDetail();renderCal();renderStats();
}

function renderCal(){
  const recMap=buildRecMap();
  const mn=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('calMonth').textContent=`${calYear}년 ${mn[calMonth]}`;
  const todayStr=today();
  const firstDay=new Date(calYear,calMonth,1).getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const daysInPrev=new Date(calYear,calMonth,0).getDate();
  const grid=document.getElementById('calGrid');
  grid.innerHTML=`
    <div class="cal-dow">일</div><div class="cal-dow">월</div><div class="cal-dow">화</div>
    <div class="cal-dow">수</div><div class="cal-dow">목</div><div class="cal-dow">금</div><div class="cal-dow">토</div>
  `;
  for(let i=firstDay-1;i>=0;i--){
    const cell=document.createElement('div');
    cell.className='cal-day other-month';
    cell.innerHTML=`<span class="cal-day-num">${daysInPrev-i}</span>`;
    grid.appendChild(cell);
  }
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const rec=recMap[ds];
    const dow=(firstDay+d-1)%7;
    const cell=document.createElement('div');
    cell.className='cal-day'+(ds===todayStr?' today':'')+(rec?(rec.absent?' rec abs':' rec'):'');
    if(dow===0)cell.classList.add('sun');
    if(dow===6)cell.classList.add('sat');
    if(rec){
      const ev=rec.eval!=null&&rec.eval>=0&&rec.eval<=5?rec.eval:null;
      let body='';
      if(rec.absent) body='<div class="cal-abs">결석</div>';
      else if(ev!==null) body=`<div class="cal-g g${ev}">${GRADE_L[ev]}</div><div class="cal-st g${ev}">${starRow(ev)}</div>`;
      const late=(!rec.absent&&rec.late)?'<i class="late-dot"></i>':'';
      const memo=(rec.note&&String(rec.note).trim())?'<div class="cal-memo">메모</div>':'';
      cell.innerHTML=`<span class="cal-day-num">${d}</span>${late}${body}${memo}`;
      // 칸에 그린 세션을 그대로 넘긴다 (같은 날 빈 세션이 먼저 잡히던 문제)
      cell.addEventListener('click',(function(d,r){return function(){showDetail(d,r);};})(ds,rec));
    }else{
      cell.innerHTML=`<span class="cal-day-num">${d}</span>`;
    }
    grid.appendChild(cell);
  }
  const total=firstDay+daysInMonth;
  const rem=(7-total%7)%7;
  for(let d=1;d<=rem;d++){
    const cell=document.createElement('div');
    cell.className='cal-day other-month';
    cell.innerHTML=`<span class="cal-day-num">${d}</span>`;
    grid.appendChild(cell);
  }
}

function showDetail(ds,rec){
  // 빈 세션이면 팝업 열지 않음
  if(!rec||!hasRecData(rec)) return;
  const[y,m,d]=ds.split('-');
  const dow=['일','월','화','수','목','금','토'][new Date(+y,+m-1,+d).getDay()];
  const ev=rec.eval!=null&&rec.eval>=0&&rec.eval<=5?rec.eval:null;
  const absent=!!rec.absent, late=!absent&&!!rec.late;
  document.getElementById('dmDate').innerHTML=`${+m}월 ${+d}일 (${dow})`+(rec.num?`<span class="dm-num">${esc(rec.num)}회차</span>`:'');
  const box=(cls,lb,t)=>`<div class="dm-box ${cls}"><div class="dm-box-lb">${lb}</div>${escBr(t)}</div>`;
  const has=v=>v!=null&&String(v).trim()!=='';
  let h='';
  if(has(rec.note)) h+=box('dm-note','선생님이 전하는 말',rec.note);
  if(absent) h+='<div class="dm-box dm-absent">결석 처리된 날입니다</div>';
  else if(ev!==null) h+=`<div class="dm-grade"><span class="dm-g g${ev}">${GRADE_L[ev]}</span><div><div class="dm-g-lb">숙제 완성도${ev===0?' · 안함':''}</div><div class="dm-g-st g${ev}">${starRow(ev)}</div></div>${late?'<span class="dm-late"><i class="late-dot"></i>지각</span>':''}</div>`;
  else if(late) h+='<div class="dm-grade"><span class="dm-late" style="margin-left:0"><i class="late-dot"></i>지각</span></div>';
  const rows=[['진도',rec.prog],['지난 숙제',rec.prevHw],['오늘 숙제',rec.hwC],['클리닉',rec.cli]].filter(r=>has(r[1]));
  if(rows.length) h+='<div class="dm-rows">'+rows.map(r=>`<div class="dm-row"><span class="dm-k">${r[0]}</span><span class="dm-v">${escBr(r[1])}</span></div>`).join('')+'</div>';
  if(has(rec.comment)) h+=box('dm-cmt','숙제 코멘트',rec.comment);
  if(has(rec.special)) h+=box('dm-sp','특이사항',rec.special);
  document.getElementById('dmBody').innerHTML=h;
  openDetailDate=ds;
  document.getElementById('detailOv').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeDetail(){
  openDetailDate=null;
  document.getElementById('detailOv').classList.remove('open');
  document.body.style.overflow='';
}

var _vPlanYear, _vPlanMonth, _vPlannerData={};
function renderViewPlanners(data){
  _vPlannerData=data;
  if(!_vPlanYear){var now=new Date();_vPlanYear=now.getFullYear();_vPlanMonth=now.getMonth();}
  renderVPlanCal();
}
function changeVPlanMonth(dir){
  _vPlanMonth+=dir;
  if(_vPlanMonth>11){_vPlanMonth=0;_vPlanYear++;}
  if(_vPlanMonth<0){_vPlanMonth=11;_vPlanYear--;}
  renderVPlanCal();
}
function renderVPlanCal(){
  var mn=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('vPlanCalMonth').textContent=_vPlanYear+'년 '+mn[_vPlanMonth];
  var todayStr=today();
  var firstDay=new Date(_vPlanYear,_vPlanMonth,1).getDay();
  var daysInMonth=new Date(_vPlanYear,_vPlanMonth+1,0).getDate();
  var daysInPrev=new Date(_vPlanYear,_vPlanMonth,0).getDate();
  var dateMap={};
  Object.entries(_vPlannerData).forEach(function([pid_,p]){if(!p.date)return;if(!dateMap[p.date])dateMap[p.date]=[];dateMap[p.date].push(Object.assign({},p,{_pid:pid_}));});
  var grid=document.getElementById('vPlanCalGrid');
  grid.innerHTML='<div class="plan-cal-dow">일</div><div class="plan-cal-dow">월</div><div class="plan-cal-dow">화</div><div class="plan-cal-dow">수</div><div class="plan-cal-dow">목</div><div class="plan-cal-dow">금</div><div class="plan-cal-dow">토</div>';
  for(var i=firstDay-1;i>=0;i--){var cell=document.createElement('div');cell.className='plan-cal-day other-month';cell.innerHTML='<span class="plan-cal-day-num">'+(daysInPrev-i)+'</span>';grid.appendChild(cell);}
  for(var d=1;d<=daysInMonth;d++){
    var ds=_vPlanYear+'-'+String(_vPlanMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var dow=(firstDay+d-1)%7;
    var plans=dateMap[ds]||[];
    var cell=document.createElement('div');
    var cls='plan-cal-day'+(ds===todayStr?' today':'');
    if(dow===0)cls+=' sun';if(dow===6)cls+=' sat';
    if(plans.length)cls+=' has-plan';
    cell.className=cls;
    var dots='';
    if(plans.length){
      if(plans.some(function(p){return p.type!=='done';}))dots+='<div class="plan-dot plan-dot-blue"></div>';
      if(plans.some(function(p){return p.type==='done';}))dots+='<div class="plan-dot plan-dot-green"></div>';
    }
    cell.innerHTML='<span class="plan-cal-day-num">'+d+'</span>'+(dots?'<div class="plan-dot-row">'+dots+'</div>':'');
    if(plans.length)(function(date,ps){cell.addEventListener('click',function(){openVPlanDetail(date,ps);});})(ds,plans);
    grid.appendChild(cell);
  }
  var rem=(7-(firstDay+daysInMonth)%7)%7;
  for(var d=1;d<=rem;d++){var cell=document.createElement('div');cell.className='plan-cal-day other-month';cell.innerHTML='<span class="plan-cal-day-num">'+d+'</span>';grid.appendChild(cell);}
}
function openVPlanDetail(ds,plans){
  var p2=ds.split('-');
  document.getElementById('vpdmDate').textContent=p2[0]+'년 '+(+p2[1])+'월 '+(+p2[2])+'일';
  var html='';
  plans.sort(function(a,b){return(a.ts||0)-(b.ts||0);}).forEach(function(p){
    var badge=p.type==='done'?'<span class="plan-type-badge badge-done">완료 플래너</span>':'<span class="plan-type-badge badge-plan">계획 플래너</span>';
    var cmt=p.comment?'<div class="vpdm-comment"><div class="vpdm-comment-head">선생님 코멘트</div>'+esc(p.comment)+'</div>':'<div class="vpdm-no-comment">코멘트를 기다리는 중이에요</div>';
    var thumbSrc=p.imageData||p.thumbData||p.imageUrl||'';
    var imgPart='';
    if(thumbSrc){
      imgPart='<img class="vpdm-img" src="'+thumbSrc+'" loading="lazy">';
    } else if(p._pid){
      // 신형/마이그레이션: IndexedDB 캐시 → smPlannerImages
      var pid_=p._pid||'';
      imgPart='<div class="vpdm-img-ph" id="vpdmimg_'+pid_+'">불러오는 중...</div>';
    }
    html+='<div class="vpdm-item"><div class="vpdm-head2">'+badge+'</div>'+imgPart+cmt+'</div>';
  });
  document.getElementById('vpdmBody').innerHTML=html||'<p class="vpdm-empty">없음</p>';
  // 신형 이미지 async 로드 (IndexedDB 캐시 우선)
  plans.forEach(function(p){
    var pid_=p._pid||'';
    if(!pid_||p.thumbData||p.imageData||p.imageUrl) return;
    var el=document.getElementById('vpdmimg_'+pid_);
    if(!el) return;
    loadPlannerImg(pid_).then(function(src){
      if(!src){el.style.display='none';return;}
      var img=document.createElement('img');
      img.className='vpdm-img';img.src=src;img.loading='lazy';
      el.replaceWith(img);
    });
  });
  document.getElementById('vPlanDetailOv').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeVPlanDetail(){document.getElementById('vPlanDetailOv').classList.remove('open');document.body.style.overflow='';}

function openLbV(src){document.getElementById('lbVImg').src=src;document.getElementById('lbV').classList.add('open');document.body.style.overflow='hidden';}
function closeLbV(){document.getElementById('lbV').classList.remove('open');document.body.style.overflow='';}

async function submitC(){
  const name=document.getElementById('cName').value.trim();
  const content=document.getElementById('cContent').value.trim();
  const err=document.getElementById('cerr');
  if(!name){err.textContent='보내는 분을 입력해주세요';return;}
  if(!content){err.textContent='내용을 입력해주세요';return;}
  err.textContent='';
  const btn=document.getElementById('cBtn');
  btn.disabled=true;btn.textContent='전송 중...';
  try{
    await db.ref(`smConsultations/${sid_}`).push({name,content,ts:Date.now(),isRead:false});
    document.getElementById('cName').value='';
    document.getElementById('cContent').value='';
    const s=document.getElementById('cSucc');s.style.display='block';setTimeout(()=>s.style.display='none',4000);
  }catch(e){err.textContent='전송 실패: '+e.message;}
  btn.disabled=false;btn.textContent='상담 요청 보내기';
}

async function delConsult(cid){
  if(!confirm('이 상담 요청을 삭제하시겠습니까?'))return;
  await db.ref(`smConsultations/${sid_}/${cid}`).remove();
}

function renderSent(){
  const el=document.getElementById('sentList');
  const arr=Object.entries(consultData).sort(([,a],[,b])=>(b.ts||0)-(a.ts||0));
  if(!arr.length){el.innerHTML='';return;}
  el.innerHTML='<p class="sent-hd">상담 내역</p>'+arr.map(([cid,c])=>`
    <div class="sent-i">
      <div class="sent-t">
        <span>${new Date(c.ts||0).toLocaleString('ko-KR')} · ${c.name||''}</span>
        <button class="btn-del-sent" onclick="delConsult('${cid}')">삭제</button>
      </div>
      <div class="sent-body">${c.content||''}</div>
      ${c.reply
        ?`<div class="sent-reply"><div class="sent-reply-head">선생님 답변 · ${c.replyAt?new Date(c.replyAt).toLocaleString('ko-KR'):''}</div>${c.reply.replace(/\n/g,'<br>')}</div>`
        :`<div class="sent-no-reply">⏳ 아직 답변이 없습니다</div>`
      }
    </div>`).join('');
}
</script>









<script>
(function(){
  // URL에 _v 파라미터 있으면 제거 (이미 새로 받아온 것)
  var url=new URL(location.href);
  var urlVer=url.searchParams.get('_v');
  if(urlVer){
    localStorage.setItem('smv',urlVer);
    url.searchParams.delete('_v');
    history.replaceState(null,'',url.toString());
  }

  function getDB(){
    try{
      if(typeof firebase==='undefined') return null;
      if(firebase.apps&&firebase.apps.length>0) return firebase.database();
      if(typeof SM_CONFIG==='undefined'||!SM_CONFIG.apiKey||SM_CONFIG.apiKey.includes('여기에')) return null;
      firebase.initializeApp(SM_CONFIG);
      return firebase.database();
    }catch(e){return null;}
  }

  var _smvRef=null;
  function doCheck(){
    var db=getDB();
    if(!db) return;
    if(_smvRef) return;
    var urlVer=new URL(location.href).searchParams.get('_v');
    if(urlVer) localStorage.setItem('smv',urlVer);
    _smvRef=db.ref('smAppVersion');
    _smvRef.on('value',function(s){
      var sv=String(s.val()||'');
      if(!sv) return;
      var lv=localStorage.getItem('smv')||'';
      if(lv===sv) return;
      if(location.search.indexOf('_v='+sv)!==-1) return;
      location.replace(location.pathname+'?_v='+sv);
    });
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',function(){doCheck();});
  }else{doCheck();}
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible') doCheck();
  });
})();

</script>
