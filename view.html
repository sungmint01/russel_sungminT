<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수업 현황 — 성민T</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="config.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
/* G마켓 산스: 400~500 = Medium, 600~900 = Bold */
@font-face{font-family:'GmarketSans';font-weight:100 500;font-style:normal;font-display:swap;src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff') format('woff')}
@font-face{font-family:'GmarketSans';font-weight:600 900;font-style:normal;font-display:swap;src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff')}

/* ── Soft Studio · 화면 규칙 (2026-10 리디자인) — student.html과 같은 토큰
   라벤더 = 계획·선택 / 민트 = 완료·코멘트 / 로즈 = 결석·전달 메모 / 살구 = 지각 */
:root{
  --ground:#FBFAFF;--surface:#FFFFFF;--panel:#F4F2FC;--panel-2:#EEEBFA;
  --border:#E9E5F6;--rule:#EFECF9;--control:#D9D3F0;
  --ink:#3D3860;--muted:#5C5680;--faint:#6B6690;
  --accent:#6B5FB8;--accent-ink:#5B4FA8;--accent-soft:#A89BEB;
  --mint:#2E735E;--mint-ink:#2A6352;--mint-fill:#7FC7AC;--mint-tint:#EAF6F1;
  --rose:#B0497A;--rose-fill:#DE8FAC;--rose-tint:#FCEEF4;--rose-line:#F0C6D8;
  --apricot:#9A5F1F;--apricot-fill:#F2B36D;--apricot-tint:#FDF2E6;
  --r-card:20px;--r-inner:14px;
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'GmarketSans','Pretendard','Noto Sans KR',-apple-system,sans-serif;background:var(--ground);color:var(--ink);
  min-height:100vh;-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
button{font-family:inherit}
button:focus-visible,a:focus-visible,.inp:focus-visible,.linp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#load{min-height:100vh;display:flex;align-items:center;justify-content:center}
.sp{width:32px;height:32px;border:3px solid var(--panel-2);border-top-color:var(--accent-ink);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.ld-txt{color:var(--muted);font-size:14px;text-align:center}
/* Login */
#loginPage{min-height:100vh;display:none;align-items:center;justify-content:center;padding:24px 16px;background:var(--panel)}
.lbox{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:36px 28px 28px;width:100%;max-width:340px;text-align:center}
.lico{width:52px;height:52px;border-radius:16px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;
  background:var(--accent-ink);color:#fff;font-size:24px;font-weight:700}
.lbox .lbox-t{font-size:22px;font-weight:700;color:var(--ink);letter-spacing:-.4px;margin-bottom:6px}
.lbox .lsub{font-size:13px;color:var(--faint);margin-bottom:24px}
.linp{width:100%;height:48px;border:1px solid var(--control);border-radius:var(--r-inner);padding:0 16px;font-size:15px;font-family:inherit;outline:none;
  transition:border-color .2s;background:var(--surface);color:var(--ink);letter-spacing:4px;text-align:center;margin-bottom:10px}
.linp::placeholder{letter-spacing:0;color:var(--faint)}
.linp:focus{border-color:var(--accent)}
.lbtn{width:100%;height:48px;background:var(--accent-ink);color:#fff;border:none;border-radius:var(--r-inner);font-size:15px;font-weight:700;cursor:pointer;
  transition:background .2s,transform .2s var(--spring)}
.lbtn:hover{background:#4E4396}
.lbtn:active{transform:scale(.98)}
.lbtn:disabled{background:var(--panel-2);color:var(--faint);cursor:not-allowed;transform:none}
.lerr{color:var(--rose);font-size:13px;margin-top:8px;min-height:18px}
.lback{display:inline-block;margin-top:14px;font-size:13px;color:var(--faint);text-decoration:none}
.lback:hover{color:var(--ink)}
.err{text-align:center;padding:40px 20px}
.err .ei{display:none}
.err h2{font-size:18px;font-weight:700;margin-bottom:8px}
.err p{font-size:14px;color:var(--muted);line-height:1.7}

#wrap{display:none;max-width:560px;margin:0 auto;padding:0 16px 48px}
.app-bar{display:flex;align-items:center;gap:8px;height:56px}
.app-mark{width:28px;height:28px;border-radius:9px;background:var(--accent-ink);color:#fff;font-size:14px;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex:none}
.app-name{font-size:14px;font-weight:700;color:var(--ink);letter-spacing:-.2px}
.app-name span{color:var(--faint);font-weight:500;margin-left:4px}
/* ── 이름 + 이번 달 ── */
.hdr{background:var(--panel);border-radius:var(--r-card);padding:20px 20px 16px;margin:0 0 16px}
.hdr-name{font-size:26px;font-weight:700;color:var(--ink);letter-spacing:-.6px;line-height:1.2}
.hdr-tags{display:flex;gap:6px;margin-top:4px}
.htag{font-size:14px;color:var(--muted)}
.htag:empty{display:none}
.htag+.htag:before{content:'·';margin-right:6px;color:var(--faint)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;background:var(--surface);border-radius:var(--r-inner)}
.sc{display:flex;flex-direction:column-reverse;padding:12px 14px}
.sc+.sc{border-left:1px solid var(--rule)}
.sn{font-size:22px;font-weight:500;letter-spacing:-.3px;line-height:1.15;font-variant-numeric:tabular-nums;color:var(--ink);margin-top:3px}
.sl{font-size:12px;color:var(--faint)}
.sn small{font-size:12px;font-weight:500;color:var(--rose);margin-left:6px;letter-spacing:0;white-space:nowrap}
/* ── 카드 ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);margin-bottom:16px}
.card-head{padding:20px 20px 0;font-size:17px;font-weight:700;color:var(--ink);letter-spacing:-.3px}
/* ── 학습 달력 ── */
.cal-wrap{padding:12px 14px 16px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-month{font-size:15px;font-weight:700;color:var(--ink);letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.cal-nav-btn{background:var(--panel);border:none;border-radius:12px;width:36px;height:36px;cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center;color:var(--accent-ink);transition:background .2s,transform .2s var(--spring)}
.cal-nav-btn:hover{background:var(--panel-2)}
.cal-nav-btn:active{transform:scale(.92)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-dow{text-align:center;font-size:12px;font-weight:500;color:var(--faint);padding:2px 0 6px}
.cal-dow:first-child{color:var(--rose)}
.cal-day{position:relative;min-height:70px;border-radius:12px;padding:6px 3px 6px;display:flex;flex-direction:column;align-items:center;
  cursor:pointer;border:1px solid transparent;transition:background .2s,transform .2s var(--spring)}
.cal-day:hover{background:var(--panel)}
.cal-day:active{transform:scale(.95)}
.cal-day.other-month{cursor:default}
.cal-day.other-month:hover{background:transparent}
.cal-day.other-month:active{transform:none}
.cal-day-num{align-self:flex-start;padding-left:3px;font-size:12px;font-weight:500;line-height:1;color:var(--muted);font-variant-numeric:tabular-nums}
.sun .cal-day-num{color:var(--rose)}
.cal-day.other-month .cal-day-num{color:#CFCBE2}
.cal-day.rec{background:var(--panel)}
.cal-day.abs{background:var(--rose-tint)}
.cal-day.today{border-color:var(--accent-soft)}
.cal-day.today .cal-day-num{color:var(--accent-ink);font-weight:700}
.cal-day.sel{border-color:var(--accent);background:var(--surface)}
.cal-day.sel .cal-day-num{color:var(--ink);font-weight:700}
.cal-g{font-size:18px;font-weight:700;line-height:1;margin-top:5px;letter-spacing:-.3px}
.cal-st{display:flex;gap:2px;margin-top:5px;line-height:1}
.cal-abs{font-size:12px;font-weight:700;color:var(--rose);margin-top:10px}
/* 별점 5칸 = 작은 점 5개 (채운 것은 등급색) */
.pip{display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor}
.st-off{color:#DCD7EF}
.late-dot,.memo-dot,.pl-dot{display:inline-block;width:7px;height:7px;border-radius:50%}
.late-dot{background:var(--apricot-fill)}
.memo-dot{background:var(--rose-fill)}
.pl-p{background:var(--accent-soft)}.pl-d{background:var(--mint-fill)}
.cal-flags{position:absolute;top:6px;right:5px;display:flex;gap:2px}
.cal-pl{margin-top:auto;padding-top:4px;display:flex;gap:3px}
.cal-pl .pl-dot{width:6px;height:6px}
.g5{color:#4E4396}.g4{color:#5B4FA8}.g3{color:#6B5FB8}.g2{color:#7B70C4}.g1{color:#6B6690}.g0{color:var(--rose)}
.cal-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;padding:14px 2px 0;font-size:12px;color:var(--faint)}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}
.lg-abs{width:10px;height:10px;border-radius:3px;background:var(--rose-tint);border:1px solid var(--rose-line)}
.lg-g{font-size:12px;font-weight:700;color:var(--accent-ink)}
/* ── 날짜 카드 ── */
.dc{padding:16px 18px 18px}
.dc-nav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.dc-nav .cal-nav-btn:disabled{opacity:.35;cursor:default;transform:none}
.dc-title{flex:1;min-width:0;text-align:center}
.dc-cap{font-size:12px;font-weight:700;color:var(--accent-ink);display:flex;align-items:center;justify-content:center;gap:8px}
.dc-cap.past{color:var(--rose)}
.dc-today{border:1px solid var(--rose-line);background:var(--surface);color:var(--rose);font-size:12px;font-weight:700;
  cursor:pointer;height:26px;padding:0 10px;border-radius:99px}
.dc-date{font-size:18px;font-weight:700;color:var(--ink);letter-spacing:-.4px;margin-top:3px;font-variant-numeric:tabular-nums}
.dm-num{font-size:13px;font-weight:500;color:var(--faint);margin-left:7px;letter-spacing:0}
.dm-box{border-radius:var(--r-inner);padding:12px 14px;margin-bottom:10px;font-size:14px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}
.dm-box-lb{font-size:12px;font-weight:700;margin-bottom:4px}
.dm-note{background:var(--rose-tint);border:1px solid var(--rose-line);color:#7E3358}
.dm-note .dm-box-lb{color:var(--rose)}
.dm-sp{background:var(--panel);color:var(--ink)}
.dm-sp .dm-box-lb{color:var(--accent-ink)}
.dm-absent{background:var(--rose-tint);color:var(--rose);font-weight:700}
.dm-grade{display:flex;align-items:center;gap:14px;background:var(--panel);border-radius:var(--r-inner);padding:12px 16px;margin-bottom:12px}
.dm-g{font-size:30px;font-weight:700;line-height:1;letter-spacing:-.5px;min-width:26px;text-align:center}
.dm-g-lb{font-size:12px;font-weight:500;color:var(--faint)}
.dm-g-st{display:flex;gap:4px;margin-top:6px;line-height:1}
.dm-g-st .pip{width:8px;height:8px}
.dm-late{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--apricot);
  background:var(--apricot-tint);padding:4px 10px;border-radius:99px;white-space:nowrap}
.dc-row{display:flex;gap:10px;align-items:flex-start;padding:5px 0}
.dc-k{flex:none;width:76px;text-align:center;white-space:nowrap;font-size:11.5px;font-weight:700;
  color:var(--accent-ink);background:var(--panel-2);border-radius:99px;padding:3px 0;margin-top:2px}
.dc-k.fb{color:var(--mint);background:var(--mint-tint)}
.dc-v{flex:1;min-width:0;font-size:14px;color:var(--ink);line-height:1.65;overflow-wrap:anywhere}
.dc-noclass{font-size:14px;color:var(--faint);text-align:center;padding:6px 0 2px}
.dc-sec{font-size:13px;font-weight:700;color:var(--muted);margin:18px 2px 8px}
.dc-plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-items:start}
.dc-pl{border-radius:var(--r-inner);padding:12px;min-width:0}
.dc-pl.plan{background:var(--panel)}
.dc-pl.done{background:var(--mint-tint)}
.dc-pl.none{background:var(--surface);border:1px dashed var(--control)}
.dc-pl-h{display:flex;align-items:center;justify-content:space-between;gap:6px}
.dc-pl-t{font-size:13px;font-weight:700}
.dc-pl.plan .dc-pl-t{color:var(--accent-ink)}.dc-pl.done .dc-pl-t{color:var(--mint)}.dc-pl.none .dc-pl-t{color:var(--faint)}
.dc-pl-s{font-size:12px;color:var(--faint)}
.dc-pl-wait{font-size:12px;color:var(--faint);margin-top:6px}
.dc-pl-c{font-size:13px;line-height:1.6;color:var(--mint-ink);margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere}
.dc-pl.plan .dc-pl-c{color:var(--ink)}
.dc-pl-c b{display:block;font-size:12px;font-weight:700;color:var(--mint);margin-bottom:2px}
.dc-pl-btn{margin-top:10px;width:100%;height:36px;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;background:var(--surface);
  transition:transform .2s var(--spring)}
.dc-pl-btn:active{transform:scale(.97)}
.dc-pl.plan .dc-pl-btn{color:var(--accent-ink)}.dc-pl.done .dc-pl-btn{color:var(--mint)}
.dc-pl-btn:disabled{cursor:default;color:var(--faint)!important}
.dc-pl-img{display:block;width:100%;margin-top:10px;border-radius:10px;cursor:zoom-in}
/* ── 상담 요청 ── */
.csec{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:20px;margin-bottom:16px}
.csec h2{font-size:17px;font-weight:700;color:var(--ink);letter-spacing:-.3px;margin-bottom:4px}
.csec p{font-size:14px;color:var(--muted);line-height:1.65;margin-bottom:14px}
.inp{width:100%;border:1px solid var(--control);border-radius:var(--r-inner);padding:12px 14px;font-size:15px;font-family:inherit;
  outline:none;background:var(--surface);color:var(--ink);transition:border-color .2s}
.inp::placeholder{color:var(--faint)}
.inp:focus{border-color:var(--accent)}
input.inp{height:48px}
textarea.inp{resize:vertical;min-height:110px;line-height:1.6}
.sbtn{width:100%;height:50px;margin-top:10px;border:none;border-radius:var(--r-inner);font-size:15px;font-weight:700;color:#fff;
  cursor:pointer;background:var(--accent-ink);transition:background .2s,transform .2s var(--spring)}
.sbtn:hover{background:#4E4396}
.sbtn:active{transform:scale(.98)}
.sbtn:disabled{background:var(--panel-2);color:var(--faint);cursor:not-allowed;transform:none}
.succ{display:none;margin-top:8px;border-radius:12px;padding:12px;text-align:center;font-size:14px;font-weight:700;color:var(--mint);background:var(--mint-tint)}
.cerr{color:var(--rose);font-size:13px;margin-top:6px;min-height:18px}
.sent-hd{font-size:13px !important;font-weight:700;color:var(--muted) !important;margin:18px 0 8px !important}
.sent-i{background:var(--panel);border-radius:var(--r-inner);padding:12px 14px;margin-bottom:10px;font-size:14px;color:var(--ink);line-height:1.6}
.sent-t{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--faint);margin-bottom:6px;font-variant-numeric:tabular-nums}
.sent-body{white-space:pre-wrap;margin-bottom:6px}
.sent-reply{margin-top:8px;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.6;color:var(--mint-ink);white-space:pre-wrap;background:var(--mint-tint)}
.sent-reply-head{font-size:12px;font-weight:700;color:var(--mint);margin-bottom:3px}
.sent-no-reply{font-size:13px;color:var(--faint);margin-top:4px}
.btn-del-sent{background:none;border:none;color:var(--rose);font-size:12px;cursor:pointer;padding:4px 0;flex:none}
.btn-del-sent:hover{text-decoration:underline}
footer{text-align:center;padding:16px 0 8px;color:var(--faint);font-size:12px}
.lightbox-v{position:fixed;inset:0;background:rgba(30,26,56,.9);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.lightbox-v.open{display:flex}
.lightbox-v img{max-width:100%;max-height:90vh;border-radius:10px;object-fit:contain}
.lbv-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.16);border:none;color:#fff;font-size:20px;width:44px;height:44px;border-radius:50%;cursor:pointer}
/* 큰 화면: 오늘 카드 왼쪽, 달력 오른쪽 */
@media(min-width:1024px){
  #wrap{max-width:1100px;padding:0 32px 48px}
  .hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
  .hdr .stats{width:480px;margin-top:0}
  #dayCard{float:left;width:calc(50% - 8px)}
  #dayCard+.card{float:right;width:calc(50% - 8px)}
  .csec{float:left;clear:left;width:calc(50% - 8px)}
  footer{clear:both}
}
</style>
</head>
<body>
<div id="loginPage">
  <div class="lbox">
    <div class="lico">S</div>
    <div class="lbox-t" role="heading" aria-level="1">학부모 페이지</div>
    <p class="lsub">수업 기록 · 숙제 · 상담</p>
    <input class="linp" type="password" id="pwIn" placeholder="비밀번호 입력" autocomplete="off" onkeydown="if(event.key==='Enter')doParentLogin()">
    <button class="lbtn" id="loginBtn" onclick="doParentLogin()">확인 →</button>
    <div class="lerr" id="lerr"></div>
    <a class="lback" href="./main.html">← 홈으로</a>
  </div>
</div>
<div id="load"><div><div class="sp"></div><p class="ld-txt">불러오는 중...</p></div></div>
<div id="wrap">
  <div class="app-bar"><span class="app-mark">S</span><span class="app-name">성민T<span>학부모</span></span></div>
  <div class="hdr">
    <div>
      <h1 class="hdr-name" id="hName"></h1>
      <div class="hdr-tags"><span class="htag" id="hGrade"></span><span class="htag" id="hSubj"></span></div>
    </div>
    <div class="stats">
      <div class="sc"><div class="sn" id="sTot">0</div><div class="sl" id="sTotLb">수업 횟수</div></div>
      <div class="sc"><div class="sn" id="sAvg">-</div><div class="sl">평균 등급</div></div>
      <div class="sc"><div class="sn" id="sLast">-</div><div class="sl">최근 등급</div></div>
    </div>
  </div>
  <div>
    <!-- 날짜 카드: 기본 오늘, ‹ › 하루씩 -->
    <div class="card" id="dayCard">
      <div class="dc">
        <div class="dc-nav">
          <button class="cal-nav-btn" onclick="moveDay(-1)" aria-label="이전 날">‹</button>
          <div class="dc-title"><div class="dc-cap" id="dcCap"></div><div class="dc-date" id="dcDate"></div></div>
          <button class="cal-nav-btn" id="dcNext" onclick="moveDay(1)" aria-label="다음 날">›</button>
        </div>
        <div id="dcBody"></div>
      </div>
    </div>
    <div class="card">
      <h2 class="card-head">학습 달력</h2>
      <div class="cal-wrap">
        <div class="cal-nav">
          <button class="cal-nav-btn" onclick="changeMonth(-1)">‹</button>
          <span class="cal-month" id="calMonth"></span>
          <button class="cal-nav-btn" onclick="changeMonth(1)">›</button>
        </div>
        <div class="cal-grid" id="calGrid">
          <div class="cal-dow">일</div><div class="cal-dow">월</div><div class="cal-dow">화</div>
          <div class="cal-dow">수</div><div class="cal-dow">목</div><div class="cal-dow">금</div><div class="cal-dow">토</div>
        </div>
        <div class="cal-legend"><span><b class="lg-g">A~F</b>숙제</span><span><i class="pl-dot pl-p"></i>계획</span><span><i class="pl-dot pl-d"></i>완료</span><span><i class="late-dot"></i>지각</span><span><i class="memo-dot"></i>전달 메모</span><span><i class="lg-abs"></i>결석</span></div>
      </div>
    </div>
    <div class="csec">
      <h2>상담 요청</h2>
      <p>선생님께 궁금한 점이나 전달하실 내용을 남겨주세요.<br>확인 후 연락드리겠습니다.</p>
      <input class="inp" id="cName" type="text" placeholder="보내는 분 (예: 홍길동 어머니)" style="margin-bottom:10px">
      <textarea class="inp" id="cContent" placeholder="내용을 입력해주세요"></textarea>
      <div class="cerr" id="cerr"></div>
      <button class="sbtn" id="cBtn" onclick="submitC()">상담 요청 보내기</button>
      <div class="succ" id="cSucc">요청을 보냈어요. 확인 후 연락드릴게요.</div>

    </div>
    <footer>이 페이지는 학부모 확인용입니다</footer>
  </div>
</div>
<div class="lightbox-v" id="lbV" onclick="if(event.target===this)closeLbV()"><button class="lbv-close" onclick="closeLbV()" aria-label="닫기">✕</button><img id="lbVImg" style="max-width:100%;max-height:90vh;border-radius:10px;object-fit:contain"></div>

<script>
const PIC={
  _db:null,
  async db(){
    if(this._db) return this._db;
    return new Promise(res=>{
      const r=indexedDB.open('smtPlanner',1);
      r.onupgradeneeded=e=>e.target.result.createObjectStore('imgs',{keyPath:'pid'});
      r.onsuccess=e=>{this._db=e.target.result;res(this._db);};
      r.onerror=()=>res(null);
    });
  },
  async get(pid){
    try{
      const db=await this.db();if(!db)return null;
      return new Promise(res=>{
        const r=db.transaction('imgs').objectStore('imgs').get(pid);
        r.onsuccess=()=>{const v=r.result;res(v&&(Date.now()-v.ts)<60*86400000?v.src:null);};
        r.onerror=()=>res(null);
      });
    }catch{return null;}
  },
  async set(pid,src){
    try{
      const db=await this.db();if(!db)return;
      db.transaction('imgs','readwrite').objectStore('imgs').put({pid,src,ts:Date.now()});
    }catch{}
  },
  async del(pid){
    try{
      const db=await this.db();if(!db)return;
      db.transaction('imgs','readwrite').objectStore('imgs').delete(pid);
    }catch{}
  }
};
async function loadPlannerImg(pid){
  if(!pid)return null;
  try{
    const cached=await PIC.get(pid);
    if(cached)return cached;
    const snap=await db.ref('smPlannerImages/'+pid).get();
    const src=snap.val();
    if(src)PIC.set(pid,src);
    return src||null;
  }catch(e){
    console.error('이미지 로드 실패:',pid,e);
    return null;
  }
}


let db,sid_=null,recData={},sent=[],consultData={},calYear,calMonth;
function today(){
  const d=new Date();
  if(d.getHours()<3) d.setDate(d.getDate()-1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}


window.addEventListener('DOMContentLoaded',()=>{
  const now=new Date();calYear=now.getFullYear();calMonth=now.getMonth();
  if(typeof SM_CONFIG==='undefined'||!SM_CONFIG.apiKey||SM_CONFIG.apiKey.includes('여기에')){
    document.getElementById('load').innerHTML='<div class="err"><div class="ei"></div><h2>설정 오류</h2><p>config.js 파일에 Firebase 설정이 필요합니다</p></div>';return;
  }
  try{if(!firebase.apps.length)firebase.initializeApp(SM_CONFIG);db=firebase.database();}
  catch(e){showErr('Firebase 오류',''+e.message);return;}
  loadPage();
});

async function doParentLogin(){
  const pw=document.getElementById('pwIn').value;
  const err=document.getElementById('lerr');
  const btn=document.getElementById('loginBtn');
  if(!pw){err.textContent='비밀번호를 입력하세요';return;}
  err.textContent='';btn.disabled=true;btn.textContent='확인 중...';
  try{
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pw));
    const hash=[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
    const snap=await db.ref('smStudents').get();
    const all=snap.val()||{};
    const match=Object.values(all).find(s=>s.parentPwHash===hash);
    if(match){
      // Hide login, show loading, load data
      document.getElementById('loginPage').style.display='none';
      document.getElementById('load').style.display='flex';
      const matchEntry=Object.entries(snap.val()||{}).find(([,s])=>s.parentPwHash===hash);loadStudentData(matchEntry[0],matchEntry[1]);
    }else{
      err.textContent='비밀번호가 올바르지 않습니다';
      document.getElementById('pwIn').value='';
      document.getElementById('pwIn').focus();
    }
  }catch(e){err.textContent='오류: '+e.message;}
  btn.disabled=false;btn.textContent='확인 →';
}

async function loadPage(){
  const token=new URLSearchParams(location.search).get('token');
  if(!token){
    // No token → show login page
    document.getElementById('load').style.display='none';
    document.getElementById('loginPage').style.display='flex';
    return;
  }
  try{
    // ✅ client-side 필터링 (인덱스 불필요)
    const snap=await db.ref('smStudents').get();
    const all=snap.val()||{};
    const entry=Object.entries(all).find(([,s])=>s.token===token);
    if(!entry){showErr('학생을 찾을 수 없습니다','링크가 만료되었거나 잘못된 링크입니다.');return;}
    loadStudentData(entry[0], entry[1]);
  }catch(e){showErr('오류 발생',''+e.message);}
}

function loadStudentData(stuId, stu){
  sid_=stuId;
  document.title=stu.name+' — 수업 현황';
  document.getElementById('hName').textContent=stu.name||'';
  document.getElementById('hGrade').textContent=stu.grade||'';
  document.getElementById('hSubj').textContent=stu.subj||'';
  document.getElementById('load').style.display='none';
  document.getElementById('wrap').style.display='block';
  db.ref('smSessions/'+sid_).on('value',function(s){
    try{
      recData=s.val()||{};
      renderStats();
      renderCal();
      renderDay();
    }catch(e){console.error('session render error:',e);}
  });
  db.ref('smPlanners/'+sid_).on('value',function(s){try{renderViewPlanners(s.val()||{});}catch(e){console.error('planner render error:',e);}});
  const stored=localStorage.getItem('smSent_'+sid_);
  if(stored)try{sent=JSON.parse(stored);}catch(e){}
  db.ref('smConsultations/'+sid_).on('value',function(s){try{consultData=s.val()||{};renderSent();}catch(e){console.error('consult render error:',e);}});
}
function showErr(title,msg){document.getElementById('load').innerHTML=`<div class="err"><div class="ei"></div><h2>${title}</h2><p>${msg}</p></div>`;}

function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function escBr(t){return esc(t).replace(/\n/g,'<br>');}
var GRADE_L={5:'A',4:'B',3:'C',2:'D',1:'E',0:'F'};
// 별 5칸: 채운 별은 등급색, 빈 별은 옅게
function starRow(n){return '<i class="pip"></i>'.repeat(n)+'<i class="pip st-off"></i>'.repeat(5-n);}
function hasRecData(r){return r.eval!=null||r.prog||r.hwC||r.cli||r.comment||r.special||r.absent||r.late||r.prevHw||r.note;}
// 날짜별 대표 세션: 기록 있는 것 → cli 있는 것 우선 → 최근 수정
function buildRecMap(){
  const recMap={};
  Object.values(recData).forEach(r=>{
    if(!r||!r.date||!hasRecData(r)) return;
    const prev=recMap[r.date];
    if(!prev) recMap[r.date]=r;
    else if(!!(r.cli&&r.cli.trim())&&!(prev.cli&&prev.cli.trim())) recMap[r.date]=r;
    else if(!(r.cli&&r.cli.trim())&&(prev.cli&&prev.cli.trim())) {/* keep prev */}
    else if((r.upd||0)>(prev.upd||0)) recMap[r.date]=r;
  });
  return recMap;
}
function starsLabel(n,absent){
  if(absent) return'결석';
  if(n==null||n<0) return'-';
  const l={5:'A',4:'B',3:'C',2:'D',1:'E',0:'F(안함)'};
  return l[n]!==undefined?l[n]:'-';
}

function renderStats(){
  const monthStr=calYear+'-'+String(calMonth+1).padStart(2,'0');
  // 의미 있는 데이터가 있는 세션만 카운트 (recMap과 동일 기준)
  const monthRecs=Object.values(recData).filter(r=>{
    if(!r.date||!r.date.startsWith(monthStr)) return false;
    return r.eval!=null||r.prog||r.hwC||r.cli||r.comment||r.special||r.absent||r.late||r.prevHw||r.note;
  });
  // 수업 횟수: 달력과 같은 기준(날짜별 대표 기록)으로 그 달 수업한 날을 센다.
  // 예전엔 회차(num) 최댓값을 썼는데, 회차가 달을 넘어 이어지면 그 달 수업보다 크게 나왔다
  const recMap=buildRecMap();
  const dayList=Object.keys(recMap).filter(d=>d.startsWith(monthStr));
  const absN=dayList.filter(d=>recMap[d].absent).length;
  document.getElementById('sTot').innerHTML=dayList.length?dayList.length+'회'+(absN?'<small>결석 '+absN+'</small>':''):'-';
  document.getElementById('sTotLb').textContent=(calMonth+1)+'월 수업';
  // 평균/최근 등급: 해당 월 중 eval 있는 것
  const arr=monthRecs.filter(r=>r.eval!=null&&r.eval>=0);
  if(arr.length){
    const valid=arr.filter(r=>r.eval>0);
    const avg=valid.length?Math.round(valid.reduce((a,r)=>a+(r.eval||0),0)/valid.length*10)/10:'-';
    document.getElementById('sAvg').textContent=(avg==='-')?'-':avg+' / 5';
    const sorted=arr.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    const ev=sorted[0].eval!=null&&sorted[0].eval>=0?sorted[0].eval:null;
    document.getElementById('sLast').textContent=starsLabel(ev);
  }else{
    document.getElementById('sAvg').textContent='-';
    document.getElementById('sLast').textContent='-';
  }
}

function changeMonth(dir){
  calMonth+=dir;
  if(calMonth>11){calMonth=0;calYear++;}
  if(calMonth<0){calMonth=11;calYear--;}
  renderCal();renderStats();
}

function renderCal(){
  const recMap=buildRecMap(), planMap=buildPlanMap(), sel=selDate();
  const mn=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('calMonth').textContent=`${calYear}년 ${mn[calMonth]}`;
  const todayStr=today();
  const firstDay=new Date(calYear,calMonth,1).getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const daysInPrev=new Date(calYear,calMonth,0).getDate();
  const grid=document.getElementById('calGrid');
  grid.innerHTML=`
    <div class="cal-dow">일</div><div class="cal-dow">월</div><div class="cal-dow">화</div>
    <div class="cal-dow">수</div><div class="cal-dow">목</div><div class="cal-dow">금</div><div class="cal-dow">토</div>
  `;
  for(let i=firstDay-1;i>=0;i--){
    const cell=document.createElement('div');
    cell.className='cal-day other-month';
    cell.innerHTML=`<span class="cal-day-num">${daysInPrev-i}</span>`;
    grid.appendChild(cell);
  }
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const rec=recMap[ds], plans=planMap[ds]||[];
    const dow=(firstDay+d-1)%7;
    const cell=document.createElement('div');
    cell.className='cal-day'+(ds===todayStr?' today':'')+(rec?(rec.absent?' rec abs':' rec'):'')+(ds===sel?' sel':'');
    if(dow===0)cell.classList.add('sun');
    if(dow===6)cell.classList.add('sat');
    let body='', flags='';
    if(rec){
      const ev=rec.eval!=null&&rec.eval>=0&&rec.eval<=5?rec.eval:null;
      if(rec.absent) body='<div class="cal-abs">결석</div>';
      else if(ev!==null) body=`<div class="cal-g g${ev}">${GRADE_L[ev]}</div><div class="cal-st g${ev}">${starRow(ev)}</div>`;
      if(!rec.absent&&rec.late) flags+='<i class="late-dot"></i>';
      if(rec.note&&String(rec.note).trim()) flags+='<i class="memo-dot"></i>';
    }
    let pl='';
    if(plans.some(p=>p.type!=='done')) pl+='<i class="pl-dot pl-p"></i>';
    if(plans.some(p=>p.type==='done')) pl+='<i class="pl-dot pl-d"></i>';
    cell.innerHTML=`<span class="cal-day-num">${d}</span>${flags?`<span class="cal-flags">${flags}</span>`:''}${body}${pl?`<span class="cal-pl">${pl}</span>`:''}`;
    cell.addEventListener('click',(function(d){return function(){selectDay(d,true);};})(ds));
    grid.appendChild(cell);
  }
  const total=firstDay+daysInMonth;
  const rem=(7-total%7)%7;
  for(let d=1;d<=rem;d++){
    const cell=document.createElement('div');
    cell.className='cal-day other-month';
    cell.innerHTML=`<span class="cal-day-num">${d}</span>`;
    grid.appendChild(cell);
  }
}

// ── 날짜 카드 ──
// _selDate가 null이면 '오늘'(3시 기준). ‹ › 는 하루씩, 오늘 이후로는 가지 않는다
var _selDate=null, _vPlannerData={}, _dcPlans={}, _dcShown={}, _dcShownDate=null;
function selDate(){ return _selDate||today(); }
function addDaysStr(ds,n){
  var p=ds.split('-'), d=new Date(+p[0],+p[1]-1,+p[2]+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function buildPlanMap(){
  var m={};
  Object.entries(_vPlannerData||{}).forEach(function(e){
    var p=e[1]; if(!p||!p.date) return;
    (m[p.date]=m[p.date]||[]).push(Object.assign({},p,{_pid:e[0]}));
  });
  return m;
}
function renderViewPlanners(data){ _vPlannerData=data||{}; renderCal(); renderDay(); }
function selectDay(ds,scroll){
  _selDate=(ds===today())?null:ds;
  // 달력 월을 선택한 날에 맞춘다 (하루씩 넘기다 월이 바뀌는 경우)
  var p=selDate().split('-');
  if(+p[0]!==calYear||+p[1]-1!==calMonth){ calYear=+p[0]; calMonth=+p[1]-1; renderStats(); }
  renderCal(); renderDay();
  if(scroll){ var c=document.getElementById('dayCard'); if(c&&c.scrollIntoView) c.scrollIntoView({behavior:'smooth',block:'start'}); }
}
function moveDay(dir){
  var n=addDaysStr(selDate(),dir);
  if(dir>0&&n>today()) return;
  selectDay(n,false);
}
function goToday(){ selectDay(today(),false); }
function renderDay(){
  var body=document.getElementById('dcBody'); if(!body) return;
  var ds=selDate(), td=today(), isToday=ds===td;
  if(_dcShownDate!==ds){ _dcShown={}; _dcShownDate=ds; }
  var p=ds.split('-'), dow=['일','월','화','수','목','금','토'][new Date(+p[0],+p[1]-1,+p[2]).getDay()];
  var rec=buildRecMap()[ds], plans=buildPlanMap()[ds]||[];
  var cap=document.getElementById('dcCap');
  cap.className='dc-cap'+(isToday?'':' past');
  cap.innerHTML=isToday?'오늘':(ds<td?'지난 날':'다가올 날')+'<button class="dc-today" onclick="goToday()">오늘로</button>';
  document.getElementById('dcDate').innerHTML=`${+p[1]}월 ${+p[2]}일 (${dow})`+(rec&&rec.num?`<span class="dm-num">${esc(rec.num)}회차</span>`:'');
  document.getElementById('dcNext').disabled=(ds>=td);
  var has=function(v){return v!=null&&String(v).trim()!=='';};
  var h='';
  if(rec){
    if(has(rec.note)) h+=`<div class="dm-box dm-note"><div class="dm-box-lb">선생님이 전하는 말</div>${escBr(rec.note)}</div>`;
    var ev=rec.eval!=null&&rec.eval>=0&&rec.eval<=5?rec.eval:null;
    var absent=!!rec.absent, late=!absent&&!!rec.late;
    if(absent) h+='<div class="dm-box dm-absent">결석 처리된 날입니다</div>';
    else if(ev!==null) h+=`<div class="dm-grade"><span class="dm-g g${ev}">${GRADE_L[ev]}</span><div><div class="dm-g-lb">숙제 완성도${ev===0?' · 안함':''}</div><div class="dm-g-st g${ev}">${starRow(ev)}</div></div>${late?'<span class="dm-late"><i class="late-dot"></i>지각</span>':''}</div>`;
    else if(late) h+='<div class="dm-grade"><span class="dm-late" style="margin-left:0"><i class="late-dot"></i>지각</span></div>';
    [['진도',rec.prog],['지난 숙제',rec.prevHw],['오늘 숙제',rec.hwC],['클리닉',rec.cli],['숙제 피드백',rec.comment,'fb']].forEach(function(r){
      if(has(r[1])) h+=`<div class="dc-row"><span class="dc-k${r[2]?' '+r[2]:''}">${r[0]}</span><span class="dc-v">${escBr(String(r[1]).trim())}</span></div>`;
    });
    if(has(rec.special)) h+=`<div class="dm-box dm-sp" style="margin-top:10px"><div class="dm-box-lb">특이사항</div>${escBr(rec.special)}</div>`;
  }else{
    h+=`<div class="dc-noclass">${ds>td?'아직 기록이 없는 날이에요':'수업 기록이 없는 날이에요'}</div>`;
  }
  // 플래너: 오늘·지난 날은 제출 여부까지, 미래는 제출된 것만
  var pl=plans.filter(function(x){return x.type!=='done';}), dn=plans.filter(function(x){return x.type==='done';});
  if(plans.length||ds<=td){
    _dcPlans={};
    h+='<div class="dc-sec">플래너</div><div class="dc-plans">'+plTiles(pl,'plan','계획 플래너')+plTiles(dn,'done','완료 플래너')+'</div>';
  }
  body.innerHTML=h;
  // 다시 그려도 이미 펼친 사진은 유지 (IndexedDB 캐시라 재조회 부담 없음)
  Object.keys(_dcShown).forEach(function(pid){
    var b=document.getElementById('dcb_'+pid); if(b) showPlanImg(pid,b);
  });
}
function plTiles(list,type,label){
  if(!list.length) return `<div class="dc-pl none"><div class="dc-pl-h"><span class="dc-pl-t">${label}</span><span class="dc-pl-s">제출 전</span></div></div>`;
  return list.slice().sort(function(a,b){return(a.ts||0)-(b.ts||0);}).map(function(x){
    _dcPlans[x._pid]=x;
    var c=(x.comment&&String(x.comment).trim())
      ?`<div class="dc-pl-c"><b>선생님 코멘트</b>${esc(String(x.comment).trim())}</div>`
      :'<div class="dc-pl-wait">코멘트 대기 중</div>';
    return `<div class="dc-pl ${type}"><div class="dc-pl-h"><span class="dc-pl-t">${label}</span><span class="dc-pl-s">제출</span></div>${c}`
      +`<button class="dc-pl-btn" id="dcb_${x._pid}" onclick="showPlanImg('${x._pid}',this)">사진 보기</button></div>`;
  }).join('');
}
// 사진은 눌렀을 때만 불러온다 (대역폭)
function showPlanImg(pid,btn){
  var x=_dcPlans[pid]; if(!x||!btn) return;
  _dcShown[pid]=1;
  btn.disabled=true; btn.textContent='불러오는 중...';
  var direct=x.imageData||x.thumbData||x.imageUrl||'';
  (direct?Promise.resolve(direct):loadPlannerImg(pid)).then(function(src){
    if(!btn.isConnected) return;
    if(!src){ btn.textContent='사진이 없어요'; return; }
    var img=document.createElement('img');
    img.className='dc-pl-img'; img.src=src; img.alt='플래너 사진';
    img.addEventListener('click',function(){openLbV(src);});
    btn.replaceWith(img);
  });
}

// Firebase 재연결 시 자동 갱신
window.addEventListener('focus', function(){
  if(sid_ && db){
    db.ref('smSessions/'+sid_).once('value', function(s){
      try{recData=s.val()||{};renderStats();renderCal();renderDay();}catch(e){}
    });
  }
});


function openLbV(src){document.getElementById('lbVImg').src=src;document.getElementById('lbV').classList.add('open');document.body.style.overflow='hidden';}
function closeLbV(){document.getElementById('lbV').classList.remove('open');document.body.style.overflow='';}

async function submitC(){
  const name=document.getElementById('cName').value.trim();
  const content=document.getElementById('cContent').value.trim();
  const err=document.getElementById('cerr');
  if(!name){err.textContent='보내는 분을 입력해주세요';return;}
  if(!content){err.textContent='내용을 입력해주세요';return;}
  err.textContent='';
  const btn=document.getElementById('cBtn');
  btn.disabled=true;btn.textContent='전송 중...';
  try{
    await db.ref(`smConsultations/${sid_}`).push({name,content,ts:Date.now(),isRead:false});
    document.getElementById('cName').value='';
    document.getElementById('cContent').value='';
    const s=document.getElementById('cSucc');s.style.display='block';setTimeout(()=>s.style.display='none',4000);
  }catch(e){err.textContent='전송 실패: '+e.message;}
  btn.disabled=false;btn.textContent='상담 요청 보내기';
}

async function delConsult(cid){
  if(!confirm('이 상담 요청을 삭제하시겠습니까?'))return;
  await db.ref(`smConsultations/${sid_}/${cid}`).remove();
}

function renderSent(){
  const el=document.getElementById('sentList');
  const arr=Object.entries(consultData).sort(([,a],[,b])=>(b.ts||0)-(a.ts||0));
  if(!arr.length){el.innerHTML='';return;}
  el.innerHTML='<p class="sent-hd">상담 내역</p>'+arr.map(([cid,c])=>`
    <div class="sent-i">
      <div class="sent-t">
        <span>${new Date(c.ts||0).toLocaleString('ko-KR')} · ${c.name||''}</span>
        <button class="btn-del-sent" onclick="delConsult('${cid}')">삭제</button>
      </div>
      <div class="sent-body">${c.content||''}</div>
      ${c.reply
        ?`<div class="sent-reply"><div class="sent-reply-head">선생님 답변 · ${c.replyAt?new Date(c.replyAt).toLocaleString('ko-KR'):''}</div>${c.reply.replace(/\n/g,'<br>')}</div>`
        :`<div class="sent-no-reply">아직 답변이 없습니다</div>`
      }
    </div>`).join('');
}
</script>

<script>
(function(){
  // URL에 _v 파라미터 있으면 제거 (이미 새로 받아온 것)
  var url=new URL(location.href);
  var urlVer=url.searchParams.get('_v');
  if(urlVer){
    localStorage.setItem('smv',urlVer);
    url.searchParams.delete('_v');
    history.replaceState(null,'',url.toString());
  }

  function getDB(){
    try{
      if(typeof firebase==='undefined') return null;
      if(firebase.apps&&firebase.apps.length>0) return firebase.database();
      if(typeof SM_CONFIG==='undefined'||!SM_CONFIG.apiKey||SM_CONFIG.apiKey.includes('여기에')) return null;
      firebase.initializeApp(SM_CONFIG);
      return firebase.database();
    }catch(e){return null;}
  }

  var _smvRef=null;
  function doCheck(){
    var db=getDB();
    if(!db) return;
    if(_smvRef) return;
    var urlVer=new URL(location.href).searchParams.get('_v');
    if(urlVer) localStorage.setItem('smv',urlVer);
    _smvRef=db.ref('smAppVersion');
    _smvRef.on('value',function(s){
      var sv=String(s.val()||'');
      if(!sv) return;
      var lv=localStorage.getItem('smv')||'';
      if(lv===sv) return;
      if(location.search.indexOf('_v='+sv)!==-1) return;
      location.replace(location.pathname+'?_v='+sv);
    });
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',function(){doCheck();});
  }else{doCheck();}
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible') doCheck();
  });
})();

</script>
