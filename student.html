<!DOCTYPE html>
<html lang="ko">
<head>
<script>
/* 탭 전환 시 로그인 화면이 번쩍이는 것을 막는다.
   세션이 있으면 body 그려지기 전에 preauth 표시 → 로그인 박스 숨김 */
(function(){try{
  if(sessionStorage.getItem('stuId')&&sessionStorage.getItem('stuHash'))
    document.documentElement.className+=' preauth';
}catch(e){}})();
</script>
<meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학생 — 성민T</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Gothic+A1:wght@300;400;700;900&family=Noto+Sans+KR:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="config.js"></script>
<style>:root{
  --p1:#8B7FD9;--p2:#A89BEB;--p3:#C7BEF3;--p4:#B8AEF0;
  --warm:#E8795A;--cool:#56A08A;--gold:#D4A84B;
  --shadow:rgba(120,100,200,.10);
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Noto Sans KR',-apple-system,sans-serif;background:#FBFAFF;background-image:radial-gradient(circle at 12% 8%,rgba(240,166,196,.10) 0%,transparent 42%),radial-gradient(circle at 88% 92%,rgba(139,127,217,.10) 0%,transparent 45%);color:#3D3860;min-height:100vh;-webkit-font-smoothing:antialiased}
:root{--bl:#A89BEB;--bld:#A89BEB;--pu:#A89BEB;--pud:#8B7FD9}

/* Login */
#loginPage{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(150deg,#8B7FD9 0%,#A89BEB 45%,#D4A5C8 100%)}
.lbox{background:#fff;border-radius:28px;padding:44px 36px;width:320px;box-shadow:0 20px 50px rgba(120,105,205,.28),0 6px 16px rgba(120,105,205,.14);text-align:center}
.lbox .ico{color:#fff;font-weight:800;width:60px;height:60px;background:linear-gradient(135deg,#8B7FD9,#A89BEB);border-radius:19px;display:flex;align-items:center;justify-content:center;font-size:27px;margin:0 auto 18px;box-shadow:0 8px 20px rgba(139,127,217,.35)}
.lbox h1{font-family:'MaruBuri','Noto Sans KR',sans-serif;font-size:22px;margin-bottom:4px;background:linear-gradient(135deg,#8B7FD9,#A89BEB);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.lbox .sub{font-family:'Noto Sans KR','MaruBuri',sans-serif;font-size:10px;color:#AAA5C8;letter-spacing:2px;margin-bottom:28px;text-transform:uppercase}
.inp{width:100%;border:1.5px solid #EAE6F5;border-radius:14px;padding:13px 16px;font-size:14px;font-family:inherit;outline:none;transition:.25s;margin-bottom:12px;background:#FBFAFF}
.inp:focus{border-color:var(--pu);box-shadow:0 0 0 3px rgba(167,139,250,.15)}
.btn-pri{width:100%;background:linear-gradient(135deg,#8B7FD9,#A89BEB);color:#fff;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s;box-shadow:0 6px 16px rgba(139,127,217,.3)}
.btn-pri:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(139,127,217,.4)}
.errmsg{color:#ef4444;font-size:12px;margin-top:8px;min-height:16px}
.back-link{display:block;margin-top:16px;font-size:12px;color:#AAA5C8;text-decoration:none;font-family:'Noto Sans KR','MaruBuri',sans-serif}
.back-link:hover{color:#7070A8}

/* App */
#app{display:none;max-width:560px;margin:0 auto;padding:0 14px 60px}

/* Header */
.hdr{background:linear-gradient(168deg,#453D78 0%,#5B51A0 38%,#7A6DC9 72%,#9A8CE0 100%);
  padding:26px 22px 30px;margin:12px 0 0;position:relative;overflow:hidden;border-radius:26px;
  box-shadow:0 2px 6px rgba(70,60,130,.14),0 14px 34px -12px rgba(70,60,130,.40)}
.hdr::before{content:'';position:absolute;width:260px;height:260px;
  background:radial-gradient(circle,rgba(255,255,255,.16),transparent 68%);
  top:-110px;right:-70px;pointer-events:none}
.hdr::after{content:'';position:absolute;width:180px;height:180px;
  background:radial-gradient(circle,rgba(240,166,196,.20),transparent 70%);
  bottom:-90px;left:-50px;pointer-events:none}
.hdr-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);border-radius:99px;padding:5px 13px;
  font-size:9.5px;font-weight:700;color:rgba(255,255,255,.82);letter-spacing:1.6px;margin-bottom:15px}
.hdr-badge:before{content:'';width:5px;height:5px;border-radius:50%;background:#9DD9C4;
  box-shadow:0 0 0 3px rgba(157,217,196,.28)}
.hdr-name{font-family:'MaruBuri','Pretendard',sans-serif;font-size:27px;color:#fff;margin-bottom:5px;
  letter-spacing:-.5px;text-shadow:0 2px 12px rgba(40,30,90,.22)}
.hdr-sub{font-size:12.5px;color:rgba(255,255,255,.68);letter-spacing:-.1px}
.hdr-prog{display:flex;gap:6px;margin-top:16px}
.hdr-prog-seg{flex:1;height:4px;border-radius:99px;background:rgba(255,255,255,.22);transition:background .35s ease}
.hdr-prog-seg.on{background:#9DD9C4;box-shadow:0 0 8px rgba(157,217,196,.5)}
.hdr-prog-txt{font-size:11px;color:rgba(255,255,255,.62);margin-top:8px;font-variant-numeric:tabular-nums}
.hdr-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
/* 숙제온도 */
.hdr-temp{flex-shrink:0;text-align:center;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(8px);border-radius:15px;padding:9px 11px 8px;margin-top:22px}
.hdr-temp-lb{font-size:8.5px;font-weight:700;color:rgba(255,255,255,.72);letter-spacing:.3px;margin-bottom:6px}
.hdr-temp-tube{position:relative;width:17px;height:46px;margin:0 auto;background:rgba(255,255,255,.18);
  border-radius:99px;overflow:hidden}
.hdr-temp-fill{position:absolute;left:0;right:0;bottom:0;height:0;border-radius:99px 99px 0 0;
  background:linear-gradient(180deg,#E9C6F0,#F0A6C4);transition:height .6s cubic-bezier(.34,1.4,.64,1)}
.hdr-temp-bulb{width:21px;height:21px;margin:-6px auto 0;border-radius:50%;
  background:linear-gradient(140deg,#F0A6C4,#DE8FAC);box-shadow:0 2px 7px rgba(200,100,150,.35)}
.hdr-temp-txt{font-size:9px;font-weight:800;color:#FCE7F0;margin-top:5px;letter-spacing:-.2px}
/* 이번 달 지표 */
.hdr-stats{display:flex;gap:16px;margin-top:14px;padding-top:13px;border-top:1px solid rgba(255,255,255,.14)}
.hdr-stat{display:flex;flex-direction:column}
.hs-lb{font-size:9px;color:rgba(255,255,255,.6)}
.hs-v{font-size:17px;font-weight:800;color:#fff;margin-top:1px;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.hs-v span{font-size:10px;font-weight:600;color:rgba(255,255,255,.6);margin-left:1px}
/* 한 달 제출 잔디 */
.hdr-grass{display:grid;gap:1.5px;margin-top:11px}
.hdr-grass i{aspect-ratio:1;border-radius:1.5px;background:rgba(255,255,255,.12);display:block}
.hdr-grass i.one{background:rgba(255,255,255,.45)}
.hdr-grass i.both{background:#9DD9C4}
.hdr-grass i.future{background:rgba(255,255,255,.28)}
.hdr-grass-lb{font-size:8.5px;color:rgba(255,255,255,.45);margin-top:6px;font-variant-numeric:tabular-nums}
.logout-btn{position:absolute;top:14px;right:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.7);font-size:11px;border-radius:8px;padding:5px 10px;cursor:pointer;font-family:inherit}

/* Homework card (1 week) */
.hw-card{background:#fff;border-radius:22px;box-shadow:0 12px 32px rgba(120,105,205,.14),0 2px 6px rgba(120,105,205,.06);padding:22px;margin-top:-30px;position:relative;z-index:1;margin-bottom:16px;border-top:4px solid var(--pu)}
.hw-label{font-family:'Noto Sans KR','MaruBuri',sans-serif;font-size:9px;color:#AAA5C8;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.hw-item{background:#FBFAFF;border-radius:12px;padding:14px 16px;margin-bottom:10px;border-left:4px solid var(--pu)}
.hw-item-date{font-size:11px;color:#8B7FD9;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.hw-item-today{background:#7c3aed;color:#fff;border-radius:4px;padding:1px 7px;font-size:10px;font-weight:700}
.hw-item-content{font-size:14px;color:#374151;line-height:1.7;font-weight:500}
.hw-title{font-family:'MaruBuri','Noto Sans KR',sans-serif;font-size:18px;margin-bottom:14px;background:linear-gradient(135deg,#8B7FD9,#A89BEB);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hw-date{font-size:12px;color:#AAA5C8;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.hw-content{background:#FBFAFF;border-radius:10px;padding:14px 16px;font-size:14px;color:#374151;line-height:1.7;font-weight:500}
.hw-empty{font-size:13px;color:#AAA5C8;text-align:center;padding:20px 0;font-style:italic}
.hw-nav{display:flex;gap:8px;margin-top:12px}
.hw-nav-btn{background:#f1f5f9;border:none;border-radius:8px;padding:6px 12px;font-size:12px;color:#475569;cursor:pointer;font-family:inherit;transition:.15s}
.hw-nav-btn:hover{background:#e2e8f0}
.hw-nav-btn.active{background:var(--pu);color:#fff}

/* Planner upload */
.pc-head{position:relative;padding:20px 22px 4px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
/* ── Day timeline ── */
.tl-wrap{margin-bottom:16px}
.tl-daybar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 4px 12px}
.tl-dayname{font-size:12.5px;font-weight:700;color:#8B7FD9;letter-spacing:-.2px;font-variant-numeric:tabular-nums;
  background:rgba(139,127,217,.10);padding:5px 12px;border-radius:99px}
.tl-back{display:none;border:1px solid rgba(240,166,196,.55);background:#fff;color:#B4527C;border-radius:99px;
  padding:5px 12px;font-size:11.5px;font-weight:700;font-family:inherit;cursor:pointer}
.tl{position:relative;padding-left:34px}
.tl-spine{position:absolute;left:5px;top:16px;bottom:16px;width:2px;border-radius:2px;
  background:linear-gradient(180deg,#CFC8F1,#8B7FD9 55%,#4B4380)}
.tl-node{position:relative;margin-bottom:13px}
.tl-dot{position:absolute;left:-34px;top:19px;width:12px;height:12px;border-radius:50%;background:#FBFAFF;
  box-shadow:0 0 0 2px #A89BEB;transition:.3s cubic-bezier(.34,1.56,.64,1)}
.tl-dot.neutral{box-shadow:0 0 0 2px #D6D1EE;background:#EFECF9}
.tl-dot.filled{background:#9DD9C4;box-shadow:0 0 0 3.5px #FBFAFF,0 0 0 5px #9DD9C4}
.tl-card{position:relative;background:#fff;border-radius:18px;padding:15px 17px;overflow:hidden;
  box-shadow:0 1px 2px rgba(70,60,130,.05),0 8px 22px -9px rgba(70,60,130,.22);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s ease}
.tl-card.paper:before{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,transparent 0 24px,rgba(107,95,184,.055) 24px 25px)}
.tl-card.paper:after{content:'';position:absolute;top:0;bottom:0;left:13px;width:1px;background:rgba(240,166,196,.28)}
#cardPlan,#cardDone{cursor:pointer}
#cardPlan:hover,#cardDone:hover{transform:translateY(-2px);box-shadow:0 12px 28px -10px rgba(70,60,130,.30)}
.tl-card.sel{background:linear-gradient(160deg,#F5F2FE,#EAE5FA);box-shadow:0 0 0 1.5px #A89BEB,0 10px 26px -9px rgba(107,95,184,.34)}
.tl-cap{position:relative;font-size:9.5px;letter-spacing:1.6px;font-weight:700;color:#C4C0DA}
.tl-card.sel .tl-cap{color:#8B7FD9}
.tl-title{position:relative;font-size:14.5px;font-weight:800;color:#3D3860;margin-top:5px;letter-spacing:-.3px}
.tl-state{position:relative;font-size:11.5px;font-weight:600;color:#C4C0DA;margin-top:4px;font-variant-numeric:tabular-nums}
.tl-state.ok{color:#56A08A}
.tl-act{margin-top:4px}
.tl-act-lb{font-size:11.5px;font-weight:700;color:#8B7FD9;padding:0 4px 9px}
.tl-cmt{position:relative;margin-top:11px;padding-top:10px;border-top:1px dashed rgba(139,127,217,.22);display:none}
.tl-cmt-h{font-size:9.5px;letter-spacing:1.3px;font-weight:700;color:#56A08A;margin-bottom:5px}
.tl-cmt-b{font-size:12.5px;color:#3F6E5E;line-height:1.7;white-space:pre-wrap}
.tl-cmt-wait{font-size:11.5px;color:#C4C0DA}
.tl-card.yest{background:linear-gradient(160deg,#EDF9F4,#DFF2EA);box-shadow:0 0 0 1.5px #86CDB2,0 10px 26px -9px rgba(86,160,138,.28)}
.tl-card.yest .tl-cap{color:#3F8A72}
.tl-card.yest .tl-cmt{display:block;border-top-color:rgba(86,160,138,.28)}
.cmt-read{position:relative;width:100%;margin-top:12px;border:1px solid rgba(86,160,138,.32);background:#fff;color:#3F8A72;
  border-radius:12px;padding:10px;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;transition:.2s}
.cmt-read:hover{background:#F3FBF8;transform:translateY(-1px)}
.tl-daynav{display:flex;align-items:center;gap:2px}
.tl-arrow{border:none;background:none;font-family:inherit;font-size:19px;line-height:1;color:#C4C0DA;
  cursor:pointer;padding:2px 7px;border-radius:9px;transition:.2s}
.tl-arrow:hover{color:#8B7FD9;background:rgba(139,127,217,.10)}
.tl-wrap.off-today .tl-arrow:hover{color:#B4527C;background:rgba(240,166,196,.16)}
.hw-latest{position:relative}
.hw-item-date{font-size:11px;color:#8B7FD9;font-weight:700;margin:9px 0 6px;display:flex;align-items:center;gap:6px}
.hw-item-today{background:#8B7FD9;color:#fff;border-radius:5px;padding:1px 7px;font-size:9.5px;font-weight:700}
.hw-item-content{font-size:13px;color:#5C5680;line-height:1.75;font-weight:500}
.hw-more{position:relative;font-size:10.5px;color:#C4C0DA;margin-top:9px;padding-top:8px;border-top:1px dashed rgba(139,127,217,.2)}
.pdm-jump{width:100%;margin-top:10px;border:1px solid rgba(139,127,217,.25);background:#fff;color:#8B7FD9;
  border-radius:12px;padding:11px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer}
/* 다른 날짜 보는 중 */
.tl-wrap.off-today .tl-dayname{background:rgba(240,166,196,.16);color:#B4527C}
.tl-wrap.off-today .tl-back{display:block}
.tl-wrap.off-today .tl-spine{background:linear-gradient(180deg,#F6D3E1,#F0A6C4)}
.tl-wrap.off-today .tl-card.sel{background:linear-gradient(160deg,#FFF8FB,#FDEDF4);box-shadow:0 0 0 1.5px #F0A6C4,0 10px 26px -9px rgba(200,100,150,.32)}
.tl-wrap.off-today .tl-card.sel .tl-cap{color:#B4527C}
.tl-wrap.off-today .tl-act-lb{color:#B4527C}
.tl-wrap.off-today .upload-btn{background:linear-gradient(135deg,#D4749B,#F0A6C4);box-shadow:0 6px 18px rgba(200,100,150,.28)}
/* 계획 = 이른 시간(라벤더) · 완료 = 하루 끝(민트) */
/* 제출 완료 배지 */
.done-box{margin:0 0 14px;padding:14px;border-radius:20px;text-align:center;
  background:linear-gradient(160deg,#FBFAFF,#F5F2FD);border:1px solid rgba(139,127,217,.13);
  box-shadow:inset 0 1px 0 #fff}
.done-thumb{font-size:12px;color:#AAA5C8;min-height:70px;display:flex;align-items:center;justify-content:center}
.done-thumb img{width:100%;border-radius:13px;border:4px solid #fff;box-shadow:0 2px 6px rgba(120,105,205,.10),0 10px 26px -8px rgba(120,105,205,.26)}
.redo-btn{margin-top:12px;border:1px solid rgba(139,127,217,.22);background:#fff;color:#8B7FD9;border-radius:13px;
  padding:9px 18px;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;
  box-shadow:0 2px 8px rgba(120,105,205,.10);transition:.25s}
.redo-btn:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(120,105,205,.16);border-color:#A89BEB}
/* 오늘이 아닌 날짜 = 경고 상태 */
.pc-title{font-family:'MaruBuri','Noto Sans KR',sans-serif;font-size:16px;background:linear-gradient(135deg,#8B7FD9,#A89BEB);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.upload-btn{width:100%;margin:0 0 6px;background:linear-gradient(135deg,#8B7FD9,#A89BEB);color:#fff;border:none;border-radius:16px;padding:15px;letter-spacing:-.2px;box-shadow:0 6px 18px rgba(139,127,217,.28),inset 0 1px 0 rgba(255,255,255,.28);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px}
.upload-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 26px rgba(139,127,217,.34),inset 0 1px 0 rgba(255,255,255,.28)}
.upload-btn:active:not(:disabled){transform:translateY(0)}
.upload-btn:disabled{background:#EFECF9;color:#B9B4D2;cursor:not-allowed;box-shadow:none}
.preview-img{width:100%;border-radius:16px;margin:0 0 14px;object-fit:cover;max-height:300px;display:none;
  border:5px solid #fff;box-shadow:0 2px 6px rgba(120,105,205,.10),0 12px 30px -8px rgba(120,105,205,.28)}
.prog-bar{height:5px;background:#EDEAF9;border-radius:99px;margin:0 20px 12px;overflow:hidden;display:none}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--pu),var(--pud));border-radius:99px;transition:width .3s}
.upload-msg{font-size:12px;text-align:center;margin:0 20px 8px;min-height:16px}
.upload-msg.ok{color:#15803d}
.upload-msg.err{color:#ef4444}

/* Planner history */
.plan-list{padding:0 20px 20px}
.plan-item{background:#f8fafc;border-radius:12px;margin-bottom:12px;overflow:hidden;border:1px solid rgba(120,100,200,.10)}
.plan-item-head{padding:12px 14px 8px;display:flex;align-items:center;justify-content:space-between}
.plan-date{font-size:13px;font-weight:600;color:#374151}
.plan-img{width:100%;max-height:280px;object-fit:cover;cursor:pointer}
.plan-comment{background:#f0fdf4;border-top:1px solid #dcfce7;padding:10px 14px;font-size:13px;color:#166534;line-height:1.6}
.plan-comment-head{font-size:11px;font-weight:700;color:#15803d;margin-bottom:3px;display:flex;align-items:center;gap:4px}
.plan-no-comment{padding:10px 14px;font-size:12px;color:#AAA5C8;font-style:italic}

/* Image lightbox */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:90vh;border-radius:10px;object-fit:contain}
.lightbox-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:22px;width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}

.empty-plan{text-align:center;padding:28px;color:#AAA5C8;font-size:13px}
/* Planner calendar */
.plan-cal-wrap{padding:12px 14px 16px}
.plan-cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.plan-cal-month{font-size:13px;font-weight:700}
.plan-cal-btn{background:#f1f5f9;border:none;border-radius:7px;width:28px;height:28px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:#475569}
.plan-cal-btn:hover{background:#e2e8f0}
.plan-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.plan-cal-dow{text-align:center;font-size:10px;font-weight:600;color:#AAA5C8;padding:2px 0}
.plan-cal-dow:first-child{color:#ef4444}.plan-cal-dow:last-child{color:#3b82f6}
.plan-cal-day{min-height:44px;border-radius:8px;padding:3px 4px;display:flex;flex-direction:column;cursor:pointer;border:1.5px solid transparent;background:#fafbfc;transition:.12s}
.plan-cal-day:hover{background:#f0f4f8;border-color:#e2e8f0}
.plan-cal-day.today{border-color:#a78bfa;background:#faf5ff}

<script>
function today(){
  const d=new Date();
  if(d.getHours()<3) d.setDate(d.getDate()-1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
// 계획 플래너: 오후 10시 이후 → 다음날
function todayForPlan(){
  // 내일 계획은 전용 노드에서 올리므로 계획 플래너는 항상 '오늘'
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
// 완료 플래너: 새벽 4시 기준
function todayForDone(){
  const d=new Date();
  if(d.getHours()<4) d.setDate(d.getDate()-1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
let db, stuId = null, stuData = null, selectedFile = null, sessions = {}, planType = 'plan', plannerData = {}, planYear, planMonth, od4pData = {};

window.addEventListener('DOMContentLoaded', () => {
  if (typeof SM_CONFIG === 'undefined' || !SM_CONFIG.apiKey || SM_CONFIG.apiKey.includes('여기에')) {
    document.getElementById('loginPage').innerHTML = '<div style="color:#fff;text-align:center;padding:40px"><h2>설정 필요</h2></div>';
    return;
  }
  try {
    if (!firebase.apps.length) firebase.initializeApp(SM_CONFIG);
    db = firebase.database();
  } catch(e) { alert('Firebase 오류: ' + e.message); return; }
  document.getElementById('planDate').value = todayForPlan();
  renderPlanSlots();
});

async function doLogin() {
  const pw = document.getElementById('pwIn').value;
  if (!pw) return;
  const err = document.getElementById('lerr');
  err.textContent = '';
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
  const hash = [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
  const snap = await db.ref('smStudents').get();
  const all = snap.val() || {};
  const entry = Object.entries(all).find(([,s]) => s.studentPwHash === hash);
  if (entry) {
    stuId = entry[0];
    stuData = entry[1];
    sessionStorage.setItem('stuId', stuId);
    sessionStorage.setItem('stuHash', hash);
    showApp();
  } else {
    err.textContent = '비밀번호가 올바르지 않습니다';
  }
}

function logout() {
  sessionStorage.removeItem('stuId');
  sessionStorage.removeItem('stuHash');
  location.reload();
}

// 교재 질문 탭 배지: 영상이 아직 없는 질문 수
async function updateTbBadge() {
  var el = document.getElementById('tbBadge');
  if (!el || !stuId) return;
  try {
    var asg = (await db.ref('smTbAssign/' + stuId).get()).val();
    if (!asg) return;
    var tids = Array.isArray(asg) ? asg : [asg];
    var pending = 0;
    for (var t = 0; t < tids.length; t++) {
      var tid = tids[t];
      var mine = (await db.ref('smTbQuestions/' + tid + '/' + stuId).get()).val() || {};
      var keys = Object.keys(mine);
      if (!keys.length) continue;
      // 문제 전체가 아니라 내가 체크한 키만 개별 조회한다 (payload 최소)
      var res = await Promise.all(keys.map(function (k) {
        return db.ref('smTextbooks/' + tid + '/problems/' + k + '/youtubeUrl').get()
          .then(function (sn) { return sn.val(); }).catch(function () { return null; });
      }));
      pending += res.filter(function (v) { return !v; }).length;
    }
    // 교재 외 질문도 합산
    var fq = (await db.ref('smFreeQuestions/' + stuId).get()).val() || {};
    pending += Object.values(fq).filter(function (q) { return q && !q.youtubeUrl; }).length;

    if (pending > 0) { el.textContent = pending > 99 ? '99+' : pending; el.style.display = 'block'; }
    else el.style.display = 'none';
  } catch (e) {}
}


// preauth 해제: 자동 로그인 성공/실패가 확정되면 스플래시를 걷는다
function endPreauth(showLogin){
  document.documentElement.className=document.documentElement.className.replace(/\s*preauth/,'');
  var sp=document.getElementById('splash'); if(sp) sp.style.display='none';
  if(showLogin){
    try{ sessionStorage.removeItem('stuId'); sessionStorage.removeItem('stuHash'); }catch(e){}
    var lp=document.getElementById('loginPage'); if(lp) lp.style.display='flex';
  }
}

function showApp() {
  endPreauth(false);
  var _tb=document.querySelector('.tabbar'); if(_tb) _tb.style.display='flex';
  updateTbBadge();
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('stuName').textContent = stuData.name || '';
  document.getElementById('stuSub').textContent = `${stuData.grade||''} · ${stuData.subj||'수학'}`;
  // Load sessions for homework
  db.ref(`smSessions/${stuId}`).on('value', s => {
    sessions = s.val() || {};
    renderHomework();
    renderHeaderStats();
  });
  // Load planners
  db.ref(`smPlanners/${stuId}`).on('value', s => {
    _planAll = s.val() || {};
    renderPlanners(_planAll);
    renderPlanSlots();
  });
  // Load od4p - 오늘 날짜만 로드 (전체 트리 다운로드 방지)
  function loadOd4pForDate(dateStr) {
    db.ref('od4p/' + dateStr).get().then(s => {
      const subjects = s.val() || {};
      od4pData[dateStr] = [];
      Object.entries(subjects).forEach(([subKey, sub]) => {
        const subs = sub.submissions || {};
        const myEntry = Object.values(subs).find(e => e.name === stuData.name);
        if (myEntry) {
          var problems = sub.problems || {};
          var probArr = Object.values(problems);
          var myAnswers = myEntry.answers || {};
          var score = 0, total = probArr.length, wrongNums = [];
          probArr.forEach(function(p, i) {
            var ua = String(myAnswers[i] || '').trim();
            var correct = p.type === '객관식' ? ua === String(p.answer) : ua.replace(/\s/g,'') === String(p.answer).replace(/\s/g,'');
            if (correct) score++; else wrongNums.push(i+1);
          });
          od4pData[dateStr].push({
            subject: sub.title || ({'gongmath1':'공통수학1','gongmath2':'공통수학2','daesoo1':'대수(수1)','mij1':'미적분1(수2)'})[subKey] || subKey, answers: myAnswers,
            score, total, wrongNums, ts: myEntry.ts || 0
          });
        }
      });
      if (_planCalYear) renderPlanCal();
    });
  }
  // 오늘 + 달력에 보이는 최근 30일 로드
  const _todayStr = today();
  const _d = new Date();
  for (let i = 0; i < 30; i++) {
    const dd = new Date(_d);
    dd.setDate(_d.getDate() - i);
    const ds = dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0')+'-'+String(dd.getDate()).padStart(2,'0');
    // 제출 기록이 있는 날짜만 로드 (submissions 존재 여부 먼저 체크)
    db.ref('od4p/' + ds).get().then(s => {
      if (!s.exists()) return;
      const subjects = s.val() || {};
      const hasMyEntry = Object.values(subjects).some(sub =>
        Object.values(sub.submissions || {}).some(e => e.name === stuData.name)
      );
      if (hasMyEntry) loadOd4pForDate(ds);
    });
  }
}

// ── Homework ──
function renderHomework() {
  const todayStr = today();
  // 오늘로부터 7일 전
  // 타임존 버그 없는 7일 전 계산
  const _wd = new Date(); _wd.setDate(_wd.getDate() - 7);
  const weekAgo = _wd.getFullYear() + '-' + String(_wd.getMonth()+1).padStart(2,'0') + '-' + String(_wd.getDate()).padStart(2,'0');
  const arr = Object.values(sessions)
    .filter(r => r.hwC && r.date && r.date >= weekAgo)
    .sort((a,b) => (b.date||'').localeCompare(a.date||''));
  const el = document.getElementById('hwContent');
  if (!arr.length) {
    el.innerHTML = '<div class="hw-empty">최근 1주일 내 숙제가 없습니다</div>';
    return;
  }
  const r = arr[0];
  const [y,m,d] = r.date.split('-');
  const isToday = r.date === todayStr;
  const more = arr.length > 1
    ? `<div class="hw-more">이전 숙제 ${arr.length - 1}건은 아래 달력에서 볼 수 있어요</div>` : '';
  el.innerHTML = `<div class="hw-latest">
      <div class="hw-item-date">${+m}월 ${+d}일${isToday ? '<span class="hw-item-today">오늘</span>' : ''}</div>
      <div class="hw-item-content">${r.hwC}</div>
    </div>${more}`;
}

// ── Planner upload ──
// 직접 고른 날짜는 그날 안에서는 유지하고, 날이 바뀌면 자동으로 오늘로 되돌린다
function updatePlanDateNotice() { renderPlanSlots(); }

var _planAll = {}, _redo = false;

// _baseDate: 타임라인이 보여주는 날 (null이면 오늘) / planDate: 실제로 올릴 날
var _baseDate = null, _selSlot = 'plan';
function addDays(ds, n) {
  var d = new Date(ds + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function baseDate() { return _baseDate || todayForPlan(); }
function slotDate(slot) { return slot === 'next' ? addDays(baseDate(), 1) : baseDate(); }
function slotType(slot) { return slot === 'done' ? 'done' : 'plan'; }
function planTargetDate() { return slotDate(_selSlot); }
// 해당 날짜·유형의 제출 기록 (가장 최근 것)
function findSubmission(date, type) {
  var best = null;
  Object.keys(_planAll || {}).forEach(function (pid) {
    var p = _planAll[pid] || {};
    if (p.date === date && p.type === type) {
      if (!best || (p.ts || 0) > (best.ts || 0)) best = { pid: pid, ts: p.ts || 0, comment: p.comment || '', cRead: !!p.cRead };
    }
  });
  return best;
}
function fmtTime(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
}
// 숙제온도: 최근 5회 별점 평균 (0=안함 제외)
var TEMP_LV=[[4.5,'아주 뜨거워요'],[3.5,'잘 하고 있어요'],[2.5,'따뜻해지는 중'],[1.5,'조금씩 올려봐요'],[0,'이제 시작이에요']];
function calcTemp(){
  var arr=Object.values(sessions||{})
    .filter(function(r){ return r && r.eval != null && r.eval > 0; })
    .sort(function(a,b){ return String(b.date||'').localeCompare(String(a.date||'')); })
    .slice(0,5);
  if(!arr.length) return null;
  var avg=arr.reduce(function(a,r){ return a + r.eval; },0)/arr.length;
  var lv=TEMP_LV.find(function(l){ return avg>=l[0]; });
  return { pct: Math.round(avg/5*100), txt: lv[1] };
}
// 헤더의 이번 달 지표 + 한 달 잔디
function renderHeaderStats(){
  var now=new Date(), y=now.getFullYear(), m=now.getMonth();
  var days=new Date(y,m+1,0).getDate(), todayD=now.getDate();
  var pad=function(n){ return String(n).padStart(2,'0'); };
  var pre=y+'-'+pad(m+1)+'-';

  // 날짜별 제출 유형 집계
  var byDay={};
  Object.values(_planAll||{}).forEach(function(p){
    if(!p||!p.date||p.date.indexOf(pre)!==0) return;
    var d=parseInt(p.date.slice(8),10);
    if(!byDay[d]) byDay[d]={};
    byDay[d][p.type]=1;
  });
  var nPlan=0,nDone=0;
  Object.keys(byDay).forEach(function(d){
    if(byDay[d].plan) nPlan++;
    if(byDay[d].done) nDone++;
  });
  var nCmt=Object.values(_planAll||{}).filter(function(p){
    return p && p.date && p.date.indexOf(pre)===0 && p.comment;
  }).length;

  var set=function(id,v,u){ var e=document.getElementById(id); if(e) e.innerHTML=v+'<span>'+u+'</span>'; };
  set('hsPlan',nPlan,'일'); set('hsDone',nDone,'일'); set('hsCmt',nCmt,'개');

  var g=document.getElementById('hdrGrass');
  if(g){
    g.style.gridTemplateColumns='repeat('+days+',1fr)';
    var h='';
    for(var d=1;d<=days;d++){
      var v=byDay[d]||{};
      var cls = d>todayD ? 'future' : (v.plan&&v.done ? 'both' : (v.plan||v.done ? 'one' : ''));
      h+='<i class="'+cls+'"></i>';
    }
    g.innerHTML=h;
  }
  var lb=document.getElementById('hdrGrassLb');
  if(lb) lb.textContent=(m+1)+'월 1일 → '+days+'일';

  var t=calcTemp(), box=document.getElementById('hdrTemp');
  if(box){
    if(!t){ box.style.display='none'; }
    else{
      box.style.display='';
      document.getElementById('hTempFill').style.height=Math.max(6,t.pct)+'%';
      document.getElementById('hTempTxt').textContent=t.txt;
    }
  }
}

var WD = ['일','월','화','수','목','금','토'];
function fmtDay(ds) {
  var d = new Date(ds + 'T00:00:00');
  return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + WD[d.getDay()] + ')';
}
function renderPlanSlots() {
  var base = baseDate();
  var isToday = (base === todayForPlan());
  var wrap = document.getElementById('tlWrap');
  document.getElementById('tlDayName').textContent = (isToday ? '오늘 · ' : '') + fmtDay(base);
  wrap.className = 'tl-wrap' + (isToday ? '' : ' off-today');

  // 내일 계획 노드는 오늘 화면에서만
  var nn = document.getElementById('nodeNext');
  if (nn) nn.style.display = isToday ? '' : 'none';
  var ntl = document.getElementById('nextTitle');
  if (ntl) ntl.textContent = fmtDay(addDays(base, 1)) + ' 계획 플래너';

  [['plan','cardPlan','statePlan','dotPlan'],
   ['done','cardDone','stateDone','dotDone'],
   ['next','cardNext','stateNext','dotNext']].forEach(function (a) {
    var slot = a[0];
    var sub = findSubmission(slotDate(slot), slotType(slot));
    var card = document.getElementById(a[1]);
    var st = document.getElementById(a[2]);
    var dot = document.getElementById(a[3]);
    if (!card || !st || !dot) return;
    card.className = 'tl-card paper' + (_selSlot === slot ? ' sel' : '');
    dot.className = 'tl-dot' + (sub ? ' filled' : '');
    st.className = 'tl-state' + (sub ? ' ok' : '');
    st.textContent = sub ? ('제출 완료 · ' + fmtTime(sub.ts)) : '눌러서 사진 올리기';
  });

  // 카드 안 코멘트
  [['plan','cmtPlan'],['done','cmtDone']].forEach(function (a) {
    var sub = findSubmission(baseDate(), a[0]);
    var el = document.getElementById(a[1]);
    if (!el) return;
    if (!sub) { el.innerHTML = ''; el.style.display = 'none'; return; }
    el.style.display = 'block';
    el.innerHTML = sub.comment
      ? '<div class="tl-cmt-h">선생님 코멘트</div><div class="tl-cmt-b">' + esc(sub.comment).split('\n').join('<br>') + '</div>'
      : '<div class="tl-cmt-wait">코멘트 대기 중</div>';
  });
  renderYesterdayNode();

  renderHeaderStats();
  // 헤더 진행 표시 (오늘 기준)
  (function () {
    var nd = todayForPlan();
    var a = !!findSubmission(nd, 'plan'), b = !!findSubmission(nd, 'done');
    var ep = document.getElementById('hprogPlan'), ed = document.getElementById('hprogDone');
    if (ep) ep.className = 'hdr-prog-seg' + (a ? ' on' : '');
    if (ed) ed.className = 'hdr-prog-seg' + (b ? ' on' : '');
    var t = document.getElementById('hprogTxt');
    if (t) t.textContent = '오늘 플래너 ' + ((a ? 1 : 0) + (b ? 1 : 0)) + ' / 2 제출';
  })();

  var lab = document.getElementById('tlActLb');
  if (lab) lab.textContent = (_selSlot === 'done' ? '완료' : '계획') + ' 플래너 · ' + fmtDay(planTargetDate());

  var sub = findSubmission(planTargetDate(), planType);
  var doneBox = document.getElementById('doneBox');
  var upWrap = document.getElementById('uploadWrap');
  var act = document.getElementById('tlAct');
  var staged = !!(document.getElementById('previewImg') || {}).src && document.getElementById('previewImg').style.display !== 'none';
  if (act) act.style.display = (sub && !_redo) || staged ? 'block' : 'none';
  if (sub && !_redo) {
    doneBox.style.display = 'block';
    upWrap.style.display = 'none';
    var t = document.getElementById('doneThumb');
    t.textContent = '불러오는 중...';
    loadPlannerImg(sub.pid).then(function (src) {
      if (src) t.innerHTML = '<img src="' + src + '">';
      else t.textContent = '사진을 불러오지 못했습니다';
    }).catch(function () { t.textContent = '사진을 불러오지 못했습니다'; });
  } else {
    doneBox.style.display = 'none';
    upWrap.style.display = 'block';
  }
}

// 카드를 누르면 그 슬롯을 선택하고 바로 사진 선택창을 연다
function tapSlot(slot) {
  var wasSel = (_selSlot === slot);
  var sub = findSubmission(slotDate(slot), slotType(slot));
  selectSlot(slot);
  if (sub && !_redo) return;          // 이미 제출됨 -> 사진만 보여줌

}
function selectSlot(slot) {
  _selSlot = slot;
  planType = slotType(slot);

  var inp = document.getElementById('planDate');

function esc(t) {
  return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

async function uploadPlanner() {
  if (!selectedFile) return;
  const date = document.getElementById('planDate').value;
  if (!date) { alert('날짜를 선택하세요'); return; }
  const _lab = (planType === 'done' ? '완료' : '계획');
  const _t = todayForPlan();
  if (date !== _t && date !== addDays(_t, 1) && date !== todayForDone()) {
    if (!confirm(fmtDay(date) + ' ' + _lab + ' 플래너로 제출합니다.\n계속할까요?')) return;
  }
  const _prev = findSubmission(date, planType);
  if (_prev) {
    if (!confirm('이미 ' + _lab + ' 플래너를 제출했습니다.\n새 사진으로 바꿀까요? 기존 사진은 지워집니다.')) return;
  }

  const btn = document.getElementById('uploadBtn');
  const msg = document.getElementById('uploadMsg');
  const prog = document.getElementById('progBar');
  const fill = document.getElementById('progFill');
  btn.disabled = true;
  btn.innerHTML = '압축 중...';
  prog.style.display = 'block';
  fill.style.width = '30%';
  msg.textContent = '';

  try {
    // 압축 (용량 절감: 1280px, 0.7 품질)
    let imageData = await compressToBase64(selectedFile, 1280, 0.7);
    // 너무 크면 한 번 더 압축 (느린 네트워크에서 저장 실패 방지)
    if (imageData.length > 1500000) {
      imageData = await compressToBase64(selectedFile, 1000, 0.6);
    }
    if (imageData.length > 3000000) {
      throw new Error('사진 용량이 너무 큽니다. 다른 사진을 사용해 주세요.');
    }
    fill.style.width = '50%';
    btn.innerHTML = '저장 중...';

    const newRef = db.ref(`smPlanners/${stuId}`).push();
    const pid = newRef.key;
    // ★ 이미지를 먼저 저장 (성공해야 메타 기록 → "사진 있다고 표시되는데 없음" 방지)
    await db.ref(`smPlannerImages/${pid}`).set(imageData);
    fill.style.width = '80%';
    // 이미지 저장 성공 후 메타데이터 기록
    await newRef.set({ date, type: planType, hasImage: true, ts: Date.now() });

    fill.style.width = '100%';
    // 기존 제출본 정리 (새 사진 저장에 성공한 뒤에만)
    if (_prev && _prev.pid && _prev.pid !== pid) {
      try {
        await db.ref(`smPlannerImages/${_prev.pid}`).remove();
        await db.ref(`smPlanners/${stuId}/${_prev.pid}`).remove();
      } catch (e) {}
    }
    _redo = false;
    const label = planType === 'plan' ? '계획' : '완료';
    msg.textContent = `✅ ${label} 플래너 제출 완료!`;
    msg.className = 'upload-msg ok';
    setTimeout(() => { prog.style.display = 'none'; fill.style.width = '0%'; }, 600);
    document.getElementById('previewImg').style.display = 'none';
    document.getElementById('previewImg').src = '';
    document.getElementById('fileInput').value = '';
    selectedFile = null;
    btn.disabled = false;
    btn.innerHTML = '플래너 제출하기';
    setTimeout(() => { msg.textContent = ''; }, 4000);

  } catch(e) {
    console.error(e);
    msg.textContent = '❌ 오류: ' + e.message;
    msg.className = 'upload-msg err';
    prog.style.display = 'none';
    btn.disabled = false;
    btn.innerHTML = '플래너 제출하기';
  }
}

// 이미지 압축 (가로/세로 모두 maxDim 이하)
function compressToBase64(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = e => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        const max = Math.max(w, h);
        if (max > maxDim) { w = Math.round(w * maxDim / max); h = Math.round(h * maxDim / max); }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ── Planner calendar ──
var _planCalYear, _planCalMonth;
function renderPlanners(data) {
  plannerData = data;
  if (!_planCalYear) {
    var now = new Date();
    _planCalYear = now.getFullYear();
    _planCalMonth = now.getMonth();
  }
  renderPlanCal();
  renderPlannerComments();
}

function renderPlannerComments() { /* 코멘트는 타임라인 카드 안에서 표시 */ }
function changePlanMonth(dir) {
  _planCalMonth += dir;
  if (_planCalMonth > 11) { _planCalMonth = 0; _planCalYear++; }
  if (_planCalMonth < 0) { _planCalMonth = 11; _planCalYear--; }
  renderPlanCal();
}
function renderPlanCal() {
  var mn = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('planCalMonth').textContent = _planCalYear + '년 ' + mn[_planCalMonth];
  var todayStr = today();
  var firstDay = new Date(_planCalYear, _planCalMonth, 1).getDay();
  var daysInMonth = new Date(_planCalYear, _planCalMonth + 1, 0).getDate();
  var daysInPrev = new Date(_planCalYear, _planCalMonth, 0).getDate();
  var dateMap = {};
  Object.entries(plannerData).forEach(function([pid_,p]) {
    if (!p.date) return;
    if (!dateMap[p.date]) dateMap[p.date] = [];
    dateMap[p.date].push(Object.assign({},p,{_pid:pid_}));
  });
  var grid = document.getElementById('planCalGrid');
  grid.innerHTML = '<div class="plan-cal-dow">일</div><div class="plan-cal-dow">월</div><div class="plan-cal-dow">화</div><div class="plan-cal-dow">수</div><div class="plan-cal-dow">목</div><div class="plan-cal-dow">금</div><div class="plan-cal-dow">토</div>';
  for (var i = firstDay - 1; i >= 0; i--) {
    var cell = document.createElement('div');
    cell.className = 'plan-cal-day other-month';
    cell.innerHTML = '<span class="plan-cal-day-num">' + (daysInPrev - i) + '</span>';
    grid.appendChild(cell);
  }
  for (var d = 1; d <= daysInMonth; d++) {
    var ds = _planCalYear + '-' + String(_planCalMonth + 1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    var dow = (firstDay + d - 1) % 7;
    var plans = dateMap[ds] || [];
    var cell = document.createElement('div');
    var cls = 'plan-cal-day';
    if (ds === todayStr) cls += ' today';
    if (dow === 0) cls += ' sun';
    if (dow === 6) cls += ' sat';
    cell.className = cls;
    var dotsHtml = '';
    if (plans.length) {
      var hasPlan = plans.some(function(p){ return p.type !== 'done'; });
      var hasDone = plans.some(function(p){ return p.type === 'done'; });
      if (hasPlan) dotsHtml += '<div class="plan-cal-dot dot-plan-type"></div>';
      if (hasDone) dotsHtml += '<div class="plan-cal-dot dot-done-type"></div>';
      cell.style.background = '#faf5ff';
      cell.style.borderColor = '#e9d5ff';
    }
    var od4pEntries = od4pData[ds] || [];
    if (od4pEntries.length) {
      dotsHtml += '<div class="plan-cal-dot dot-od4p"></div>';
      if (!plans.length) { cell.style.background = '#fffbeb'; cell.style.borderColor = '#fde68a'; }
      // 점수 요약
      var totalScore = od4pEntries.reduce(function(a,e){return a+e.score;},0);
      var totalProbs = od4pEntries.reduce(function(a,e){return a+e.total;},0);
      if (totalProbs > 0) {
        var scoreEl = document.createElement('div');
        scoreEl.style.cssText='font-size:9px;color:#92400e;font-weight:700;line-height:1.2';
        scoreEl.textContent = totalScore+'/'+totalProbs;
        cell.appendChild(scoreEl);
      }
    }
    cell.innerHTML = '<span class="plan-cal-day-num">' + d + '</span>'
      + (dotsHtml ? '<div class="plan-cal-dots">' + dotsHtml + '</div>' : '');
    var od4pDay2 = od4pData[ds] || [];
    cell.style.cursor = 'pointer';
    (function(date, ps, hasOd) {
      cell.addEventListener('click', function() {
        // 기록이 있으면 상세, 없으면 바로 그날 타임라인으로 이동해 제출
        if (ps.length || hasOd) openPlanDetail(date, ps);
        else jumpToDate(date === todayForPlan() ? null : date);
      });
      cell.dataset.d = date;
    })(ds, plans, od4pDay2.length > 0);
    grid.appendChild(cell);
  }
  var total = firstDay + daysInMonth;
  var rem = (7 - total % 7) % 7;
  for (var d = 1; d <= rem; d++) {
    var cell = document.createElement('div');
    cell.className = 'plan-cal-day other-month';
    cell.innerHTML = '<span class="plan-cal-day-num">' + d + '</span>';
    grid.appendChild(cell);
  }
}
function openPlanDetail(ds, plans) {
  var parts = ds.split('-');
  var y = parts[0], m = +parts[1], d = +parts[2];
  document.getElementById('pdmDate').textContent = y + '년 ' + m + '월 ' + d + '일';
  var html = '';
  // od4p 성적 표시
  var od4pDay = od4pData[ds] || [];
  if (od4pDay.length) {
    od4pDay.forEach(function(e){
      var scoreColor = e.total > 0 ? (e.score/e.total >= 0.8 ? '#166534' : e.score/e.total >= 0.5 ? '#92400e' : '#b91c1c') : '#374151';
      html += '<div style="background:#fffbeb;border-left:3px solid #f59e0b;border-radius:0 10px 10px 0;padding:12px 14px;margin-bottom:10px">';
      html += '<div style="font-weight:700;color:#92400e;margin-bottom:6px;font-size:13px">OD4P — ' + (e.subject||'') + '</div>';
      if (e.total > 0) {
        html += '<div style="font-size:22px;font-weight:800;color:' + scoreColor + ';margin-bottom:4px">' + e.score + ' / ' + e.total + '점</div>';
        if (e.wrongNums && e.wrongNums.length > 0) {
          html += '<div style="font-size:11px;color:#ef4444;margin-top:2px">오답: ' + e.wrongNums.join('번, ') + '번</div>';
        } else {
          html += '<div style="font-size:11px;color:#166534;margin-top:2px">모두 정답!</div>';
        }
      } else {
        html += '<div style="font-size:12px;color:#92400e">' + Object.keys(e.answers).length + '문제 응시</div>';
      }
      html += '</div>';
    });
  }
  plans.sort(function(a,b){ return (a.ts||0)-(b.ts||0); }).forEach(function(p) {
    var badge = p.type === 'done'
      ? '<span class="plan-type-badge badge-done">✅ 완료</span>'
      : '<span class="plan-type-badge badge-plan">계획</span>';
    var commentHtml = p.comment
      ? '<div class="pdm-comment"><div class="pdm-comment-head">선생님 코멘트</div>' + p.comment.split('\n').join('<br>') + '</div>'
      : '<div class="pdm-no-comment">⏳ 코멘트 대기 중</div>';
    html += '<div class="pdm-item">';
    html += '<div class="pdm-item-head">' + badge + '</div>';
    const thumbSrc = p.thumbData || p.imageData || p.imageUrl || '';
    const pid_ = p._pid || '';
    if(thumbSrc){
      html += '<img class="pdm-img" src="' + thumbSrc + '" loading="lazy">';
    } else if(pid_){
      html += '<div class="pdm-img" id="pdmimg_' + pid_ + '" style="height:120px;background:#f1f5f9;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#94a3b8">로딩 중...</div>';
    }
    html += commentHtml + '</div>';
  });
  document.getElementById('pdmBody').innerHTML = html || '<div class="pdm-empty">기록이 없습니다</div>';
  // 신형 이미지 async 로드 (캐시 우선)
  plans.forEach(function(p){
    var pid_=p._pid||'';
    if(!pid_||p.thumbData||p.imageData||p.imageUrl) return;
    var el=document.getElementById('pdmimg_'+pid_);
    if(!el) return;
    loadPlannerImg(pid_).then(function(src){
      if(!src){el.style.display='none';return;}
      var img=document.createElement('img');
      img.className='pdm-img';img.src=src;img.loading='lazy';
      el.replaceWith(img);
    });
  });
  var jb = document.getElementById('pdmJump');
  if (jb) { jb.onclick = function(){ closePlanDetail(); jumpToDate(ds); }; }
  document.getElementById('planDetailOv').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closePlanDetail() {
  document.getElementById('planDetailOv').classList.remove('open');
  document.body.style.overflow = '';
}

  document.body.style.overflow = 'hidden';

// Auto-login if session exists
const PIC={
  _db:null,
  async db(){
    if(this._db) return this._db;
    return new Promise(res=>{
      const r=indexedDB.open('smtPlanner',1);
      r.onupgradeneeded=e=>e.target.result.createObjectStore('imgs',{keyPath:'pid'});
      r.onsuccess=e=>{this._db=e.target.result;res(this._db);};
      r.onerror=()=>res(null);
    });
  },
  async get(pid){
    try{
      const db=await this.db();if(!db)return null;
      return new Promise(res=>{
        const r=db.transaction('imgs').objectStore('imgs').get(pid);
        r.onsuccess=()=>{const v=r.result;res(v&&(Date.now()-v.ts)<60*86400000?v.src:null);};
        r.onerror=()=>res(null);
      });
    }catch{return null;}
  },
  async set(pid,src){
    try{
      const db=await this.db();if(!db)return;
      db.transaction('imgs','readwrite').objectStore('imgs').put({pid,src,ts:Date.now()});
    }catch{}
  },
  async del(pid){
    try{
      const db=await this.db();if(!db)return;
      db.transaction('imgs','readwrite').objectStore('imgs').delete(pid);
    }catch{}
  }
};
async function loadPlannerImg(pid){
  if(!pid)return null;
  try{
    const cached=await PIC.get(pid);
    if(cached)return cached;
    const snap=await db.ref('smPlannerImages/'+pid).get();
    const src=snap.val();
    if(src)PIC.set(pid,src);
    return src||null;
  }catch(e){
    console.error('이미지 로드 실패:',pid,e);
    return null;
  }
}

<script>
(function(){
  // URL에 _v 파라미터 있으면 제거 (이미 새로 받아온 것)
  var url=new URL(location.href);
  var urlVer=url.searchParams.get('_v');
  if(urlVer){
    localStorage.setItem('smv',urlVer);
    url.searchParams.delete('_v');
    history.replaceState(null,'',url.toString());
  }

  function getDB(){
    try{
      if(typeof firebase==='undefined') return null;
      if(firebase.apps&&firebase.apps.length>0) return firebase.database();
      if(typeof SM_CONFIG==='undefined'||!SM_CONFIG.apiKey||SM_CONFIG.apiKey.includes('여기에')) return null;
      firebase.initializeApp(SM_CONFIG);
      return firebase.database();
    }catch(e){return null;}
  }

  var _smvRef=null;
  function doCheck(){
    var db=getDB();
    if(!db) return;
    if(_smvRef) return;
    var urlVer=new URL(location.href).searchParams.get('_v');
    if(urlVer) localStorage.setItem('smv',urlVer);
    _smvRef=db.ref('smAppVersion');
    _smvRef.on('value',function(s){
      var sv=String(s.val()||'');
      if(!sv) return;
      var lv=localStorage.getItem('smv')||'';
      if(lv===sv) return;
      if(location.search.indexOf('_v='+sv)!==-1) return;
      location.replace(location.pathname+'?_v='+sv);
    });
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',function(){doCheck();});
  }else{doCheck();}
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible') doCheck();
  });
})();
</script>
